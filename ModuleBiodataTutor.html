  @media (prefers-reduced-motion:reduce){ #bioGate{transition:none;} .bio-pane{animation:none;} }
</style>

<script>
(function () {
  var BANKS = ['BCA', 'BRI', 'BNI', 'Mandiri', 'BSI', 'Seabank'];
  var MAPEL = [
    ['Umum', ['Semua mapel SD', 'Calistung']],
    ['Eksakta', ['Matematika', 'IPA', 'Fisika', 'Kimia', 'Biologi', 'Informatika']],
    ['Bahasa dan sosial', ['Bahasa Indonesia', 'Bahasa Inggris', 'IPS', 'Ekonomi', 'Geografi', 'Sejarah']]
  ];
  var KNOWN = {}; MAPEL.forEach(function (g) { g[1].forEach(function (m) { KNOWN[m.toLowerCase()] = m; }); });
  // Penulisan baku untuk mapel yang diketik sendiri (tidak tampil sebagai chip kecuali dipilih)
  var ALIAS = { 'ppkn': 'PPKn', 'pkn': 'PPKn', 'ipas': 'IPAS', 'mtk': 'Matematika', 'indo': 'Bahasa Indonesia', 'inggris': 'Bahasa Inggris', 'b. inggris': 'Bahasa Inggris', 'b. indonesia': 'Bahasa Indonesia', 'jawa': 'Bahasa Jawa', 'sosio': 'Sosiologi', 'agama': 'Pendidikan Agama' };
  function baku(v) {
    var k = v.toLowerCase();
    if (KNOWN[k]) return KNOWN[k];
    if (ALIAS[k]) return ALIAS[k];
    return v === k ? v.replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); }) : v;
  }
  var st = { step: 1, uid: null, hasTp: false, gender: '', mapel: [], extra: [] };
  var gate = document.getElementById('bioGate');
  var $ = function (id) { return document.getElementById(id); };

  function digits(v) { return String(v || '').replace(/\D/g, ''); }
  function clean(v) { return String(v || '').trim(); }

  function stepValid(n) {
    if (n === 1) return !!st.gender && digits($('bioWa').value).length >= 9;
    if (n === 2) return !!clean($('bioBank').value) && digits($('bioRek').value).length >= 5;
    return st.mapel.length > 0 && !!clean($('bioPend').value);
  }
  function firstMissing() { for (var i = 1; i <= 3; i++) if (!stepValid(i)) return i; return 0; }

  function syncNav() {
    $('bioNext').disabled = !stepValid(st.step);
    $('bioErr').hidden = true;
  }
  function render() {
    document.querySelectorAll('#bioGate .bio-pane').forEach(function (p) { p.hidden = +p.dataset.pane !== st.step; });
    document.querySelectorAll('#bioSteps [data-st]').forEach(function (d) {
      var n = +d.dataset.st; d.className = n < st.step ? 'done' : n === st.step ? 'now' : '';
    });
    document.querySelectorAll('#bioGate [data-li]').forEach(function (d) {
      var n = +d.dataset.li, c = n < st.step ? 'done' : n === st.step ? 'now' : '';
      d.className = 'bio-li ' + c;
      d.querySelector('i').className = c === 'done' ? 'ph-fill ph-check-circle' : c === 'now' ? 'ph-fill ph-pencil-circle' : 'ph ph-circle';
    });
    $('bioBack').hidden = st.step === 1;
    $('bioNext').textContent = st.step === 3 ? 'Simpan dan mulai' : 'Lanjut';
    syncNav();
  }

  // Jenis kelamin
  $('bioGender').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    st.gender = b.dataset.val;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    syncNav();
  });
  ['bioWa', 'bioRek', 'bioPend'].forEach(function (id) { $(id).addEventListener('input', syncNav); });

  // Bank: pilihan cepat mengisi kolom, kolom tetap bisa diketik
  function renderBanks() {
    var cur = clean($('bioBank').value).toLowerCase();
    $('bioBankChips').innerHTML = BANKS.map(function (b) {
      return '<button type="button" class="' + (cur === b.toLowerCase() ? 'on' : '') + '" data-bank="' + b + '">' + b + '</button>';
    }).join('') + '<button type="button" data-bank="">Lainnya</button>';
  }
  $('bioBankChips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $('bioBank').value = b.dataset.bank; renderBanks(); syncNav();
    if (!b.dataset.bank) $('bioBank').focus(); else $('bioRek').focus();
  });
  $('bioBank').addEventListener('input', function () { renderBanks(); syncNav(); });

  // Mapel: chip pilihan, mapel di luar daftar tampil di kelompok Lainnya
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function chip(m) {
    var on = st.mapel.indexOf(m) > -1;
    return '<button type="button" class="' + (on ? 'on' : '') + '" data-m="' + esc(m) + '">' + (on ? '<i class="ph ph-check" aria-hidden="true"></i>' : '') + esc(m) + '</button>';
  }
  function renderMapel() {
    var html = MAPEL.map(function (g, i) {
      var tail = i === MAPEL.length - 1 && !st.extra.length ? '<button type="button" class="bio-add" id="bioAddBtn"><i class="ph ph-plus" aria-hidden="true"></i>Lainnya</button>' : '';
      return '<div class="bio-grp">' + g[0] + '</div><div class="bio-mapel">' + g[1].map(chip).join('') + tail + '</div>';
    }).join('');
    if (st.extra.length) html += '<div class="bio-grp">Lainnya</div><div class="bio-mapel">' + st.extra.map(chip).join('') + '<button type="button" class="bio-add" id="bioAddBtn"><i class="ph ph-plus" aria-hidden="true"></i>Tambah</button></div>';
    $('bioMapel').innerHTML = html;
    $('bioMapelCnt').textContent = st.mapel.length + ' dipilih';
    syncNav();
  }
  $('bioMapel').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'bioAddBtn') { $('bioAddRow').hidden = false; $('bioAddIn').focus(); return; }
    var m = b.dataset.m, i = st.mapel.indexOf(m);
    if (i > -1) st.mapel.splice(i, 1); else st.mapel.push(m);
    renderMapel();
  });
  function addMapel() {
    var v = clean($('bioAddIn').value).replace(/\s+/g, ' ');
    if (!v) { $('bioAddRow').hidden = true; return; }
    v = baku(v);
    var k = KNOWN[v.toLowerCase()] || st.extra.filter(function (x) { return x.toLowerCase() === v.toLowerCase(); })[0];
    if (!k) { k = v; st.extra.push(k); }
    if (st.mapel.indexOf(k) < 0) st.mapel.push(k);
    $('bioAddIn').value = ''; $('bioAddRow').hidden = true; renderMapel();
  }
  $('bioAddOk').addEventListener('click', addMapel);
  $('bioAddIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addMapel(); } });

  // Navigasi
  $('bioBack').addEventListener('click', function () { if (st.step > 1) { st.step--; render(); } });
  $('bioNext').addEventListener('click', function () {
    if (!stepValid(st.step)) return;
    if (st.step < 3) { st.step++; render(); gate.scrollTop = 0; return; }
    save();
  });
  $('bioOut').addEventListener('click', function () { if (typeof genioLogout === 'function') genioLogout(); });

  function showErr(msg) { var e = $('bioErr'); e.querySelector('span').textContent = msg; e.hidden = false; }

  async function save() {
    var s = genioGetSession(); if (!s) return;
    var btn = $('bioNext'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Menyimpan...';
    var wa = digits($('bioWa').value).replace(/^62/, '0');
    var tp = {
      no_wa: wa, nama_bank: clean($('bioBank').value), no_rekening: digits($('bioRek').value),
      keahlian: st.mapel.slice(), pendidikan_terakhir: clean($('bioPend').value)
    };
    try {
      await supaRest('users?id=eq.' + st.uid, s.access_token, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ jenis_kelamin: st.gender, no_hp: wa }) });
      if (st.hasTp) {
        await supaRest('tutor_profile?user_id=eq.' + st.uid, s.access_token, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify(tp) });
      } else {
        tp.user_id = st.uid;
        await supaRest('tutor_profile', s.access_token, { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify(tp) });
      }
      close();
      if (typeof genioToast === 'function') genioToast('Biodata tersimpan', 'success');
      document.dispatchEvent(new CustomEvent('genio:biodata'));
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Simpan dan mulai';
      showErr('Gagal menyimpan. Periksa koneksi lalu coba lagi.');
    }
  }

  function open() {
    gate.hidden = false; document.body.classList.add('bio-open');
    requestAnimationFrame(function () { gate.classList.add('show'); });
  }
  function close() {
    gate.classList.remove('show'); document.body.classList.remove('bio-open');
    setTimeout(function () { gate.hidden = true; }, 260);
  }

  // Dipanggil Dashboard.html saat tutor masuk
  async function check() {
    var s = genioGetSession(); if (!s || s.role !== 'tutor') return;
    try {
      var rows = await supaRest('users?id=eq.' + s.user_id + '&select=nama,jenis_kelamin,no_hp,tutor_profile(keahlian,pendidikan_terakhir,no_wa,nama_bank,no_rekening)', s.access_token);
      var me = rows && rows[0]; if (!me) return;
      var p = Array.isArray(me.tutor_profile) ? me.tutor_profile[0] : me.tutor_profile;
      st.uid = s.user_id; st.hasTp = !!p; p = p || {};
      st.gender = me.jenis_kelamin === 'L' || me.jenis_kelamin === 'P' ? me.jenis_kelamin : '';
      document.querySelectorAll('#bioGender button').forEach(function (x) { x.classList.toggle('on', x.dataset.val === st.gender); });
      $('bioWa').value = p.no_wa || me.no_hp || '';
      $('bioBank').value = p.nama_bank || '';
      $('bioRek').value = p.no_rekening || '';
      $('bioPend').value = p.pendidikan_terakhir || '';
      st.mapel = []; st.extra = [];
      (p.keahlian || []).forEach(function (k) {
        k = clean(k); if (!k) return;
        var name = KNOWN[k.toLowerCase()];
        if (!name) { name = k; if (st.extra.indexOf(k) < 0) st.extra.push(k); }
        if (st.mapel.indexOf(name) < 0) st.mapel.push(name);
      });
      renderBanks(); renderMapel();
      var miss = firstMissing();
      if (!miss) return;
      $('bioHello').textContent = 'Halo, ' + String(me.nama || '').trim().split(/\s+/)[0];
      st.step = miss; render(); open();
    } catch (e) { /* gagal memuat: jangan kunci aplikasi */ }
  }
  window.genioBiodataTutor = { check: check };
})();
</script>

<!-- ===== Arsip data (manajer, super admin) =====
     Orang tua/sekolah dan kontrak siswa yang "dihapus" padahal sudah punya riwayat. Mereka disembunyikan dari semua
     daftar dan pilihan (kolom diarsipkan_at), jadwalnya berhenti (kontrak tutor nonaktif), tetapi presensi, invoice,
     kwitansi, gaji dan laporan lamanya tetap utuh. Pulihkan mengembalikan status persis seperti sebelum dihapus.
     Hapus dan pulihkan lewat genioArsipHapus / genioArsipPulihkan di Config.html (rpc/arsip_data, rpc/pulihkan_data,
     supabase/migrations/20261013_arsip_data.sql). -->
<style>
  @media (min-width:900px){
    .module-panel[data-module="arsip-data"][hidden]{ display:none !important; }
    .module-panel[data-module="arsip-data"]:not([hidden]){ width:94%; max-width:1500px; margin:0 auto; }
  }
  [data-module="arsip-data"] [hidden]{display:none !important;}
  .ar-intro{display:flex; gap:10px; align-items:flex-start; background:#fff; border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:12px;}
  .ar-intro b{display:block; font-size:12px; font-weight:600; color:var(--ink); margin-bottom:2px;}
  .ar-intro span{font-size:11px; color:var(--ink-soft); line-height:1.5;}
  .ar-ico{width:34px; height:34px; border-radius:10px; background:var(--blue-tint); color:var(--blue); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none;}
  /* Toolbar: tab (track dan thumb, lihat daftar bersama di Config.html) + cari */
  .ar-toolbar{display:flex; gap:8px; margin-bottom:12px; align-items:center;}
  .ar-dock{position:relative; display:flex; align-items:center; height:36px; padding:3px; box-sizing:border-box; flex:none; width:300px;}
  .ar-dock-glider{position:absolute; top:3px; bottom:3px; left:3px; width:0; transition:left .28s cubic-bezier(.34,1.56,.64,1), width .28s cubic-bezier(.34,1.56,.64,1); z-index:0; pointer-events:none;}
  .ar-dock-btn{position:relative; z-index:1; height:30px; border:none; background:transparent; font-family:var(--font); font-size:11.5px; font-weight:500; color:#8A8EA6; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 10px; white-space:nowrap;}
  .ar-search{flex:1; position:relative; min-width:0;}
  .ar-search i{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:14px; pointer-events:none;}
  #ar-search{width:100%; height:34px; border:1px solid var(--border); border-radius:10px; padding:0 12px 0 34px; font-family:var(--font); font-size:12px; background:#fff; box-sizing:border-box; outline:none; color:var(--ink);}
  #ar-search:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(28,26,175,.12);}
  @media (max-width:640px){ .ar-toolbar{flex-wrap:wrap;} .ar-dock{width:100%; order:-1;} }
  /* Tabel: No + Nama dibekukan di kiri */
  .ar-table-card{background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:12px;}
  .ar-table-wrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .ar-table{width:100%; border-collapse:separate; border-spacing:0; font-family:var(--font); font-size:11px;}
  .ar-table th{padding:10px; background:#fff; border-bottom:1px solid var(--border); font-size:10.5px; font-weight:500; color:var(--ink-soft); white-space:nowrap; text-align:left;}
  .ar-table td{padding:8px 10px; border-bottom:1px solid #EEF0F6; color:var(--ink); vertical-align:middle;}
  .ar-table tbody tr:last-child td{border-bottom:none;}
  .ar-table tbody tr:hover td{background:#F8F9FD;}
  .ar-table tbody tr{animation:arIn .3s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--i, 0) * 25ms);}
  @keyframes arIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .ar-table .ar-no{width:40px; min-width:40px; max-width:40px; box-sizing:border-box; text-align:center; color:var(--ink-soft);}
  .ar-table .ar-stk{position:sticky; z-index:1; background:#fff;}
  .ar-table th.ar-stk{z-index:2;}
  .ar-table .ar-stk-no{left:0;}
  .ar-table .ar-stk-nama{left:40px; box-shadow:1px 0 0 var(--border); min-width:160px; max-width:260px;}
  .ar-table tbody tr:hover td.ar-stk{background:#F8F9FD;}
  .ar-table th:not(.ar-stk-nama):not(.ar-col-wide), .ar-table td:not(.ar-stk-nama):not(.ar-col-wide){width:1%; white-space:nowrap;}
  .ar-table .ar-col-wide{min-width:160px; max-width:320px;}
  .ar-nm{display:flex; align-items:center; gap:9px; min-width:0;}
  .ar-nm .ar-ico{width:28px; height:28px; border-radius:8px; font-size:14px;}
  .ar-nm b{display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .ar-ell{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .ar-soft{color:var(--ink-soft);}
  .ar-btn{display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 10px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--blue); font-family:var(--font); font-size:10.5px; font-weight:600; cursor:pointer; transition:background .15s ease;}
  .ar-btn:hover{background:var(--surface);}
  .ar-empty{display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; background:#fff; border:1px dashed var(--border); border-radius:14px; padding:22px 16px; font-size:11px; color:var(--ink-soft);}
  .ar-empty .ar-ico{background:var(--surface); color:var(--ink-soft);}
  .ar-empty b{font-size:12px; font-weight:600; color:var(--ink);}
  @media (max-width:640px){
    .ar-table .ar-stk-nama{min-width:120px; max-width:150px;}
    .ar-nm .ar-ico{display:none;}
    .ar-btn span{display:none;} .ar-btn{width:28px; padding:0; justify-content:center;}
  }
  @media (prefers-reduced-motion: reduce){ .ar-table tbody tr{animation:none;} }
</style>

<div class="module-panel" data-module="arsip-data" hidden>
  <div class="ar-intro">
    <span class="ar-ico"><i class="ph ph-archive" aria-hidden="true"></i></span>
    <div><b>Data yang dihapus tapi punya riwayat</b><span>Disembunyikan dari daftar, pilihan dan jadwal. Presensi, tagihan, kwitansi, gaji dan laporan lamanya tetap tersimpan. Pulihkan untuk mengembalikan statusnya seperti sebelum dihapus.</span></div>
  </div>
  <div class="ar-toolbar" id="ar-toolbarRow">
    <div class="ar-dock" id="ar-dock" role="tablist" aria-label="Jenis data arsip">
      <div class="ar-dock-glider" id="ar-dockGlider"></div>
      <button type="button" class="ar-dock-btn ar-dock-active" data-tab="ortu" role="tab">Orang tua dan sekolah <span id="ar-countOrtu">0</span></button>
      <button type="button" class="ar-dock-btn" data-tab="kontrak" role="tab">Kontrak <span id="ar-countKontrak">0</span></button>
    </div>
    <div class="ar-search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><input type="text" id="ar-search" placeholder="Cari nama, siswa, nomor kontrak..." autocomplete="off"></div>
  </div>
  <div id="ar-list"><div class="ar-empty"><span class="spinner"></span>Memuat arsip...</div></div>
</div>

<script>
(function () {
  var ar = { ortu: [], kontrak: [], q: '', tab: 'ortu', loaded: false };
  var BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  function esc(s) { return genioEscapeHtml(s == null ? '' : s); }
  function tgl(iso) { var d = new Date(iso); return isNaN(d) ? '-' : d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); }
  function oleh(r) { return (r.pengarsip && r.pengarsip.nama) || '-'; }

  async function arLoad() {
    var list = document.getElementById('ar-list');
    var s = genioGetSession(); if (!s) return;
    try {
      var r = await Promise.all([
        supaRest('orangtua?diarsipkan_at=not.is.null&select=id,nama,pic_nama,no_hp,diarsipkan_at,pengarsip:users!orangtua_diarsipkan_oleh_fkey(nama),siswa(id,nama,units(nama_unit,jenis))&order=diarsipkan_at.desc', s.access_token),
        supaRest('kontrak_siswa?diarsipkan_at=not.is.null&select=id,nomor_kontrak,tanggal_mulai,diarsipkan_at,pengarsip:users!kontrak_siswa_diarsipkan_oleh_fkey(nama),siswa(nama,diarsipkan_at,orangtua(nama)),units(nama_unit),paket_belajar(nama_paket)&order=diarsipkan_at.desc', s.access_token)
      ]);
      ar.ortu = r[0] || [];
      // Kontrak yang ikut terarsip bersama orang tuanya dipulihkan lewat orang tuanya, jadi tidak didaftar terpisah
      ar.kontrak = (r[1] || []).filter(function (k) { return !(k.siswa && k.siswa.diarsipkan_at); });
      ar.loaded = true;
      document.getElementById('ar-countOrtu').textContent = ar.ortu.length;
      document.getElementById('ar-countKontrak').textContent = ar.kontrak.length;
      arRender();
      requestAnimationFrame(arGlider);
    } catch (err) {
      list.innerHTML = '<div class="ar-empty"><b>Gagal memuat arsip</b>' + esc(err.message) + '</div>';
    }
  }
  function match() { if (!ar.q) return true; for (var i = 0; i < arguments.length; i++) if (String(arguments[i] || '').toLowerCase().indexOf(ar.q) !== -1) return true; return false; }
  function pulihBtn(jenis, id, nama) {
    return '<button type="button" class="ar-btn" data-jenis="' + jenis + '" data-id="' + id + '" data-nama="' + esc(nama) + '" title="Pulihkan" aria-label="Pulihkan ' + esc(nama) + '"><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i><span>Pulihkan</span></button>';
  }
  function table(head, rows) {
    return '<div class="ar-table-card"><div class="ar-table-wrap"><table class="ar-table"><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }
  function arRender() {
    var list = document.getElementById('ar-list');
    var h;
    if (ar.tab === 'ortu') {
      var rows = ar.ortu.filter(function (o) { return match(o.nama, o.pic_nama, (o.siswa || []).map(function (x) { return x.nama; }).join(' ')); });
      if (!rows.length) h = empty('ortu');
      else h = table('<th class="ar-no ar-stk ar-stk-no">No</th><th class="ar-stk ar-stk-nama">Orang tua / sekolah</th><th class="ar-col-wide">Siswa / kelompok</th><th>Unit</th><th>Dihapus</th><th>Oleh</th><th></th>',
        rows.map(function (o, i) {
          var sw = o.siswa || [], sek = sw.some(function (x) { return x.units && x.units.jenis === 'sekolah'; });
          var unit = sw.map(function (x) { return x.units && x.units.nama_unit; }).filter(Boolean).filter(function (v, k, a) { return a.indexOf(v) === k; }).join(', ');
          var names = sw.map(function (x) { return x.nama; }).join(', ');
          return '<tr style="--i:' + Math.min(i, 20) + '"><td class="ar-no ar-stk ar-stk-no">' + (i + 1) + '</td>' +
            '<td class="ar-stk ar-stk-nama"><div class="ar-nm"><span class="ar-ico"><i class="ph ' + (sek ? 'ph-buildings' : 'ph-users-three') + '" aria-hidden="true"></i></span><b title="' + esc(o.nama) + '">' + esc(o.nama) + '</b></div></td>' +
            '<td class="ar-col-wide"><span class="ar-ell" title="' + esc(names) + '">' + (sw.length ? esc(names) : '<span class="ar-soft">Tanpa siswa</span>') + '</span></td>' +
            '<td>' + esc(unit || '-') + '</td><td>' + tgl(o.diarsipkan_at) + '</td><td class="ar-soft">' + esc(oleh(o)) + '</td>' +
            '<td>' + pulihBtn('ortu', o.id, o.nama) + '</td></tr>';
        }).join(''));
    } else {
      var krows = ar.kontrak.filter(function (k) { return match(k.siswa && k.siswa.nama, k.nomor_kontrak, k.siswa && k.siswa.orangtua && k.siswa.orangtua.nama, k.paket_belajar && k.paket_belajar.nama_paket); });
      if (!krows.length) h = empty('kontrak');
      else h = table('<th class="ar-no ar-stk ar-stk-no">No</th><th class="ar-stk ar-stk-nama">Siswa</th><th>No. kontrak</th><th class="ar-col-wide">Orang tua</th><th>Paket</th><th>Unit</th><th>Dihapus</th><th>Oleh</th><th></th>',
        krows.map(function (k, i) {
          var nm = (k.siswa && k.siswa.nama) || 'Siswa', ot = (k.siswa && k.siswa.orangtua && k.siswa.orangtua.nama) || '-';
          return '<tr style="--i:' + Math.min(i, 20) + '"><td class="ar-no ar-stk ar-stk-no">' + (i + 1) + '</td>' +
            '<td class="ar-stk ar-stk-nama"><div class="ar-nm"><span class="ar-ico"><i class="ph ph-file-text" aria-hidden="true"></i></span><b title="' + esc(nm) + '">' + esc(nm) + '</b></div></td>' +
            '<td>' + esc(k.nomor_kontrak || '-') + '</td><td class="ar-col-wide"><span class="ar-ell" title="' + esc(ot) + '">' + esc(ot) + '</span></td>' +
            '<td>' + esc((k.paket_belajar && k.paket_belajar.nama_paket) || '-') + '</td><td>' + esc((k.units && k.units.nama_unit) || '-') + '</td>' +
            '<td>' + tgl(k.diarsipkan_at) + '</td><td class="ar-soft">' + esc(oleh(k)) + '</td>' +
            '<td>' + pulihBtn('kontrak', k.id, 'kontrak ' + nm) + '</td></tr>';
        }).join(''));
    }
    genioKeepScroll(list, function () { list.innerHTML = h; });
  }
  function empty(jenis) {
    var total = jenis === 'ortu' ? ar.ortu.length : ar.kontrak.length;
    if (total && ar.q) return '<div class="ar-empty"><b>Tidak ada yang cocok</b>Coba kata kunci lain.</div>';
    return '<div class="ar-empty"><span class="ar-ico"><i class="ph ph-archive" aria-hidden="true"></i></span><b>' +
      (jenis === 'ortu' ? 'Belum ada orang tua atau sekolah di arsip' : 'Belum ada kontrak di arsip') + '</b>' +
      (jenis === 'ortu' ? 'Orang tua yang dihapus padahal sudah punya riwayat muncul di sini, bersama siswa dan kontraknya.' : 'Kontrak yang dihapus padahal sudah punya riwayat muncul di sini. Kontrak yang ikut terarsip bersama orang tuanya ada di tab Orang tua dan sekolah.') + '</div>';
  }
  function arGlider() {
    var dock = document.getElementById('ar-dock'), g = document.getElementById('ar-dockGlider'), a = dock && dock.querySelector('.ar-dock-active');
    if (!g || !a || !a.offsetWidth) return;
    g.style.left = a.offsetLeft + 'px'; g.style.width = a.offsetWidth + 'px';
  }
  function arSwitch(tab) {
    if (tab === ar.tab) return;
    ar.tab = tab;
    document.querySelectorAll('#ar-dock .ar-dock-btn').forEach(function (b) {
      var on = b.dataset.tab === tab; b.classList.toggle('ar-dock-active', on); b.setAttribute('aria-selected', on);
    });
    arGlider();
    if (ar.loaded) arRender();
  }

  var dock = document.getElementById('ar-dock');
  dock.querySelectorAll('.ar-dock-btn').forEach(function (b) { b.addEventListener('click', function () { arSwitch(b.dataset.tab); }); });
  if (typeof genioBindScrub === 'function') genioBindScrub(dock, {
    btnSel: '.ar-dock-btn', attr: 'data-tab', activeClass: 'ar-dock-active',
    current: function () { return ar.tab; },
    glider: function () { return document.getElementById('ar-dockGlider'); },
    pick: arSwitch
  });
  window.addEventListener('resize', arGlider);
  document.getElementById('ar-search').addEventListener('input', function () { ar.q = this.value.trim().toLowerCase(); if (ar.loaded) arRender(); });
  document.getElementById('ar-list').addEventListener('click', function (e) {
    var b = e.target.closest('.ar-btn'); if (!b) return;
    genioArsipPulihkan({ jenis: b.dataset.jenis, id: b.dataset.id, nama: b.dataset.nama, onDone: arLoad });
  });
  // Arsip berubah dari menu lain (hapus kontrak atau orang tua): muat ulang kalau panel ini sedang terbuka
  document.addEventListener('genio:arsip', function () {
    var p = document.querySelector('.module-panel[data-module="arsip-data"]');
    if (p && !p.hidden) arLoad();
  });

  window.genioModuleHandlers = window.genioModuleHandlers || {};
  window.genioModuleHandlers['arsip-data'] = function () { arLoad(); requestAnimationFrame(arGlider); };
})();
</script>

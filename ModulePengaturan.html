<div class="module-panel" data-module="pengaturan" hidden>
<style>
  @media (min-width:900px){
    .module-panel[data-module="pengaturan"][hidden]{ display:none !important; }
    .module-panel[data-module="pengaturan"]:not([hidden]){ width:94%; max-width:1500px; margin:0 auto; }
  }

  /* ===== Aturan presensi: alur (sesi selesai > batas lapor > denda), honor visit, simulasi, bar simpan ===== */
  .pgf-card{background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:12px; box-sizing:border-box; min-width:0;}
  .pgf-head{display:flex; align-items:center; gap:10px; margin-bottom:14px; min-width:0;}
  .pgf-head .pgc-ico{background:var(--blue-tint); color:var(--blue);}
  .pgf-head h3{margin:0; font-size:12.5px; font-weight:600; color:var(--ink);}
  .pgf-head p{margin:1px 0 0; font-size:10.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pgf-head > div{min-width:0;}
  .pgf-flow{display:grid; grid-template-columns:minmax(0,.8fr) 26px minmax(0,1fr) 26px minmax(0,1fr); align-items:stretch;}
  .pgf-step{border:1px solid var(--border); border-radius:12px; padding:12px; min-width:0; box-sizing:border-box;}
  .pgf-step.is-start{background:var(--surface); border-color:transparent;}
  .pgf-k{font-size:10.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .pgf-k i{font-size:14px;}
  .pgf-d{font-size:10.5px; color:var(--ink-soft); margin-top:8px; line-height:1.45;}
  .pgf-arrow{display:flex; align-items:center; justify-content:center; color:#B5B8C9; font-size:14px;}
  .pgf-stp{display:flex; align-items:center; gap:6px; margin-top:8px;}
  .pgf-stp button{width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:#fff; color:var(--ink); font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; padding:0; transition:background .15s ease, border-color .15s ease;}
  .pgf-stp button:hover{background:var(--surface); border-color:#C9CCDA;}
  .pgf-stp button:disabled{opacity:.4; cursor:default;}
  .pgf-val{flex:1; min-width:0; display:flex; align-items:baseline; justify-content:center; gap:3px; font-size:18px; font-weight:700; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .pgf-val input{font:inherit; color:inherit; border:none; background:transparent; text-align:center; padding:2px 0; min-width:2ch; border-radius:6px; outline:none; border-bottom:1px dashed transparent;}
  .pgf-val input:not([readonly]){border-bottom-color:#C9CCDA; cursor:text;}
  .pgf-val input:focus{background:var(--blue-tint); border-bottom-color:var(--blue);}
  .pgf-val.is-chg{color:var(--blue);}
  .pgf-val .u{font-size:13px; font-weight:600;}
  .pgf-visit{display:flex; align-items:center; gap:12px; border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:10px;}
  .pgf-visit .t{flex:1; min-width:0;}
  .pgf-visit .t b{display:block; font-size:12px; font-weight:600; color:var(--ink);}
  .pgf-visit .t small{font-size:10.5px; color:var(--ink-soft);}
  .pgf-visit .pgc-ico{background:#E9F7EF; color:#1E8E5A;}
  .pgf-visit .pgf-stp{margin:0; width:220px; flex:none;}
  .pgf-sim{margin-top:12px; background:var(--surface); border-radius:12px; padding:12px 14px;}
  .pgf-sim-t{font-size:10.5px; color:var(--ink-soft); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .pgf-sim-rows{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
  .pgf-sim-r{background:#fff; border-radius:10px; padding:9px 11px; min-width:0;}
  .pgf-sim-r small{display:block; font-size:10px; color:var(--ink-soft);}
  .pgf-sim-r b{font-size:13px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .pgf-sim-r b.ok{color:#1E8E5A;} .pgf-sim-r b.bad{color:#C0352B;}
  .pgf-bar{position:sticky; bottom:16px; z-index:3; display:flex; align-items:center; gap:10px; margin-top:12px; padding:10px 12px; border-radius:12px; background:#fff; border:1px solid var(--blue); box-shadow:0 8px 24px -10px rgba(28,26,175,.35);}
  .pgf-bar[hidden]{display:none;}
  .pgf-bar > i{color:var(--blue); font-size:15px; flex:none;}
  .pgf-bar .t{flex:1; min-width:0; font-size:11px; color:var(--ink); line-height:1.4;}
  .pgf-bar .t b{color:var(--blue); font-weight:600;}
  .pgf-bar button{height:32px; border-radius:9px; padding:0 14px; font-family:var(--font); font-size:11px; font-weight:600; cursor:pointer; flex:none;}
  .pgf-bar .alert{margin:6px 0 0 !important; font-size:10.5px !important;}
  @keyframes pgtIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes pgfBar{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .pgf-bar.pgf-in{animation:pgfBar .25s ease-out both;}
  @media (max-width:899px){
    .pgf-card{padding:14px;}
    .pgf-flow{grid-template-columns:1fr;}
    .pgf-arrow{height:22px; transform:rotate(90deg);}
    .pgf-visit{flex-wrap:wrap;}
    .pgf-visit .pgf-stp{width:100%;}
    .pgf-sim-rows{grid-template-columns:1fr; gap:6px;}
    .pgf-sim-r{display:flex; align-items:center; justify-content:space-between; gap:10px;}
    .pgf-bar{bottom:calc(92px + env(safe-area-inset-bottom, 0px)); flex-wrap:wrap;}
    .pgf-bar .t{flex-basis:calc(100% - 30px);}
    .pgf-bar button{flex:1;}
  }
  @media (prefers-reduced-motion: reduce){ .pgf-bar.pgf-in{animation:none;} }

  /* ===== Kartu aturan ===== */
  .pgt-card{background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px; min-width:0; box-sizing:border-box; transition:box-shadow .18s ease, border-color .18s ease;}
  .pgt-card:hover{border-color:#D5D8E8; box-shadow:0 4px 14px -6px rgba(20,22,43,.12);}
  .pgt-card.pgt-in{animation:pgtIn .42s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--i) * 60ms);}
  .pgc-head{display:flex; align-items:center; gap:10px; min-width:0;}
  .pgc-ico{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none;}
  .pgc-who{min-width:0; flex:1;}
  .pgc-who h4{font-size:12.5px; font-weight:600; color:var(--ink); margin:0; line-height:1.3;}
  .pgc-who p{font-size:10.5px; color:var(--ink-soft); margin:1px 0 0;}
  .pgc-val{font-size:18px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap; flex:none;}
  .pgc-desc{font-size:11px; color:var(--ink-soft); line-height:1.55; margin-top:10px;}
  .pgc-desc b{color:var(--ink); font-weight:600;}
  .pgc-foot{display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:11px; border-top:1px dashed var(--border);}
  .pgc-by{min-width:0; flex:1; font-size:10.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pgc-by b{color:var(--ink); font-weight:600;}
  .pgt-toggle-btn{height:30px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--ink); font-family:var(--font); font-size:11px; font-weight:600; padding:0 12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; flex:none;}
  .pgt-toggle-btn:hover{background:var(--surface);}
  .pgt-toggle-btn .pgt-caret{transition:transform .25s ease;}
  .pgt-toggle-btn[aria-expanded="true"] .pgt-caret{transform:rotate(180deg);}
  .pgt-edit-wrap{max-height:0; opacity:0; overflow:hidden; transition:max-height .32s cubic-bezier(.4,0,.2,1), opacity .25s ease;}
  .pgt-edit-inner{margin-top:12px; padding:12px; border-radius:11px; background:var(--surface);}
  .pgt-edit-l{font-size:10.5px; font-weight:500; color:var(--ink-soft); margin:0 0 6px;}
  .pgt-presets{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .pgt-preset-btn{flex:1 1 auto; min-width:58px; height:32px; border-radius:9px; border:1px solid var(--border); background:#fff; font-family:var(--font); font-size:11px; font-weight:600; color:var(--ink); cursor:pointer; transition:background .15s ease, border-color .15s ease, color .15s ease;}
  .pgt-preset-btn:hover{border-color:#C9CCDA;}
  .pgt-preset-btn.is-on{background:var(--blue-tint); color:var(--blue); border-color:var(--blue);}
  .pgt-input-wrap{position:relative;}
  .pgt-input-wrap span{position:absolute; right:11px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--ink-soft); pointer-events:none;}
  .pgt-custom-input{width:100%; height:34px; border:1px solid var(--border); border-radius:9px; padding:0 70px 0 11px; font-family:var(--font); font-size:11.5px; background:#fff; color:var(--ink); box-sizing:border-box; outline:none; font-variant-numeric:tabular-nums; transition:border-color .15s ease, box-shadow .15s ease;}
  .pgt-custom-input:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(28,26,175,.12);}
  .pgt-edit-inner .alert{margin:10px 0 0 !important; font-size:10.5px !important;}
  .pgt-edit-act{display:flex; justify-content:flex-end; gap:8px; margin-top:12px;}
  .pgt-edit-act button{height:32px; border-radius:9px; padding:0 14px; font-family:var(--font); font-size:11px; font-weight:600; cursor:pointer;}
  .pgt-cancel-btn{background:#fff; border:1px solid var(--border); color:var(--ink);}
  .pgt-save-btn{background:var(--blue); border:none; color:#fff;}
  .pgt-save-btn:disabled{opacity:.7; cursor:default;}
  .pgt-readonly{display:flex; gap:8px; align-items:center; background:#FFF6E6; color:#8A5A00; border:1px solid #F5DDB0; border-radius:11px; padding:9px 12px; font-size:11px; margin-bottom:12px;}
  .pgt-readonly i{font-size:14px; flex:none;}
  .pgt-foot-note{display:flex; gap:8px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 14px; margin-top:2px;}
  .pgt-foot-note i{font-size:14px; color:var(--ink-soft); flex:none; margin-top:1px;}
  .pgt-foot-note div{font-size:11px; color:var(--ink-soft); line-height:1.55;}
  @media (prefers-reduced-motion: reduce){
    .pgt-edit-wrap, .pgt-toggle-btn .pgt-caret{transition:none;}
  }

  /* ===== Identitas dokumen (kop, kontak, rekening, penanda tangan di semua PDF): gaya sama dengan kartu aturan ===== */
  .pgi-card .pgf-head{margin-bottom:12px;}
  .pgi-card .pgf-head > div{flex:1;}
  .pgi-card .pgf-head .pgt-toggle-btn{margin-left:auto;}
  .pgi-card.is-edit #pgi-toggle, .pgi-card.is-edit .pgi-sum, .pgi-card:not(.is-edit) .pgi-edit{display:none;}
  .pgi-sum{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
  .pgi-tile{border:1px solid var(--border); border-radius:12px; padding:12px; min-width:0; box-sizing:border-box;}
  .pgi-tile .pgf-k{margin-bottom:8px;}
  .pgi-tile .v{font-size:11.5px; color:var(--ink); line-height:1.55; word-break:break-word;}
  .pgi-tile .v .muted{color:var(--ink-soft);}
  .pgi-tile .v.is-empty{color:var(--ink-soft); font-style:italic;}
  .pgi-rk{width:100%; border-collapse:collapse; font-size:11.5px;}
  .pgi-rk td{padding:2px 0; vertical-align:top;}
  .pgi-rk td:first-child{width:44px; font-weight:600; color:var(--ink);}
  .pgi-rk td:last-child{font-variant-numeric:tabular-nums; color:var(--ink);}
  .pgi-signer{display:flex; align-items:center; gap:12px; min-width:0;}
  .pgi-signer > div:last-child{min-width:0;}
  .pgi-ttd{width:96px; height:56px; flex:none; border:1px dashed var(--border); border-radius:9px; background:#fff center/contain no-repeat; display:flex; align-items:center; justify-content:center; font-size:9.5px; color:var(--ink-soft); text-align:center; line-height:1.3; padding:4px; box-sizing:border-box;}
  .pgi-ttd.has-img{border-style:solid;}
  .pgi-tag{font-style:italic; font-weight:600; color:var(--blue);}
  .pgi-note{display:flex; align-items:center; gap:6px; margin-top:10px; font-size:10.5px; color:var(--ink-soft);}
  /* Form ubah: empat kelompok yang sama dengan ringkasan */
  .pgi-form{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
  .pgi-sec{border:1px solid var(--border); border-radius:12px; padding:12px; min-width:0; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start; box-sizing:border-box;}
  .pgi-sec > .pgf-k{grid-column:1/-1; margin:0;}
  .pgi-sec .full{grid-column:1/-1;}
  .pgi-sec > div{min-width:0;}
  .pgi-form label{display:block; font-size:10.5px; font-weight:500; color:var(--ink-soft); margin:0 0 5px;}
  .pgi-form input, .pgi-form textarea{width:100%; box-sizing:border-box; min-height:36px; padding:8px 11px; border:1px solid var(--border); border-radius:9px; background:var(--surface); font-family:var(--font); font-size:11.5px; color:var(--ink); outline:none; transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;}
  .pgi-form textarea{resize:vertical; line-height:1.45;}
  .pgi-form input:focus, .pgi-form textarea:focus{border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px rgba(28,26,175,.12);}
  .pgi-rek{display:grid; grid-template-columns:76px minmax(0,1fr) 36px; gap:6px; margin-bottom:6px;}
  .pgi-rek button{width:36px; height:36px; border-radius:9px; border:1px solid var(--border); background:#fff; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .pgi-rek button:hover{color:#C0352B; border-color:#F3C4BF;}
  .pgi-add{height:32px; border-radius:8px; border:1px dashed #C9CCDA; background:#fff; color:var(--blue); font-family:var(--font); font-size:11px; font-weight:600; padding:0 12px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
  .pgi-ttd-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .pgi-ttd-row .pgt-toggle-btn{height:32px;}
  .pgi-hint{font-size:10px; color:var(--ink-soft); margin-top:6px; line-height:1.45;}
  .pgi-act{display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}
  .pgi-act button{height:34px; border-radius:9px; padding:0 16px; font-family:var(--font); font-size:11px; font-weight:600; cursor:pointer;}
  .pgi-edit .alert{margin:10px 0 0 !important; font-size:10.5px !important;}
  @media (max-width:899px){
    .pgi-sum, .pgi-form{grid-template-columns:1fr;}
  }
  @media (max-width:520px){
    .pgi-sec{grid-template-columns:1fr;}
    .pgi-act button{flex:1;}
  }
</style>


  <div id="pgt-list">
    <div class="empty-state">Memuat pengaturan...</div>
  </div>

  <div class="pgt-foot-note">
    <i class="ph ph-info" aria-hidden="true"></i>
    <div>Semua aturan berlaku saat presensi disetujui (terima atau visit), termasuk laporan yang masih menunggu persetujuan saat nilainya diubah. Presensi yang sudah disetujui sebelumnya tidak ikut berubah.</div>
  </div>

</div>

<script>
  window.genioModuleHandlers = window.genioModuleHandlers || {};

  // Aturan presensi dan honor (kunci di tabel pengaturan). Disusun sebagai alur: sesi selesai > batas lapor > denda, lalu honor visit.
  var PGT_META = {
    batas_jam_telat: { label: 'Batas waktu lapor', short: 'batas lapor', step: 1, min: 1, max: 168, suffix: 'jam' },
    persen_denda_telat: { label: 'Denda keterlambatan', short: 'denda telat', step: 1, min: 0, max: 100, suffix: '%' },
    nominal_visit: { label: 'Honor visit', short: 'honor visit', step: 5000, min: 0, max: 10000000, prefix: 'Rp' }
  };
  var PGT_DEFAULTS = { nominal_visit: '30000', persen_denda_telat: '2', batas_jam_telat: '24' };
  var PGT_ORDER = ['batas_jam_telat', 'persen_denda_telat', 'nominal_visit'];
  var PGT_SIM_FEE = 150000;
  var PGT_BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  var PGT_REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var pgtRows = {};
  var pgtCanEdit = false;
  var pgtOrig = {}, pgtVals = {};

  window.genioModuleHandlers['pengaturan'] = function () {
    pgtLoadList();
  };

  function pgtEscape(str) {
    var d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }
  function pgtFormatTgl(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.getDate() + ' ' + PGT_BULAN[d.getMonth()] + ' ' + d.getFullYear();
  }
  function pgtRp(v) { return 'Rp ' + Math.round(v).toLocaleString('id-ID'); }
  // Angka di kotak isian: rupiah memakai titik ribuan, jam dan persen apa adanya (koma untuk desimal)
  function pgtNumText(key, v) {
    return key === 'nominal_visit' ? Math.round(v).toLocaleString('id-ID') : String(v).replace('.', ',');
  }
  function pgtParse(key, text) {
    var t = String(text || '').trim();
    if (key === 'nominal_visit') t = t.replace(/[^\d]/g, '');
    else t = t.replace(/[^\d,\.]/g, '').replace(',', '.');
    var v = parseFloat(t);
    return isNaN(v) ? null : v;
  }
  function pgtLabelVal(key, v) {
    var m = PGT_META[key];
    return m.prefix ? pgtRp(v) : pgtNumText(key, v) + (m.suffix === '%' ? '%' : ' ' + m.suffix);
  }

  async function pgtLoadList() {
    var listEl = document.getElementById('pgt-list');
    try {
      var s = genioSessionOrLogin();
      pgtCanEdit = (s.role === 'manajer' || s.role === 'super_admin');

      var rows = await supaRest('pengaturan?select=*,users(nama,foto_profil_url)', s.access_token);

      pgtRows = {};
      rows.forEach(function (r) { pgtRows[r.kunci] = r; });
      pgtOrig = {}; pgtVals = {};
      PGT_ORDER.forEach(function (k) {
        var v = parseFloat(pgtRows[k] ? pgtRows[k].nilai : PGT_DEFAULTS[k]);
        pgtOrig[k] = pgtVals[k] = isNaN(v) ? parseFloat(PGT_DEFAULTS[k]) : v;
      });

      pgtRerenderList(true);
    } catch (err) {
      listEl.innerHTML = '<div class="pgt-card" style="text-align:center; color:var(--ink-soft); font-size:11.5px;">Gagal memuat pengaturan: ' + pgtEscape(err.message) + '</div>';
    }
  }

  function pgtStepper(key) {
    var m = PGT_META[key];
    var edit = pgtCanEdit && !!pgtRows[key];
    var v = pgtVals[key];
    return '<div class="pgf-stp">' +
      (edit ? '<button type="button" class="pgf-dec" data-key="' + key + '" aria-label="Kurangi ' + pgtEscape(m.label.toLowerCase()) + '"><i class="ph ph-minus" aria-hidden="true"></i></button>' : '') +
      '<span class="pgf-val' + (v !== pgtOrig[key] ? ' is-chg' : '') + '" data-val="' + key + '">' +
        (m.prefix ? '<span class="u">' + m.prefix + '</span>' : '') +
        '<input type="text" class="pgf-in" data-key="' + key + '" inputmode="' + (key === 'nominal_visit' ? 'numeric' : 'decimal') + '" value="' + pgtEscape(pgtNumText(key, v)) + '" aria-label="' + pgtEscape(m.label) + '"' + (edit ? '' : ' readonly tabindex="-1"') + '>' +
        (m.suffix ? '<span class="u">' + m.suffix + '</span>' : '') +
      '</span>' +
      (edit ? '<button type="button" class="pgf-inc" data-key="' + key + '" aria-label="Tambah ' + pgtEscape(m.label.toLowerCase()) + '"><i class="ph ph-plus" aria-hidden="true"></i></button>' : '') +
    '</div>';
  }

  function pgtFlowCard() {
    // Perubahan terakhir di antara tiga aturan
    var changed = PGT_ORDER.map(function (k) { return pgtRows[k]; }).filter(function (r) { return r && r.users && r.users.nama; });
    changed.sort(function (a, b) { return String(b.updated_at || '').localeCompare(String(a.updated_at || '')); });
    var last = changed[0];
    var sub = last ? 'Terakhir diubah ' + pgtEscape(last.users.nama) + ' · ' + pgtEscape(PGT_META[last.kunci].label.toLowerCase()) + (pgtFormatTgl(last.updated_at) ? ' · ' + pgtFormatTgl(last.updated_at) : '') : 'Memakai nilai bawaan, belum pernah diubah';
    return '<div class="pgf-card" id="pgf-card">' +
      '<div class="pgf-head"><span class="pgc-ico"><i class="ph ph-check-circle" aria-hidden="true"></i></span><div><h3>Aturan presensi dan honor</h3><p title="' + sub + '">' + sub + '</p></div></div>' +
      '<div class="pgf-flow">' +
        '<div class="pgf-step is-start"><span class="pgf-k"><i class="ph ph-calendar-check" style="color:var(--blue);" aria-hidden="true"></i>Sesi selesai</span><div class="pgf-d">Tutor mengisi presensi dan laporan belajar.</div></div>' +
        '<div class="pgf-arrow" aria-hidden="true"><i class="ph ph-arrow-right"></i></div>' +
        '<div class="pgf-step"><span class="pgf-k"><i class="ph ph-clock" style="color:#B86E00;" aria-hidden="true"></i>Batas waktu lapor</span>' + pgtStepper('batas_jam_telat') + '<div class="pgf-d">Lewat dari ini setelah sesi selesai dianggap telat.</div></div>' +
        '<div class="pgf-arrow" aria-hidden="true"><i class="ph ph-arrow-right"></i></div>' +
        '<div class="pgf-step"><span class="pgf-k"><i class="ph ph-warning" style="color:#C0352B;" aria-hidden="true"></i>Denda kalau telat</span>' + pgtStepper('persen_denda_telat') + '<div class="pgf-d">Dipotong dari fee mengajar sesi itu, otomatis di slip gaji.</div></div>' +
      '</div>' +
      '<div class="pgf-visit"><span class="pgc-ico"><i class="ph ph-car-profile" aria-hidden="true"></i></span><div class="t"><b>Honor visit</b><small>Kalau sesi tidak berjalan dan tutor hanya berkunjung, dibayar flat pengganti fee dan transport.</small></div>' + pgtStepper('nominal_visit') + '</div>' +
      '<div class="pgf-sim"><div class="pgf-sim-t"><i class="ph ph-calculator" aria-hidden="true"></i>Simulasi sesi dengan fee ' + pgtRp(PGT_SIM_FEE) + '</div><div class="pgf-sim-rows" id="pgf-sim"></div></div>' +
      (pgtCanEdit ? '<div class="pgf-bar" id="pgf-bar" hidden><i class="ph-fill ph-info" aria-hidden="true"></i><span class="t" id="pgf-barText"></span>' +
        '<button type="button" class="pgt-cancel-btn" id="pgf-cancel">Batal</button><button type="button" class="pgt-save-btn" id="pgf-save">Simpan</button></div>' : '') +
    '</div>';
  }

  function pgtRenderSim() {
    var el = document.getElementById('pgf-sim');
    if (!el) return;
    var jam = pgtVals.batas_jam_telat, persen = pgtVals.persen_denda_telat;
    var tepat = Math.max(1, Math.round(jam) - 4), telat = Math.round(jam) + 16;
    var potong = Math.round(PGT_SIM_FEE * persen / 100);
    el.innerHTML =
      '<div class="pgf-sim-r"><small>Lapor ' + tepat + ' jam setelah sesi</small><b class="ok">' + pgtRp(PGT_SIM_FEE) + '</b></div>' +
      '<div class="pgf-sim-r"><small>Lapor ' + telat + ' jam setelah sesi (telat, -' + pgtRp(potong) + ')</small><b class="' + (potong ? 'bad' : 'ok') + '">' + pgtRp(PGT_SIM_FEE - potong) + '</b></div>' +
      '<div class="pgf-sim-r"><small>Visit</small><b>' + pgtRp(pgtVals.nominal_visit) + '</b></div>';
  }

  function pgtChangedKeys() { return PGT_ORDER.filter(function (k) { return pgtVals[k] !== pgtOrig[k]; }); }

  function pgtRenderBar() {
    var bar = document.getElementById('pgf-bar');
    if (!bar) return;
    var keys = pgtChangedKeys();
    PGT_ORDER.forEach(function (k) {
      var v = document.querySelector('.pgf-val[data-val="' + k + '"]');
      if (v) v.classList.toggle('is-chg', pgtVals[k] !== pgtOrig[k]);
    });
    if (!keys.length) { bar.hidden = true; return; }
    document.getElementById('pgf-barText').innerHTML = '<b>' + keys.length + ' perubahan</b> belum disimpan · ' + keys.map(function (k) {
      return PGT_META[k].short + ' ' + pgtLabelVal(k, pgtOrig[k]) + ' → ' + pgtLabelVal(k, pgtVals[k]);
    }).join(', ');
    if (bar.hidden) {
      bar.hidden = false;
      if (!PGT_REDUCED_MOTION) { bar.classList.remove('pgf-in'); void bar.offsetWidth; bar.classList.add('pgf-in'); }
    }
  }

  function pgtSetVal(key, v, keepInput) {
    var m = PGT_META[key];
    v = Math.min(m.max, Math.max(m.min, v));
    v = Math.round(v * 100) / 100;
    pgtVals[key] = v;
    var input = document.querySelector('.pgf-in[data-key="' + key + '"]');
    if (input && !keepInput) { input.value = pgtNumText(key, v); pgtFitInput(input); }
    var dec = document.querySelector('.pgf-dec[data-key="' + key + '"]'), inc = document.querySelector('.pgf-inc[data-key="' + key + '"]');
    if (dec) dec.disabled = v <= m.min;
    if (inc) inc.disabled = v >= m.max;
    pgtRenderSim();
    pgtRenderBar();
  }
  function pgtFitInput(input) { input.style.width = Math.max(2, input.value.length + .2) + 'ch'; }

  function pgtBindFlow() {
    document.querySelectorAll('.pgf-in').forEach(function (input) {
      pgtFitInput(input);
      var key = input.dataset.key;
      input.addEventListener('input', function () {
        pgtFitInput(input);
        var v = pgtParse(key, input.value);
        if (v != null) pgtSetVal(key, v, true);
      });
      input.addEventListener('blur', function () { pgtSetVal(key, pgtVals[key]); });
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') input.blur(); });
    });
    document.querySelectorAll('.pgf-dec, .pgf-inc').forEach(function (btn) {
      var key = btn.dataset.key, step = PGT_META[key].step * (btn.classList.contains('pgf-dec') ? -1 : 1);
      btn.addEventListener('click', function () {
        var cur = pgtVals[key];
        // Lompat ke kelipatan langkah berikutnya, supaya nilai pecahan kembali ke angka bulat
        var next = step > 0 ? Math.floor(cur / step + 1e-9) * step + step : Math.ceil(cur / -step - 1e-9) * -step + step;
        pgtSetVal(key, next);
      });
    });
    PGT_ORDER.forEach(function (k) { if (document.querySelector('.pgf-in[data-key="' + k + '"]')) pgtSetVal(k, pgtVals[k]); });
    var cancel = document.getElementById('pgf-cancel');
    if (cancel) cancel.addEventListener('click', function () { PGT_ORDER.forEach(function (k) { pgtSetVal(k, pgtOrig[k]); }); });
    var save = document.getElementById('pgf-save');
    if (save) save.addEventListener('click', pgtSaveRules);
  }

  function pgtRerenderList(animate) {
    var listEl = document.getElementById('pgt-list');
    var notice = !pgtCanEdit
      ? '<div class="pgt-readonly"><i class="ph ph-lock-simple" aria-hidden="true"></i>Kamu hanya bisa melihat pengaturan ini. Hanya manajer yang bisa mengubahnya.</div>'
      : '';
    listEl.innerHTML = notice + pgtFlowCard() + (pgtRows.identitas_dokumen ? pgtIdnCard() : '');
    pgtBindFlow();
    pgtIdnBind();
    if (animate && !PGT_REDUCED_MOTION) {
      listEl.querySelectorAll('.pgf-card, .pgt-card').forEach(function (el, i) {
        el.style.animation = 'pgtIn .42s cubic-bezier(.16,1,.3,1) both ' + (i * 60) + 'ms';
        setTimeout(function () { el.style.animation = ''; }, 900);
      });
    }
  }

  async function pgtSaveRules() {
    var keys = pgtChangedKeys().filter(function (k) { return pgtRows[k]; });
    if (!keys.length) return;
    var btn = document.getElementById('pgf-save');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Menyimpan...';
    try {
      var s = genioSessionOrLogin();
      await Promise.all(keys.map(function (k) {
        return supaRest('pengaturan?id=eq.' + pgtRows[k].id, s.access_token, {
          method: 'PATCH',
          headers: { 'Prefer': 'return=minimal' },
          body: JSON.stringify({ nilai: String(pgtVals[k]), updated_by: s.user_id })
        });
      }));
      genioToast(keys.length === 1 ? PGT_META[keys[0]].label + ' berhasil diperbarui' : 'Aturan presensi berhasil diperbarui', 'success');
      pgtLoadList();
    } catch (err) {
      genioToast(err.message || 'Gagal menyimpan.', 'error');
      btn.disabled = false;
      btn.textContent = 'Simpan';
    }
  }

  /* ===== Identitas dokumen: dicetak di invoice, kuitansi, slip gaji, laporan belajar, dan rekap ===== */
  var pgtIdn = null, pgtIdnOpen = false, pgtIdnTtdBusy = false;
  function pgtIdnValue() {
    var r = pgtRows.identitas_dokumen;
    var v = {};
    try { v = JSON.parse((r && r.nilai) || '{}') || {}; } catch (e) {}
    v.rekening = Array.isArray(v.rekening) ? v.rekening : [];
    return v;
  }
  function pgtIdnTtdUrl(id) { return id ? 'https://lh3.googleusercontent.com/d/' + id + '=w400' : ''; }
  function pgtIdnCard() {
    var v = pgtIdn = pgtIdnValue();
    var r = pgtRows.identitas_dokumen;
    var tgl = pgtFormatTgl(r.updated_at), by = r.users && r.users.nama;
    var sub = by ? 'Terakhir diubah ' + pgtEscape(by) + (tgl ? ' · ' + tgl : '') : 'Nilai awal, belum pernah diubah';
    var ttdBox = v.ttd_file_id ? '<div class="pgi-ttd has-img" style="background-image:url(\'' + pgtIdnTtdUrl(v.ttd_file_id) + '\')"></div>' : '<div class="pgi-ttd">Belum ada cap dan tanda tangan</div>';
    var k = function (icon, color, text) { return '<span class="pgf-k"><i class="ph ' + icon + '" style="color:' + color + ';" aria-hidden="true"></i>' + text + '</span>'; };
    var val = function (x, empty) { return x ? pgtEscape(x) : '<span class="muted"><i>' + (empty || 'Belum diisi') + '</i></span>'; };
    var rek = v.rekening.length
      ? '<table class="pgi-rk">' + v.rekening.map(function (x) { return '<tr><td>' + pgtEscape(x.bank) + '</td><td>' + pgtEscape(x.nomor) + '</td></tr>'; }).join('') + '</table>' +
        '<div class="muted" style="margin-top:4px;">a.n. ' + val(v.atas_nama) + '</div>'
      : '<span class="muted"><i>Belum ada rekening</i></span>';
    var sum = '<div class="pgi-sum">' +
      '<div class="pgi-tile">' + k('ph-map-pin', 'var(--blue)', 'Kop dan kontak') + '<div class="v">' + val(v.alamat) + '<br><span class="muted">' + val(v.telepon, '-') + (v.email ? ' · ' + pgtEscape(v.email) : '') + '</span></div></div>' +
      '<div class="pgi-tile">' + k('ph-bank', '#1E8E5A', 'Rekening pembayaran (invoice)') + '<div class="v">' + rek + '</div></div>' +
      '<div class="pgi-tile">' + k('ph-signature', '#B86E00', 'Penanda tangan') + '<div class="pgi-signer">' + ttdBox + '<div class="v"><b style="font-weight:600;">' + val(v.ttd_nama) + '</b><br><span class="muted">' + val(v.ttd_jabatan, '-') + '</span></div></div></div>' +
      '<div class="pgi-tile">' + k('ph-text-align-left', 'var(--ink-soft)', 'Footer dokumen') + '<div class="v">' + val(v.kontak_admin) + (v.tagline ? '<br><span class="pgi-tag">' + pgtEscape(v.tagline) + '</span>' : '') + '</div></div>' +
    '</div>';
    var form = pgtCanEdit ? '<div class="pgi-edit"><div class="pgi-form">' +
      '<div class="pgi-sec">' + k('ph-map-pin', 'var(--blue)', 'Kop dan kontak') +
        '<div class="full"><label for="pgi-alamat">Alamat</label><textarea id="pgi-alamat" rows="2">' + pgtEscape(v.alamat || '') + '</textarea></div>' +
        '<div><label for="pgi-telepon">Telepon</label><input id="pgi-telepon" type="tel" value="' + pgtEscape(v.telepon || '') + '"></div>' +
        '<div><label for="pgi-email">Email</label><input id="pgi-email" type="email" value="' + pgtEscape(v.email || '') + '"></div></div>' +
      '<div class="pgi-sec">' + k('ph-bank', '#1E8E5A', 'Rekening pembayaran (invoice)') +
        '<div class="full"><div id="pgi-rekList"></div><button type="button" class="pgi-add" id="pgi-rekAdd"><i class="ph ph-plus" aria-hidden="true"></i>Tambah rekening</button></div>' +
        '<div class="full"><label for="pgi-an">Atas nama rekening</label><input id="pgi-an" type="text" value="' + pgtEscape(v.atas_nama || '') + '"></div></div>' +
      '<div class="pgi-sec">' + k('ph-signature', '#B86E00', 'Penanda tangan') +
        '<div><label for="pgi-ttdNama">Nama</label><input id="pgi-ttdNama" type="text" value="' + pgtEscape(v.ttd_nama || '') + '"></div>' +
        '<div><label for="pgi-ttdJab">Jabatan</label><input id="pgi-ttdJab" type="text" value="' + pgtEscape(v.ttd_jabatan || '') + '"></div>' +
        '<div class="full"><label>Cap dan tanda tangan</label><div class="pgi-ttd-row"><span id="pgi-ttdPrev">' + ttdBox + '</span>' +
          '<button type="button" class="pgt-toggle-btn" id="pgi-ttdPick"><i class="ph ph-upload-simple" aria-hidden="true"></i><span>' + (v.ttd_file_id ? 'Ganti gambar' : 'Unggah gambar') + '</span></button>' +
          (v.ttd_file_id ? '<button type="button" class="pgt-toggle-btn" id="pgi-ttdDel"><i class="ph ph-trash" aria-hidden="true"></i><span>Hapus</span></button>' : '') +
          '<input type="file" id="pgi-ttdFile" accept="image/png,image/jpeg" hidden></div>' +
          '<div class="pgi-hint">PNG dengan latar transparan paling bagus. Dicetak di atas nama penanda tangan.</div></div></div>' +
      '<div class="pgi-sec">' + k('ph-text-align-left', 'var(--ink-soft)', 'Footer dokumen') +
        '<div class="full"><label for="pgi-kontak">Kontak untuk pertanyaan</label><input id="pgi-kontak" type="text" value="' + pgtEscape(v.kontak_admin || '') + '"></div>' +
        '<div class="full"><label for="pgi-tagline">Tagline</label><input id="pgi-tagline" type="text" value="' + pgtEscape(v.tagline || '') + '"></div></div>' +
      '</div>' +
      '<div id="pgt-alert-identitas_dokumen" class="alert alert-error" hidden></div>' +
      '<div class="pgi-act"><button type="button" class="pgt-cancel-btn" id="pgi-cancel">Batal</button><button type="button" class="pgt-save-btn" id="pgi-save">Simpan</button></div>' +
    '</div>' : '';
    return '<div class="pgf-card pgi-card' + (pgtIdnOpen && pgtCanEdit ? ' is-edit' : '') + '" id="pgi-card" data-card="identitas_dokumen">' +
      '<div class="pgf-head"><span class="pgc-ico"><i class="ph ph-identification-card" aria-hidden="true"></i></span>' +
        '<div><h3>Identitas dokumen</h3><p title="' + sub + '">' + sub + '</p></div>' +
        (pgtCanEdit ? '<button type="button" class="pgt-toggle-btn" id="pgi-toggle" aria-expanded="' + pgtIdnOpen + '"><i class="ph ph-pencil-simple" aria-hidden="true"></i><span>Ubah</span></button>' : '') +
      '</div>' + sum + form +
      '<div class="pgi-note"><i class="ph ph-file-pdf" aria-hidden="true"></i>Dicetak di invoice, kuitansi, slip gaji, laporan belajar, dan rekap.</div>' +
    '</div>';
  }
  function pgtIdnRekRows(list) {
    var el = document.getElementById('pgi-rekList');
    if (!el) return;
    el.innerHTML = list.map(function (x, i) {
      return '<div class="pgi-rek" data-i="' + i + '"><input type="text" class="pgi-bank" placeholder="Bank" value="' + pgtEscape(x.bank || '') + '" aria-label="Nama bank">' +
        '<input type="text" class="pgi-nomor" inputmode="numeric" placeholder="Nomor rekening" value="' + pgtEscape(x.nomor || '') + '" aria-label="Nomor rekening">' +
        '<button type="button" class="pgi-rekDel" aria-label="Hapus rekening"><i class="ph ph-x" aria-hidden="true"></i></button></div>';
    }).join('');
  }
  function pgtIdnReadRek() {
    return Array.prototype.map.call(document.querySelectorAll('#pgi-rekList .pgi-rek'), function (row) {
      return { bank: row.querySelector('.pgi-bank').value.trim(), nomor: row.querySelector('.pgi-nomor').value.replace(/\s+/g, '') };
    }).filter(function (x) { return x.bank || x.nomor; });
  }
  function pgtIdnSetOpen(open) {
    pgtIdnOpen = open;
    var card = document.getElementById('pgi-card'), btn = document.getElementById('pgi-toggle');
    if (card) card.classList.toggle('is-edit', open);
    if (btn) btn.setAttribute('aria-expanded', open);
    if (open && card) setTimeout(function () { card.scrollIntoView({ behavior: PGT_REDUCED_MOTION ? 'auto' : 'smooth', block: 'nearest' }); }, 30);
  }
  function pgtIdnBind() {
    if (!pgtRows.identitas_dokumen || !pgtCanEdit) return;
    pgtIdnRekRows(pgtIdn.rekening.length ? pgtIdn.rekening : [{ bank: '', nomor: '' }]);
    document.getElementById('pgi-toggle').addEventListener('click', function () { pgtIdnSetOpen(!pgtIdnOpen); });
    document.getElementById('pgi-cancel').addEventListener('click', function () { pgtIdnOpen = false; pgtRerenderList(false); });
    document.getElementById('pgi-rekAdd').addEventListener('click', function () {
      var list = pgtIdnReadRek(); list.push({ bank: '', nomor: '' }); pgtIdnRekRows(list);
    });
    document.getElementById('pgi-rekList').addEventListener('click', function (e) {
      var b = e.target.closest('.pgi-rekDel'); if (!b) return;
      b.closest('.pgi-rek').remove();
    });
    document.getElementById('pgi-ttdPick').addEventListener('click', function () { document.getElementById('pgi-ttdFile').click(); });
    document.getElementById('pgi-ttdFile').addEventListener('change', function () { if (this.files && this.files[0]) pgtIdnUploadTtd(this.files[0]); });
    var del = document.getElementById('pgi-ttdDel');
    if (del) del.addEventListener('click', function () { pgtIdnSave({ ttd_file_id: '' }); });
    document.getElementById('pgi-save').addEventListener('click', function () { pgtIdnSave(); });
  }
  function pgtIdnCollect() {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
    return {
      alamat: g('pgi-alamat'), telepon: g('pgi-telepon'), email: g('pgi-email'), kontak_admin: g('pgi-kontak'),
      rekening: pgtIdnReadRek(), atas_nama: g('pgi-an'), ttd_nama: g('pgi-ttdNama'), ttd_jabatan: g('pgi-ttdJab'),
      ttd_file_id: pgtIdn.ttd_file_id || '', tagline: g('pgi-tagline')
    };
  }
  async function pgtIdnSave(patch) {
    var alertEl = document.getElementById('pgt-alert-identitas_dokumen');
    var v = Object.assign(pgtIdnCollect(), patch || {});
    if (!v.alamat || !v.telepon) { alertEl.textContent = 'Alamat dan telepon wajib diisi.'; alertEl.hidden = false; return; }
    alertEl.hidden = true;
    var btn = document.getElementById('pgi-save');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Menyimpan...';
    try {
      var s = genioSessionOrLogin();
      await supaRest('pengaturan?id=eq.' + pgtRows.identitas_dokumen.id, s.access_token, {
        method: 'PATCH', headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ nilai: JSON.stringify(v), updated_by: s.user_id })
      });
      if (typeof genioDocIdentity === 'function') genioDocIdentity(true);
      genioToast('Identitas dokumen disimpan. PDF berikutnya memakai data ini.', 'success');
      pgtIdnOpen = !!patch;
      pgtLoadList();
    } catch (err) {
      alertEl.textContent = err.message || 'Gagal menyimpan.'; alertEl.hidden = false;
      btn.disabled = false; btn.textContent = 'Simpan';
    }
  }
  function pgtIdnUploadTtd(file) {
    if (pgtIdnTtdBusy) return;
    if (!/^image\/(png|jpeg)$/.test(file.type)) { genioToast('Gunakan gambar PNG atau JPG', 'error'); return; }
    if (file.size > 3 * 1024 * 1024) { genioToast('Ukuran gambar maksimal 3 MB', 'error'); return; }
    if (!(window.google && google.script && google.script.run)) { genioToast('Unggah hanya bisa dari aplikasi', 'error'); return; }
    pgtIdnTtdBusy = true;
    genioToast('Mengunggah cap dan tanda tangan...', 'loading', true);
    var reader = new FileReader();
    reader.onload = function () {
      var b64 = String(reader.result).split(',')[1];
      google.script.run
        .withSuccessHandler(function (res) {
          pgtIdnTtdBusy = false;
          if (!res || !res.success) { genioToast('Gagal mengunggah: ' + ((res && res.error) || ''), 'error'); return; }
          pgtIdn.ttd_file_id = res.fileId;
          pgtIdnSave({ ttd_file_id: res.fileId });
        })
        .withFailureHandler(function (e) { pgtIdnTtdBusy = false; genioToast('Gagal mengunggah: ' + (e.message || e), 'error'); })
        .uploadDokumenTtd(b64, file.name, file.type, pgtIdn.ttd_file_id || '');
    };
    reader.readAsDataURL(file);
  }
</script>

<!-- ===== Jadwal kosong tutor =====
     Tutor: "Atur jadwal kosong" (popup #jk-formModal, dibuka dari kartu di Profil dan pengingat di Beranda tutor),
     blok 30 menit 07.00-21.00; jam yang sudah ada jadwal mengajar (kontrak aktif) terkunci.
     Manajemen (manajer, super admin, kepala unit, HRD): menu Lainnya "Jadwal Kosong Tutor" (panel jadwal-kosong),
     jumlah tutor kosong per 30 menit (jadwal kosong dikurangi jadwal mengajar), popup daftar tutor (#jk-listModal).
     Data: tabel tutor_jadwal_kosong, tutor_profile.jadwal_kosong_at, RPC simpan_jadwal_kosong dan tutor_jam_terisi
     (supabase/migrations/20261012_tutor_jadwal_kosong.sql). -->
<style>
  @media (min-width:900px){
    .module-panel[data-module="jadwal-kosong"][hidden]{ display:none !important; }
    .module-panel[data-module="jadwal-kosong"]:not([hidden]){ width:94%; max-width:1500px; margin:0 auto; }
  }
  [data-module="jadwal-kosong"] [hidden]{display:none !important;}
  #jk-formModal, #jk-listModal, #jk-remindModal{align-items:center; justify-content:center; padding:16px; opacity:0; transition:opacity .28s ease;}
  #jk-formModal.show, #jk-listModal.show, #jk-remindModal.show{opacity:1;}
  #jk-remindModal .modal-sheet.gx-sheet{max-width:380px !important;}
  #jk-remindModal .gx-head-ico{background:#FFF4E0 !important; color:#B86E00 !important;}
  .jk-rm-sum{background:var(--surface); border-radius:10px; padding:10px 12px; font-size:11.5px; color:var(--ink); line-height:1.55;}
  .jk-rm-sum b{font-weight:700;}
  .jk-rm-sum small{display:block; font-size:10.5px; color:var(--ink-soft); margin-bottom:4px;}
  #jk-formModal .modal-sheet.gx-sheet{max-width:440px !important;}
  @media (min-width:900px){ #jk-formModal.is-week .modal-sheet.gx-sheet{max-width:920px !important;} }
  #jk-listModal .modal-sheet.gx-sheet{max-width:420px !important;}

  /* Pemilih hari: rel abu muda dan pil putih (sama dengan tab bar) */
  .jk-days{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:2px; background:#ECEEF5; border:1px solid #fff; border-radius:999px; padding:3px; box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(20,22,43,.04);}
  .jk-days button{position:relative; height:30px; border:0; border-radius:999px; background:none; font-family:var(--font); font-size:11px; font-weight:500; color:#8A8EA6; cursor:pointer; transition:background .15s ease, color .15s ease;}
  .jk-days button.is-on{background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(20,22,43,.06), 0 6px 14px -6px rgba(20,22,43,.18);}
  .jk-days button i{position:absolute; top:4px; right:7px; width:5px; height:5px; border-radius:50%; background:var(--blue);}

  /* ----- Form tutor ----- */
  .jk-quick{display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 2px;}
  .jk-quick button{height:28px; padding:0 11px; border-radius:999px; border:1px solid var(--border); background:#fff; font-family:var(--font); font-size:10.5px; font-weight:500; color:var(--ink-soft); display:inline-flex; align-items:center; gap:5px; cursor:pointer;}
  .jk-quick button.is-on{border-color:var(--blue); color:var(--blue); background:var(--blue-tint);}
  .jk-copy{margin-top:8px; padding:10px 12px; border-radius:10px; background:var(--surface); font-size:10.5px; color:var(--ink-soft);}
  .jk-copy-days{display:flex; gap:5px; flex-wrap:wrap; margin:7px 0 8px;}
  .jk-copy-days button{height:26px; padding:0 10px; border-radius:999px; border:1px solid var(--border); background:#fff; font-family:var(--font); font-size:10.5px; color:var(--ink-soft); cursor:pointer;}
  .jk-copy-days button.is-on{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;}
  .jk-copy-act{display:flex; gap:6px; justify-content:flex-end;}
  .jk-copy-act button{height:28px; padding:0 12px; border-radius:8px; font-family:var(--font); font-size:10.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:#fff; color:var(--ink);}
  .jk-copy-act button.is-p{background:var(--blue); border-color:var(--blue); color:#fff;}
  .jk-grp{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-soft); margin:12px 0 6px;}
  .jk-slots{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px;}
  .jk-sl{height:32px; border-radius:8px; border:1px solid var(--border); background:#fff; font-family:var(--font); font-size:11px; font-variant-numeric:tabular-nums; color:var(--ink); display:flex; align-items:center; justify-content:center; gap:4px; cursor:pointer; transition:background .12s ease, border-color .12s ease, color .12s ease; -webkit-user-select:none; user-select:none; touch-action:manipulation;}
  .jk-sl.is-on{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;}
  .jk-sl.is-busy, .jk-c.is-busy{background:repeating-linear-gradient(135deg, #F1F2F7 0 4px, #E6E8F0 4px 8px); color:#A3A7BA; border-color:var(--border); cursor:not-allowed;}
  .jk-sl.is-busy i{font-size:11px;}
  .jk-leg{display:flex; gap:12px; flex-wrap:wrap; font-size:10px; color:var(--ink-soft); margin-top:12px;}
  .jk-leg span{display:inline-flex; align-items:center; gap:5px;}
  .jk-leg i{width:10px; height:10px; border-radius:3px; display:inline-block; border:1px solid var(--border); background:#fff;}
  .jk-sum{margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--surface); font-size:10.5px; color:var(--ink-soft); line-height:1.6;}
  .jk-sum b{color:var(--ink); font-weight:600;}
  /* Grid minggu (form desktop dan tampilan manajemen desktop) */
  .jk-wk{display:grid; grid-template-columns:44px repeat(28, minmax(0,1fr)); gap:2px; align-items:center; -webkit-user-select:none; user-select:none;}
  .jk-wk .h{font-size:9px; color:var(--muted, #8A8EA5); white-space:nowrap; overflow:visible;}
  .jk-wk .d{font-size:10.5px; font-weight:600; color:var(--ink); background:none; border:0; padding:0; text-align:left; font-family:var(--font); cursor:pointer;}
  .jk-wk .d.is-on{color:var(--blue);}
  .jk-c{height:24px; border-radius:4px; background:#F1F2F7; border:0; padding:0; cursor:pointer; font-family:var(--font);}
  .jk-c.is-on{background:var(--blue);}
  .jk-form-week .jk-c:not(.is-busy):hover{box-shadow:inset 0 0 0 1.5px var(--blue);}

  /* ----- Kartu tutor (Profil dan pengingat Beranda) ----- */
  .jk-card{background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 16px;}
  .jk-card-h{display:flex; align-items:center; gap:10px;}
  .jk-ico{width:34px; height:34px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; font-size:17px; background:var(--blue-tint); color:var(--blue);}
  .jk-ico.is-amber{background:#FFF4E0; color:#B86E00;}
  .jk-card-t{flex:1; min-width:0;}
  .jk-card-t b{display:block; font-size:12px; font-weight:600; color:var(--ink);}
  .jk-card-t small{display:block; font-size:10.5px; color:var(--ink-soft); margin-top:1px;}
  .jk-card-t small.is-stale{color:#B86E00;}
  .jk-btn{height:32px; padding:0 12px; border-radius:9px; border:0; background:var(--blue); color:#fff; font-family:var(--font); font-size:11px; font-weight:600; display:inline-flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap; flex:none;}
  .jk-btn.is-sec{background:#fff; color:var(--ink); border:1px solid var(--border);}
  .jk-mini{display:grid; grid-template-columns:40px repeat(7, minmax(0,1fr)); gap:3px; margin-top:12px; font-size:9.5px; color:var(--muted, #8A8EA5); align-items:center;}
  .jk-mini span{text-align:center;} .jk-mini span.l{text-align:left;}
  .jk-mini i{display:block; height:8px; border-radius:2px; background:#F1F2F7;}
  .jk-mini i.is-on{background:var(--blue);} .jk-mini i.is-half{background:#9C9BE4;} .jk-mini i.is-busy{background:repeating-linear-gradient(135deg, #E6E8F0 0 3px, #D9DCE6 3px 6px);}
  .jk-card-f{display:flex; justify-content:flex-end; margin-top:12px;}
  .jk-remind{border-color:#F5DDB0; background:#FFFCF6; margin-bottom:14px;}
  #hmtJkCard{margin-bottom:14px;}

  /* ----- Tampilan manajemen ----- */
  .jkh{position:relative; overflow:hidden; border-radius:18px; color:#fff; margin-bottom:14px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,320px); background:linear-gradient(135deg, #070833 0%, #101075 55%, var(--blue) 100%);}
  .jkh-main{padding:16px 20px; min-width:0;}
  .jkh-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .jkh-lbl{display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:500; color:rgba(255,255,255,.72);}
  .jkh-lbl i{width:6px; height:6px; border-radius:50%; background:#7CF0C3; box-shadow:0 0 0 4px rgba(124,240,195,.16);}
  .jkh-pill{font-size:10px; font-weight:500; background:rgba(255,255,255,.12); padding:2px 8px; border-radius:999px; white-space:nowrap;}
  .jkh-hero{display:flex; align-items:baseline; gap:6px; margin-top:8px; min-width:0;}
  .jkh-num{font-size:32px; font-weight:800; letter-spacing:-.035em; line-height:1.05; font-variant-numeric:tabular-nums;}
  .jkh-unit{font-size:12px; color:rgba(255,255,255,.65); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .jkh-sub{font-size:10.5px; color:rgba(255,255,255,.62); margin-top:4px;}
  .jkh-bars{display:flex; align-items:flex-end; gap:8px; height:64px; margin-top:12px;}
  .jkh-bars button{flex:1; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-end; height:100%; background:none; border:0; padding:0; cursor:pointer; font-family:var(--font);}
  .jkh-bars button i{display:block; border-radius:4px; background:#7CF0C3; opacity:.5; min-height:3px; transform-origin:bottom center;}
  .jkh-bars button.is-on i{opacity:1;}
  .jkh-bars button span{font-size:9.5px; color:rgba(255,255,255,.6); margin-top:4px; text-align:center;}
  .jkh-bars button.is-on span{color:#fff; font-weight:600;}
  .jkh.is-anim .jkh-bars i{animation:jkGrow .7s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--i) * 50ms);}
  @keyframes jkGrow{from{transform:scaleY(0);} to{transform:none;}}
  .jkh-side{background:rgba(255,255,255,.06); border-left:1px solid rgba(255,255,255,.1); padding:14px 18px; display:flex; flex-direction:column; justify-content:center; gap:9px; min-width:0;}
  .jkh-side h5{margin:0; font-size:11px; font-weight:600;}
  .jkh-row{display:flex; align-items:center; gap:8px; font-size:10.5px; color:rgba(255,255,255,.78); min-width:0;}
  .jkh-row em{font-style:normal; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .jkh-row b{color:#fff; font-weight:700; font-variant-numeric:tabular-nums;}
  .jkh-row.is-warn b{color:#FFC46B;}
  /* Filter: dua tombol dropdown (pilih lebih dari satu). Menu #jk-ddMenu menempel di bawah tombol;
     di HP hampir selebar layar (12px kiri kanan), di desktop 260px dari tepi kiri tombol */
  .jk-filters{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px;}
  .jk-dd{height:34px; padding:0 10px 0 12px; border-radius:10px; border:1px solid var(--border); background:#fff; font-family:var(--font); font-size:11.5px; color:var(--ink); display:inline-flex; align-items:center; gap:7px; cursor:pointer; min-width:0; max-width:100%;}
  .jk-dd .l{font-size:14px; color:var(--ink-soft); flex:none;}
  .jk-dd small{font-size:11px; color:var(--ink-soft); flex:none;}
  .jk-dd b{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; max-width:170px;}
  .jk-dd .ct{flex:none; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--blue); color:#fff; font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box;}
  .jk-dd .car{font-size:12px; color:var(--muted, #8A8EA5); flex:none; margin-left:auto; transition:transform .18s ease;}
  .jk-dd.is-open{border-color:var(--blue); box-shadow:0 0 0 3px rgba(28,26,175,.12);}
  .jk-dd.is-open .car{transform:rotate(180deg);}
  .jk-reset{border:0; background:none; font-family:var(--font); font-size:11px; font-weight:600; color:var(--blue); cursor:pointer; padding:6px 4px;}
  @media (max-width:899px){
    .jk-filters{flex-wrap:nowrap;}
    .jk-filters .jk-dd{flex:1 1 0;}
    .jk-filters .jk-dd small{display:none;}
    .jk-reset{display:none;}
  }
  .jk-ddmenu{position:fixed; z-index:70; background:#fff; border:1px solid var(--border); border-radius:14px; box-shadow:0 16px 40px -10px rgba(20,22,43,.25); overflow:hidden; display:flex; flex-direction:column; opacity:0; transform:translateY(-4px); transition:opacity .16s ease, transform .16s ease; font-family:var(--font);}
  .jk-ddmenu.show{opacity:1; transform:none;}
  .jk-ddmenu[hidden]{display:none;}
  .jk-ddh{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border-bottom:1px solid var(--border); font-size:10.5px; color:var(--ink-soft); flex:none;}
  .jk-ddh span{white-space:nowrap;}
  .jk-ddh .acts{display:flex; gap:10px;}
  .jk-ddh button{border:0; background:none; padding:0; font-family:var(--font); font-size:10.5px; font-weight:600; color:var(--blue); cursor:pointer; white-space:nowrap;}
  .jk-ddl{overflow-y:auto; overscroll-behavior:contain;}
  .jk-opt{display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border:0; background:#fff; font-family:var(--font); font-size:11.5px; color:var(--ink); text-align:left; cursor:pointer;}
  .jk-opt:hover{background:var(--surface);}
  .jk-opt.is-on{background:#FAFAFE;}
  .jk-opt .cb{width:18px; height:18px; border-radius:5px; border:1.5px solid #C9CCDA; background:#fff; display:flex; align-items:center; justify-content:center; flex:none; color:#fff; font-size:11px; box-sizing:border-box;}
  .jk-opt.is-on .cb{background:var(--blue); border-color:var(--blue);}
  .jk-opt em{margin-left:auto; font-style:normal; font-size:10px; color:var(--muted, #8A8EA5); white-space:nowrap;}
  .jk-panel{background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 16px;}
  .jk-panel-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .jk-panel-h b{font-size:12px; font-weight:600;} .jk-panel-h span{font-size:10.5px; color:var(--ink-soft);}
  .jk-hm .jk-c{display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:700; color:var(--blue); height:28px;}
  .jk-hm .jk-c.l1{background:#E4E4F8;} .jk-hm .jk-c.l2{background:#C3C3F0;} .jk-hm .jk-c.l3{background:#7E7CDC; color:#fff;} .jk-hm .jk-c.l4{background:var(--blue); color:#fff;}
  .jk-hm .jk-c.l0{cursor:default;}
  /* Opsi A juga di grid mingguan: kotak terangkat, baris hari + kolom jam tetap terang, kartu intip tutor (jkWeekPeek) */
  .jk-hm .jk-c{position:relative; transition:transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s ease, background-color .2s ease, color .2s ease;}
  .jk-hm .h, .jk-hm .d{transition:color .2s ease, transform .2s ease;}
  .jk-hm .jk-c.is-hot{transform:translateY(-3px) scale(1.15); box-shadow:0 8px 16px -6px rgba(28,26,175,.55); z-index:1;}
  .jk-hm .jk-c.l1.is-hot{background:#C3C3F0;} .jk-hm .jk-c.l2.is-hot{background:#7E7CDC; color:#fff;} .jk-hm .jk-c.l3.is-hot{background:var(--blue); color:#fff;} .jk-hm .jk-c.l4.is-hot{background:#0E0C6E; color:#fff;}
  .jk-hm .h.is-hl{color:var(--blue); font-weight:700; transform:translateY(-2px);}
  .jk-hm.is-hov .d.is-on:not(.is-hl){color:var(--ink);}
  .jk-hm .d.is-hl{color:var(--blue);}
  @media (prefers-reduced-motion: reduce){ .jk-hm .jk-c, .jk-hm .h, .jk-hm .d{transition:none;} .jk-hm .jk-c.is-hot{transform:none;} .jk-hm .h.is-hl{transform:none;} }
  .jk-hm .jk-row-on{box-shadow:inset 3px 0 0 var(--blue);}
  .jk-list{display:flex; flex-direction:column;}
  .jk-tr{display:grid; grid-template-columns:86px minmax(0,1fr) 22px 14px; gap:10px; align-items:center; padding:8px 0; border:0; border-top:1px solid #EEF0F6; background:none; font-family:var(--font); font-size:11px; color:var(--ink); text-align:left; cursor:pointer; width:100%;}
  .jk-tr:first-child{border-top:0;}
  .jk-tr .b{height:16px; border-radius:5px; background:#F1F2F7; position:relative; overflow:hidden;}
  .jk-tr .b i{position:absolute; left:0; top:0; bottom:0; background:var(--blue); border-radius:5px; transform-origin:left center;}
  .jk-tr b{text-align:right; font-variant-numeric:tabular-nums;}
  .jk-tr .ch{color:var(--muted, #8A8EA5); font-size:12px;}
  .jk-tr.is-zero{color:var(--muted, #8A8EA5); cursor:default;}
  .jk-list.is-anim .jk-tr .b i{animation:jkGrowX .6s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--i) * 25ms);}
  @keyframes jkGrowX{from{transform:scaleX(0);} to{transform:none;}}
  /* Template saat belum ada jam kosong: grid / daftar abu tetap tampil, kartu keterangan di tengahnya */
  .jk-wk.is-tpl .jk-c, .jk-list.is-tpl .jk-tr{opacity:.55; pointer-events:none;}
  .jk-wide{position:relative;}
  .jk-tpl-wrap{position:absolute; left:44px; right:0; top:18px; height:220px; display:flex; align-items:center; justify-content:center; z-index:1; pointer-events:none;}
  .jk-tpl{display:flex; align-items:center; gap:12px; max-width:420px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:0 12px 30px -12px rgba(20,22,43,.22); pointer-events:auto; text-align:left;}
  .jk-tpl b{display:block; font-size:12px; font-weight:600; color:var(--ink);}
  .jk-tpl small{display:block; font-size:10.5px; color:var(--ink-soft); margin-top:2px; line-height:1.5;}
  .jk-list .jk-tpl{margin:4px 0 10px; box-shadow:none; max-width:none;}
  .jk-daynote{font-size:10.5px; color:var(--ink-soft); background:var(--surface); border-radius:10px; padding:8px 12px; margin:2px 0 8px;}
  /* Kartu Home HRD */
  .jkc{display:flex; flex-direction:column; position:relative;}
  .jkc-sub{font-size:10.5px; color:var(--ink-soft); margin:-4px 0 12px;}
  .jkc-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:-4px 0 12px;}
  .jkc-head .jkc-sub{margin:0;}
  .jkc-nav{display:flex; gap:6px; flex:none;}
  .jkc-nav[hidden]{display:none;}
  .jkc-nav button{width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:#fff; color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; transition:background .15s ease, opacity .2s ease, transform .15s ease;}
  .jkc-nav button:hover:not(:disabled){background:var(--surface);}
  .jkc-nav button:active:not(:disabled){transform:scale(.92);}
  .jkc-nav button:disabled{opacity:.35; cursor:default;}
  .jkc-wrap{position:relative;}
  /* Geser: seret dengan mouse (inersia), tombol panah (animasi halus), atau usap di HP */
  .jkc-scroll{overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; padding-bottom:4px; cursor:grab;}
  .jkc-scroll::-webkit-scrollbar{display:none;}
  .jkc-scroll.is-drag{cursor:grabbing; -webkit-user-select:none; user-select:none;}
  .jkc-scroll.is-drag .jkc-c{pointer-events:none;}
  .jkc-wrap::after{content:''; position:absolute; top:0; bottom:4px; right:0; width:28px; background:linear-gradient(90deg, rgba(255,255,255,0), #fff); pointer-events:none; opacity:0; transition:opacity .25s ease;}
  .jkc-wrap.has-more::after{opacity:1;}
  .jkc-wrap::before{content:''; position:absolute; top:0; bottom:4px; left:62px; width:22px; background:linear-gradient(270deg, rgba(255,255,255,0), #fff); pointer-events:none; opacity:0; transition:opacity .25s ease; z-index:2;}
  .jkc-wrap.has-less::before{opacity:1;}
  .jkc-g{display:grid; gap:4px; align-items:center; width:max-content;}
  .jkc-h{font-size:9.5px; color:var(--muted, #8A8EA5); text-align:center;}
  .jkc-l{position:sticky; left:0; z-index:2; background:#fff; font-size:11px; font-weight:600; color:var(--ink); line-height:1.15; padding-right:6px; align-self:stretch; display:flex; flex-direction:column; justify-content:center;}
  .jkc-l small{font-size:9.5px; font-weight:400; color:var(--ink-soft);}
  .jkc-l.is-on{color:var(--blue);}
  .jkc-c{width:28px; height:28px; border-radius:5px; border:0; padding:0; background:#F1F2F7; font-family:var(--font); font-size:10px; font-weight:700; color:var(--blue); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .jkc-c.l1{background:#E4E4F8;} .jkc-c.l2{background:#C3C3F0;} .jkc-c.l3{background:#7E7CDC; color:#fff;} .jkc-c.l4{background:var(--blue); color:#fff;}
  .jkc-c.l0{cursor:default;}
  /* Opsi A (owner's choice 12 Oct 2026): sorotan silang + kartu intip saat mouse digeser */
  .jkc-c{position:relative; transition:transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s ease, background-color .2s ease, color .2s ease;}
  .jkc-h, .jkc-l{transition:color .2s ease, transform .2s ease;}
  /* Opsi 1 (owner's choice 13 Oct 2026): kotak lain tidak berubah warna; hanya kotak yang ditunjuk naik satu tingkat warna */
  .jkc-c.is-hot{transform:translateY(-3px) scale(1.15); box-shadow:0 8px 16px -6px rgba(28,26,175,.55); z-index:1;}
  .jkc-c.l1.is-hot{background:#C3C3F0;} .jkc-c.l2.is-hot{background:#7E7CDC; color:#fff;} .jkc-c.l3.is-hot{background:var(--blue); color:#fff;} .jkc-c.l4.is-hot{background:#0E0C6E; color:#fff;}
  .jkc-h.is-hl{color:var(--blue); font-weight:700; transform:translateY(-2px);}
  .jkc-g.is-hov .jkc-l.is-on:not(.is-hl){color:var(--ink);}
  .jkc-l.is-hl{color:var(--blue);}
  .jkc-peek{position:absolute; z-index:6; pointer-events:none; background:#fff; border:1px solid var(--border); border-radius:12px; padding:9px 11px; box-shadow:0 14px 30px -12px rgba(20,22,43,.35); width:max-content; min-width:150px; max-width:210px; opacity:0; transform:translateY(6px) scale(.96); transition:opacity .18s ease, transform .25s cubic-bezier(.16,1,.3,1), left .25s cubic-bezier(.16,1,.3,1), top .25s cubic-bezier(.16,1,.3,1);}
  .jkc-peek.show{opacity:1; transform:none;}
  .jkc-peek.is-new{transition:opacity .18s ease, transform .25s cubic-bezier(.16,1,.3,1);}
  .jkc-peek b{display:block; font-size:11px; font-weight:600; color:var(--ink);}
  .jkc-peek .pt{font-size:10px; color:var(--ink-soft); margin-bottom:6px;}
  .jkc-peek .pa{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--ink); margin-top:4px; min-width:0; animation:jkcPk .3s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--k) * 40ms);}
  .jkc-peek .pa span:last-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .jkc-peek .pav{width:18px; height:18px; border-radius:50%; flex:none; display:inline-flex; align-items:center; justify-content:center; background:var(--blue-tint); color:var(--blue); font-size:7.5px; font-weight:700; overflow:hidden;}
  .jkc-peek .pav img{width:100%; height:100%; object-fit:cover;}
  .jkc-peek .pm{font-size:10px; color:var(--ink-soft); margin-top:5px;}
  @keyframes jkcPk{from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:none;}}
  .jkc-g.is-tpl .jkc-c{opacity:.55; pointer-events:none;}
  .jkc-g.is-anim .jkc-c{animation:jkcIn .4s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--i) * 18ms);}
  @keyframes jkcIn{from{opacity:0; transform:scale(.7);} to{opacity:1; transform:none;}}
  .jkc-msg{position:absolute; inset:18px 0 4px 62px; display:flex; align-items:center; justify-content:center; pointer-events:none;}
  .jkc-msg span{background:#fff; border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:10.5px; color:var(--ink-soft); box-shadow:0 8px 20px -10px rgba(20,22,43,.25);}
  .jkc-leg{display:flex; gap:12px; flex-wrap:wrap; font-size:10px; color:var(--ink-soft); margin-top:12px; padding-top:10px; border-top:1px dashed var(--border);}
  .jkc-leg span{display:inline-flex; align-items:center; gap:5px;} .jkc-leg i{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .jkc-more{margin-top:auto; padding-top:10px; border:0; background:none; font-family:var(--font); font-size:11px; font-weight:600; color:var(--blue); cursor:pointer;}
  @media (prefers-reduced-motion: reduce){ .jkc-g.is-anim .jkc-c{animation:none;} .jkc-c, .jkc-h, .jkc-l, .jkc-peek, .jkc-peek .pa{transition:none; animation:none;} .jkc-c.is-hot{transform:none;} .jkc-h.is-hl{transform:none;} }
  .jk-empty{text-align:center; padding:28px 16px; font-size:11px; color:var(--ink-soft);}
  .jk-empty i{font-size:26px; opacity:.6; display:block; margin-bottom:6px;}
  .jk-leg2{display:flex; gap:12px; flex-wrap:wrap; font-size:10px; color:var(--ink-soft); margin-top:12px;}
  .jk-leg2 span{display:inline-flex; align-items:center; gap:5px;} .jk-leg2 i{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .jk-wide{display:none;} .jk-narrow{display:block;}
  @media (min-width:900px){ .jk-wide{display:block;} .jk-narrow{display:none;} }
  @media (max-width:899px){
    .jkh{grid-template-columns:1fr;} .jkh-side{border-left:0; border-top:1px solid rgba(255,255,255,.1);}
    .jkh-num{font-size:28px;}
  }
  /* Popup daftar tutor */
  .jk-tl{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border); min-width:0;}
  .jk-tl:first-child{border-top:0;}
  .jk-av{width:36px; height:36px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:var(--blue-tint); color:var(--blue); font-weight:700; font-size:11px; overflow:hidden;}
  .jk-tw{flex:1; min-width:0;}

  .jk-tw small em{font-style:normal; color:#B86E00;}
  .jk-tw small.jk-free{color:var(--blue); font-weight:600;}
  .jk-wa{width:34px; height:34px; border-radius:9px; border:1px solid #BFE8D2; background:#EFFAF4; color:#12895A; display:flex; align-items:center; justify-content:center; font-size:17px; flex:none; text-decoration:none;}
  .jk-wa.is-off{opacity:.4; pointer-events:none;}

<script>
(function () {
  var HARI = ['senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu', 'minggu'];
  var HARI_S = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
  var HARI_L = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
  var START = 7 * 60, N = 28; // 07.00 sampai 21.00, blok 30 menit
  var BLOK = [['Pagi', 0, 10], ['Siang', 10, 16], ['Sore', 16, 22], ['Malam', 22, 28]];
  var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STALE_DAYS = 30;

  function esc(t) { return genioEscapeHtml(t == null ? '' : String(t)); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function lbl(i) { var m = START + i * 30; return pad(Math.floor(m / 60)) + '.' + pad(m % 60); }
  function hhmm(i) { var m = START + i * 30; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function toMin(t) { var p = String(t || '').split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1] || 0, 10); }
  // Blok yang tercakup penuh oleh rentang [a, b) (jadwal kosong)
  function coverIdx(a, b) { var out = []; for (var i = 0; i < N; i++) { var s = START + i * 30; if (s >= a && s + 30 <= b) out.push(i); } return out; }
  // Blok yang bersinggungan dengan rentang [a, b) (jadwal mengajar)
  function touchIdx(a, b) { var out = []; for (var i = 0; i < N; i++) { var s = START + i * 30; if (s < b && s + 30 > a) out.push(i); } return out; }
  function emptyWeek() { return HARI.map(function () { return new Array(N).fill(false); }); }
  function dayIdx(h) { return HARI.indexOf(String(h || '').toLowerCase()); }
  // Blok terpilih per hari -> rentang berdampingan [{hari, jam_mulai, jam_selesai}]
  function toRanges(week) {
    var out = [];
    week.forEach(function (row, d) {
      var i = 0;
      while (i < N) {
        if (!row[i]) { i++; continue; }
        var j = i; while (j < N && row[j]) j++;
        out.push({ hari: HARI[d], jam_mulai: hhmm(i), jam_selesai: j === N ? '21:00' : hhmm(j) });
        i = j;
      }
    });
    return out;
  }
  function rangesText(week) {
    var parts = [];
    week.forEach(function (row, d) {
      var segs = [], i = 0;
      while (i < N) { if (!row[i]) { i++; continue; } var j = i; while (j < N && row[j]) j++; segs.push(lbl(i) + '-' + (j === N ? '21.00' : lbl(j))); i = j; }
      if (segs.length) parts.push('<b>' + HARI_L[d] + '</b> ' + segs.join(', '));
    });
    return parts;
  }
  function countOn(week) { var n = 0; week.forEach(function (r) { r.forEach(function (v) { if (v) n++; }); }); return n; }
  function jamText(n) { var h = n / 2; return (h % 1 ? String(h).replace('.', ',') : h) + ' jam'; }
  function daysAgo(iso) { if (!iso) return null; return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000)); }
  function agoText(n) { return n === 0 ? 'hari ini' : n === 1 ? 'kemarin' : n + ' hari lalu'; }
  function todayIdx() { return (new Date().getDay() + 6) % 7; }
  function showModal(m) { m.hidden = false; requestAnimationFrame(function () { m.classList.add('show'); }); }
  function hideModal(m) { m.classList.remove('show'); setTimeout(function () { m.hidden = true; }, 280); }

  /* ================= TUTOR ================= */
  var me = { loaded: false, week: emptyWeek(), busy: emptyWeek(), at: null };
  var form = null; // { week, day, copyOpen, copyTo }

  async function loadMine() {
    var s = genioSessionOrLogin();
    var res = await Promise.all([
      supaRest('tutor_jadwal_kosong?tutor_id=eq.' + s.user_id + '&select=hari,jam_mulai,jam_selesai', s.access_token),
      supaRest('rpc/tutor_jam_terisi', s.access_token, { method: 'POST', body: '{}' }),
      supaRest('tutor_profile?user_id=eq.' + s.user_id + '&select=jadwal_kosong_at', s.access_token).catch(function () { return []; })
    ]);
    var week = emptyWeek(), busy = emptyWeek();
    (res[0] || []).forEach(function (r) { var d = dayIdx(r.hari); if (d < 0) return; coverIdx(toMin(r.jam_mulai), toMin(r.jam_selesai)).forEach(function (i) { week[d][i] = true; }); });
    (res[1] || []).forEach(function (r) { var d = dayIdx(r.hari); if (d < 0) return; touchIdx(toMin(r.jam_mulai), toMin(r.jam_selesai)).forEach(function (i) { busy[d][i] = true; week[d][i] = false; }); });
    me = { loaded: true, week: week, busy: busy, at: (res[2] && res[2][0] && res[2][0].jadwal_kosong_at) || null };
    return me;
  }

  // Kartu di Profil ('profil') dan pengingat di Beranda tutor ('home', hanya kalau belum diisi atau lebih dari 30 hari)
  var cards = [];
  function renderCard(c) {
    var n = countOn(me.week), ago = daysAgo(me.at), stale = ago !== null && ago > STALE_DAYS;
    if (c.mode === 'home') {
      var need = !me.at || stale;
      c.el.hidden = !need;
      if (!need) { c.el.innerHTML = ''; return; }
      c.el.innerHTML = '<div class="jk-card jk-remind"><div class="jk-card-h"><span class="jk-ico is-amber"><i class="ph ph-bell-ringing" aria-hidden="true"></i></span>' +
        '<div class="jk-card-t"><b>' + (me.at ? 'Perbarui jadwal kosong' : 'Isi jadwal kosong') + '</b><small>' + (me.at ? 'Terakhir diperbarui ' + agoText(ago) + '. Pastikan masih sesuai.' : 'Isi supaya admin tahu kapan kamu bisa mengajar.') + '</small></div>' +
        '<button type="button" class="jk-btn" data-jk-open><i class="ph ph-clock-user" aria-hidden="true"></i>Atur</button></div></div>';
      return;
    }
    c.el.hidden = false;
    var mini = '<span></span>' + HARI_S.map(function (h) { return '<span>' + h + '</span>'; }).join('');
    BLOK.forEach(function (b) {
      mini += '<span class="l">' + b[0] + '</span>';
      HARI.forEach(function (h, d) {
        var on = 0, bz = 0, tot = b[2] - b[1];
        for (var i = b[1]; i < b[2]; i++) { if (me.week[d][i]) on++; else if (me.busy[d][i]) bz++; }
        mini += '<i class="' + (on === tot ? 'is-on' : on ? 'is-half' : bz === tot ? 'is-busy' : '') + '" title="' + HARI_L[d] + ' ' + b[0].toLowerCase() + '"></i>';
      });
    });
    c.el.innerHTML = '<div class="prf-sec">Jadwal kosong</div><div class="jk-card"><div class="jk-card-h"><span class="jk-ico"><i class="ph ph-clock-user" aria-hidden="true"></i></span>' +
      '<div class="jk-card-t"><b>Jadwal kosong mengajar</b><small class="' + (stale ? 'is-stale' : '') + '">' + (me.at ? jamText(n) + ' per minggu · diperbarui ' + agoText(ago) : 'Belum diisi') + '</small></div></div>' +
      '<div class="jk-mini">' + mini + '</div>' +
      '<div class="jk-card-f"><button type="button" class="jk-btn" data-jk-open><i class="ph ph-pencil-simple" aria-hidden="true"></i>Atur jadwal kosong</button></div></div>';
  }
  function tutorCard(el, mode) {
    if (!el) return;
    var s = genioGetSession();
    if (!s || s.role !== 'tutor') { el.hidden = true; return; }
    var c = cards.filter(function (x) { return x.el === el; })[0];
    if (!c) {
      c = { el: el, mode: mode }; cards.push(c);
      el.addEventListener('click', function (e) { if (e.target.closest('[data-jk-open]')) openForm(); });
    }
    if (me.loaded) renderCard(c);
    loadMine().then(function () { cards.forEach(renderCard); }).catch(function () { if (!me.loaded) el.hidden = true; });
  }

  // ----- Form -----
  function isWide() { return window.matchMedia('(min-width:900px)').matches; }
  async function openForm() {
    var modal = document.getElementById('jk-formModal'), body = document.getElementById('jk-formBody');
    form = { week: emptyWeek(), day: todayIdx(), copyOpen: false, copyTo: [], dirty: false };
    body.innerHTML = '<div class="jk-empty">Memuat jadwal...</div>';
    document.getElementById('jk-formSave').disabled = true;
    modal.classList.toggle('is-week', isWide());
    showModal(modal);
    try {
      await loadMine();
      form.week = me.week.map(function (r) { return r.slice(); });
      document.getElementById('jk-formSave').disabled = false;
      renderForm();
    } catch (err) {
      body.innerHTML = '<div class="jk-empty"><i class="ph ph-warning-circle" aria-hidden="true"></i>Gagal memuat: ' + esc(err.message) + '</div>';
    }
  }
  function renderForm() {
    if (!form) return;
    var body = document.getElementById('jk-formBody');
    var wide = isWide();
    document.getElementById('jk-formModal').classList.toggle('is-week', wide);
    document.getElementById('jk-formSub').textContent = wide ? 'Klik atau seret di grid. Kotak bergaris sudah ada jadwal mengajar.' : 'Ketuk jam saat kamu bisa mengajar';
    var legend = '<div class="jk-leg"><span><i style="background:var(--blue); border-color:var(--blue);"></i>Kosong (bisa mengajar)</span><span><i></i>Belum dipilih</span><span><i style="background:repeating-linear-gradient(135deg,#F1F2F7 0 3px,#E3E5F0 3px 6px);"></i>Sudah ada jadwal mengajar</span></div>';
    var sum = rangesText(form.week), n = countOn(form.week);
    var sumHtml = '<div class="jk-sum">' + (sum.length ? sum.join(' · ') + ' · total <b>' + jamText(n) + '</b> per minggu' : 'Belum ada jam yang dipilih.') + '</div>';
    if (wide) {
      var g = '<span></span>';
      for (var i = 0; i < N; i++) g += '<span class="h">' + (i % 2 === 0 ? lbl(i).slice(0, 2) : '') + '</span>';
      HARI.forEach(function (h, d) {
        g += '<span class="d" style="cursor:default;">' + HARI_S[d] + '</span>';
        for (var j = 0; j < N; j++) {
          var busy = me.busy[d][j];

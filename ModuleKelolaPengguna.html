    kepala_unit: { label: 'Kepala Unit', color: '#c06400', bg: 'rgba(192,100,0,.08)' }
  };

  function kpEscape(str) {
    var d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  function kpInit() {
    if (!kpState.initialized) {
      kpState.initialized = true;
      initKpTabScrubbing();
      setTimeout(kpUpdateDockGlider, 50);
      window.addEventListener('resize', kpUpdateDockGlider);

      document.getElementById('kp-searchInput').addEventListener('input', function (e) {
        kpState.search = e.target.value.toLowerCase();
        kpRenderList();
      });
      var viewToggleBtn = document.getElementById('kp-viewToggleBtn');
      if (viewToggleBtn) {
        viewToggleBtn.addEventListener('click', kpToggleViewMode);
      }
      document.getElementById('kp-cancelBtn').addEventListener('click', kpCloseModal);
      document.getElementById('kp-saveBtn').addEventListener('click', kpSubmitEdit);
      document.getElementById('kp-confirmCancelBtn').addEventListener('click', kpCloseConfirm);
      document.getElementById('kp-confirmOkBtn').addEventListener('click', async function () {
        var btn = this;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Menghapus...';
        try { if (kpConfirmCallback) await kpConfirmCallback(); }
        finally { btn.disabled = false; btn.textContent = 'Ya, Hapus'; kpCloseConfirm(); }
      });

      document.querySelectorAll('.kp-opt').forEach(function (opt) {
        opt.addEventListener('click', function () {
          var group = opt.closest('.kp-opt-row');
          group.querySelectorAll('.kp-opt').forEach(function (o) {
            o.style.background = '#fff'; o.style.color = 'var(--ink-soft)'; o.style.borderColor = 'var(--border)';
          });
          opt.style.background = 'var(--blue-tint)'; opt.style.color = 'var(--blue)'; opt.style.borderColor = 'var(--blue)';
          opt.querySelector('input').checked = true;
          if (group.id === 'kp-roleOpts') kpUpdateUnitFieldVisibility(opt.dataset.val);
        });
      });

      document.querySelectorAll('#kp-modal input, #kp-modal select').forEach(function (el) {
        el.addEventListener('focus', function () {
          setTimeout(function () { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300);
        });
      });

      kpApplyResponsiveLayout();
      var kpLayoutResizeTimer;
      window.addEventListener('resize', function () {
        clearTimeout(kpLayoutResizeTimer);
        kpLayoutResizeTimer = setTimeout(kpApplyResponsiveLayout, 150);
      });
    }
    kpLoadAll();
  }

  function kpUpdateUnitFieldVisibility(role) {
    document.getElementById('kp-unitFieldWrap').hidden = role !== 'kepala_unit';
  }

  function kpUpdateViewToggleUI() {
    var btn = document.getElementById('kp-viewToggleBtn');
    if (!btn) return;
    var isTable = kpState.viewMode === 'table';
    btn.style.borderColor = 'var(--border)';
    btn.style.color = 'var(--ink)';
    btn.style.background = '#fff';
    if (isTable) {
      btn.setAttribute('title', 'Tampilkan sebagai Kartu');
      btn.setAttribute('aria-label', 'Tampilkan sebagai Kartu');
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>';
    } else {
      btn.setAttribute('title', 'Tampilkan sebagai Tabel');
      btn.setAttribute('aria-label', 'Tampilkan sebagai Tabel');
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/></svg>';
    }
  }

  function kpToggleViewMode() {
    var btn = document.getElementById('kp-viewToggleBtn');
    if (btn) {
      btn.classList.remove('kp-btn-pop');
      void btn.offsetWidth;
      btn.classList.add('kp-btn-pop');
    }
    kpState.viewMode = (kpState.viewMode === 'table') ? 'cards' : 'table';
    try {
      localStorage.setItem('genio_kp_view_mode', kpState.viewMode);
    } catch (e) {}
    kpRenderList();
  }

  var KP_MOBILE_ORDER = ['.kp-dock-sec', '.kp-search-sec'];
  function kpApplyResponsiveLayout() {
    var anchor = document.getElementById('kp-desktopAnchor');
    if (!anchor) return;
    var isDesktop = window.matchMedia('(min-width:900px)').matches;
    var toolbarRow = document.getElementById('kp-toolbarRow');
    if (isDesktop) {
      if (!toolbarRow) {
        toolbarRow = document.createElement('div');
        toolbarRow.id = 'kp-toolbarRow';
        anchor.parentNode.insertBefore(toolbarRow, anchor.nextSibling);
      }
      var dockEl = document.querySelector('.kp-dock-sec');
      if (dockEl) toolbarRow.appendChild(dockEl);
      var searchEl = document.querySelector('.kp-search-sec');
      if (searchEl) toolbarRow.appendChild(searchEl);
    } else if (toolbarRow) {
      var cursor = anchor;
      KP_MOBILE_ORDER.forEach(function (sel) {
        var el = document.querySelector(sel);
        if (el) { cursor.parentNode.insertBefore(el, cursor.nextSibling); cursor = el; }
      });
      toolbarRow.remove();
    }
  }

  function kpSwitchTab(tab) {
    kpState.tab = tab;
    document.querySelectorAll('.kp-dock-btn').forEach(function (b) { b.classList.toggle('kp-dock-active', b.dataset.tab === tab); });
    kpUpdateDockGlider();
    kpRenderList();
  }
  function kpUpdateDockGlider() {
    var activeBtn = document.querySelector('.kp-dock-btn.kp-dock-active');
    var glider = document.getElementById('kp-dockGlider');
    if (!activeBtn || !glider) return;
    glider.style.left = activeBtn.offsetLeft + 'px';
    glider.style.width = activeBtn.offsetWidth + 'px';
  }
  function initKpTabScrubbing() {
    var dock = document.getElementById('kp-dock');
    var glider = document.getElementById('kp-dockGlider');
    if (!dock || !glider) return;
    var TABS = ['aktif', 'nonaktif'];
    var isPointerDown = false, isDragging = false, hasDragged = false, suppressClick = false;
    var startX = 0, startY = 0, pointerId = null;
    var cachedLeft = 0, cachedWidth = 0, cachedGliderWidth = 0, targetTab = kpState.tab;
    var DRAG_THRESHOLD = 8;

    dock.addEventListener('dragstart', function (e) { e.preventDefault(); });
    dock.addEventListener('click', function (e) { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
    dock.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      isPointerDown = true; isDragging = false; hasDragged = false; suppressClick = false;
      pointerId = e.pointerId; startX = e.clientX; startY = e.clientY;
      var rect = dock.getBoundingClientRect();
      cachedLeft = rect.left; cachedWidth = rect.width;
      cachedGliderWidth = glider.offsetWidth || (rect.width / TABS.length);
      targetTab = kpState.tab;
    });
    dock.addEventListener('pointermove', function (e) {
      if (!isPointerDown) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (!hasDragged && Math.abs(dx) > DRAG_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
        isDragging = true; hasDragged = true; suppressClick = true;
        try { dock.setPointerCapture(pointerId); } catch (_) {}
      }
      if (isDragging) {
        if (e.cancelable) e.preventDefault();
        var relX = e.clientX - cachedLeft;
        var clampedPx = Math.max(0, Math.min(cachedWidth - cachedGliderWidth, relX - cachedGliderWidth / 2));
        glider.style.transition = 'none';
        glider.style.left = clampedPx + 'px';
        var ratio = Math.max(0, Math.min(0.999, relX / cachedWidth));
        var newIdx = Math.min(TABS.length - 1, Math.max(0, Math.floor(ratio * TABS.length)));
        targetTab = TABS[newIdx];
        document.querySelectorAll('.kp-dock-btn').forEach(function (b) { b.classList.toggle('kp-dock-active', b.dataset.tab === targetTab); });
      }
    });
    function endScrub() {
      if (!isPointerDown) return;
      isPointerDown = false;
      glider.style.transition = '';
      if (pointerId !== null) { try { dock.releasePointerCapture(pointerId); } catch (_) {} pointerId = null; }
      if (hasDragged) { isDragging = false; kpSwitchTab(targetTab); setTimeout(function () { suppressClick = false; }, 80); }
      else suppressClick = false;
    }
    dock.addEventListener('pointerup', endScrub);
    dock.addEventListener('pointercancel', function () { endScrub(); });
    document.querySelectorAll('.kp-tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { if (!hasDragged) kpSwitchTab(btn.dataset.tab); });
    });
  }

  async function kpLoadAll() {
    var listEl = document.getElementById('kp-list');
    try {
      var s = genioGetSession();
      kpState.userList = await supaRest('users?role=neq.tutor&select=id,nama,email,role,status,unit_id,created_at,units(nama_unit)&order=nama.asc', s.access_token);

      var aktifCount = kpState.userList.filter(function (u) { return u.status === 'aktif'; }).length;
      document.getElementById('kp-heroTotal').textContent = kpState.userList.length;
      document.getElementById('kp-heroAktif').textContent = aktifCount + ' Akun';
      document.getElementById('kp-heroNonaktif').textContent = (kpState.userList.length - aktifCount) + ' Akun';
      document.getElementById('kp-aktifCount').textContent = aktifCount;
      document.getElementById('kp-nonaktifCount').textContent = kpState.userList.length - aktifCount;

      kpRenderList();
    } catch (err) {
      listEl.innerHTML = '<div class="empty-state">Gagal memuat data: ' + kpEscape(err.message) + '</div>';
    }
  }

  function kpFormatTgl(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function kpMatchesSearch(u) {
    if (!kpState.search) return true;
    var q = kpState.search;
    return (u.nama || '').toLowerCase().indexOf(q) !== -1 || (u.email || '').toLowerCase().indexOf(q) !== -1;
  }

  function kpGetSortIcon(field) {
    if (kpState.sortField === field) {
      if (kpState.sortDir === 'asc') {
        return '<svg viewBox="0 0 24 24" width="9" height="9" fill="currentColor" style="vertical-align:middle; margin-left:4px; display:inline-block; flex:none;"><path d="M12 7l-5.5 8h11z"/></svg>';
      } else {
        return '<svg viewBox="0 0 24 24" width="9" height="9" fill="currentColor" style="vertical-align:middle; margin-left:4px; display:inline-block; flex:none;"><path d="M12 17l5.5-8h-11z"/></svg>';
      }
    }
    return '<svg viewBox="0 0 24 24" width="9" height="9" fill="currentColor" style="vertical-align:middle; margin-left:4px; opacity:.2; display:inline-block; flex:none;"><path d="M12 7l-5.5 8h11z"/></svg>';
  }

  function kpSortRows(rows) {
    var field = kpState.sortField || 'nama';
    var dir = kpState.sortDir || 'asc';
    var sorted = rows.slice();
    sorted.sort(function (a, b) {
      var valA = '';
      var valB = '';
      if (field === 'nama') {
        valA = (a.nama || '').toLowerCase();
        valB = (b.nama || '').toLowerCase();
      } else if (field === 'email') {
        valA = (a.email || '').toLowerCase();
        valB = (b.email || '').toLowerCase();
      } else if (field === 'role') {
        var rA = KP_ROLE_META[a.role] ? KP_ROLE_META[a.role].label : (a.role || '');
        var rB = KP_ROLE_META[b.role] ? KP_ROLE_META[b.role].label : (b.role || '');
        valA = rA.toLowerCase();
        valB = rB.toLowerCase();
      } else if (field === 'unit') {
        valA = (a.units && a.units.nama_unit || '').toLowerCase();
        valB = (b.units && b.units.nama_unit || '').toLowerCase();
      } else if (field === 'created_at') {
        valA = a.created_at || '';
        valB = b.created_at || '';
      } else if (field === 'status') {
        valA = (a.status || '').toLowerCase();
        valB = (b.status || '').toLowerCase();
      }
      if (valA < valB) return dir === 'asc' ? -1 : 1;
      if (valA > valB) return dir === 'asc' ? 1 : -1;
      return 0;
    });
    return sorted;
  }

  function kpHandleSort(field) {
    if (kpState.sortField === field) {
      kpState.sortDir = (kpState.sortDir === 'asc') ? 'desc' : 'asc';
    } else {
      kpState.sortField = field;
      kpState.sortDir = (field === 'created_at') ? 'desc' : 'asc';
    }
    kpRenderList();
  }

  function kpRenderList() {
    var listEl = document.getElementById('kp-list');
    var rows = kpState.userList.filter(function (u) { return u.status === kpState.tab; }).filter(kpMatchesSearch);
    rows = kpSortRows(rows);

    document.getElementById('kp-sectionLabel').textContent = kpState.tab === 'aktif' ? 'Akun Aktif' : 'Akun Nonaktif';
    document.getElementById('kp-resultCount').textContent = rows.length + ' Akun';
    kpUpdateViewToggleUI();

    if (!rows.length) {
      listEl.classList.remove('kp-view-table');
      listEl.innerHTML = '<div class="kp-card kp-full-width empty-state">Tidak ada akun yang cocok.</div>';
      return;
    }

    if (kpState.viewMode === 'table') {
      listEl.classList.add('kp-view-table');
      listEl.innerHTML = kpRenderTable(rows);
    } else {
      listEl.classList.remove('kp-view-table');
      listEl.innerHTML = rows.map(kpRenderCard).join('');
    }
    kpBindCardEvents();
  }

  function kpRenderTable(rows) {
    var trs = rows.map(function (u, idx) {
      var isAktif = u.status === 'aktif';
      var roleMeta = KP_ROLE_META[u.role] || { label: u.role || '-' };
      var roleText = roleMeta.label || u.role || '-';
      var unitText = (u.units && u.units.nama_unit) ? kpEscape(u.units.nama_unit) : '-';
      var dotColor = isAktif ? '#34c759' : '#8e8e93';
      var statusLabel = isAktif ? 'Aktif' : 'Nonaktif';

      var statusBadge = '<span class="kp-table-status-pill">' +
        '<span class="kp-status-dot" style="background:' + dotColor + ';"></span>' +
        '<span class="kp-status-label">' + statusLabel + '</span>' +
      '</span>';

      return '' +
        '<tr>' +
          '<td style="text-align:center; width:34px; color:var(--ink-soft); font-size:10.5px; font-weight:400;">' + (idx + 1) + '</td>' +
          '<td style="white-space:nowrap; color:var(--ink); font-size:11.5px; font-weight:500;">' + kpEscape(u.nama) + '</td>' +
          '<td style="white-space:nowrap; color:var(--ink); font-size:11.5px; font-weight:400;">' + kpEscape(u.email || '-') + '</td>' +
          '<td style="white-space:nowrap; color:var(--ink); font-size:11.5px; font-weight:400;">' + kpEscape(roleText) + '</td>' +
          '<td style="white-space:nowrap; color:var(--ink); font-size:11.5px; font-weight:400;">' + unitText + '</td>' +
          '<td style="white-space:nowrap; color:var(--ink); font-size:11.5px; font-weight:400;">' + kpFormatTgl(u.created_at) + '</td>' +
          '<td style="text-align:center; white-space:nowrap;">' + statusBadge + '</td>' +
          '<td style="text-align:center; white-space:nowrap; width:65px;">' +
            '<div style="display:inline-flex; align-items:center; gap:4px;">' +
              '<button type="button" class="kp-table-edit-btn kp-table-icon-btn kp-edit-btn" data-id="' + u.id + '" title="Edit Pengguna" aria-label="Edit">' +
                '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
              '</button>' +
              '<button type="button" class="kp-table-delete-btn kp-table-icon-btn kp-delete-btn" data-id="' + u.id + '" data-nama="' + kpEscape(u.nama) + '" title="Hapus Pengguna" aria-label="Hapus">' +
                '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
              '</button>' +
            '</div>' +
          '</td>' +
        '</tr>';
    }).join('');

    return '' +
      '<div class="kp-table-card kp-full-width">' +
        '<div class="kp-table-wrap">' +
          '<table class="kp-table">' +
            '<thead>' +
              '<tr>' +
                '<th style="width:38px; text-align:center;">No</th>' +
                '<th class="kp-sort-th" data-sort="nama" title="Urutkan Nama (A - Z)">' +
                  '<span style="display:inline-flex; align-items:center;">Nama Pengguna' + kpGetSortIcon('nama') + '</span>' +
                '</th>' +
                '<th class="kp-sort-th" data-sort="email" title="Urutkan Email">' +
                  '<span style="display:inline-flex; align-items:center;">Email' + kpGetSortIcon('email') + '</span>' +
                '</th>' +
                '<th class="kp-sort-th" data-sort="role" title="Urutkan Role">' +
                  '<span style="display:inline-flex; align-items:center;">Role' + kpGetSortIcon('role') + '</span>' +
                '</th>' +
                '<th class="kp-sort-th" data-sort="unit" title="Urutkan Unit">' +
                  '<span style="display:inline-flex; align-items:center;">Unit / Cabang' + kpGetSortIcon('unit') + '</span>' +
                '</th>' +
                '<th class="kp-sort-th" data-sort="created_at" title="Urutkan Tanggal Bergabung">' +
                  '<span style="display:inline-flex; align-items:center;">Bergabung' + kpGetSortIcon('created_at') + '</span>' +
                '</th>' +
                '<th class="kp-sort-th" data-sort="status" title="Urutkan Status" style="text-align:center;">' +
                  '<span style="display:inline-flex; align-items:center; justify-content:center; width:100%;">Status' + kpGetSortIcon('status') + '</span>' +
                '</th>' +
                '<th style="text-align:center; width:68px;">Aksi</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody>' +
              trs +
            '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>';
  }

  function kpRenderCard(u) {
    var initials = (u.nama || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
    var isAktif = u.status === 'aktif';
    var statusBadge = isAktif
      ? '<span style="display:inline-flex; align-items:center; gap:4px; background:rgba(52,199,89,.14); color:#28a745; font-size:9.5px; font-weight:600; padding:0 8px; height:22px; border-radius:999px; box-sizing:border-box; flex:none;"><span style="width:12px; height:12px; border-radius:50%; background:#34c759; display:flex; align-items:center; justify-content:center; flex:none;"><svg viewBox="0 0 24 24" width="7" height="7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>Aktif</span>'
      : '<span style="display:inline-flex; align-items:center; gap:4px; background:rgba(142,142,147,.16); color:#8e8e93; font-size:9.5px; font-weight:600; padding:0 8px; height:22px; border-radius:999px; box-sizing:border-box; flex:none;"><span style="width:12px; height:12px; border-radius:50%; background:#8e8e93; display:flex; align-items:center; justify-content:center; flex:none;"><svg viewBox="0 0 24 24" width="7" height="7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>Nonaktif</span>';

    var roleMeta = KP_ROLE_META[u.role] || { label: u.role, color: 'var(--ink-soft)' };

    return '' +
      '<div class="card kp-card" style="padding:12px 14px; margin-bottom:10px; border-radius:12px;">' +
        '<div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">' +
          '<div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1;">' +
            '<div style="width:32px; height:32px; border-radius:50%; background:var(--blue-tint); color:var(--blue); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:12px; flex:none;">' + kpEscape(initials) + '</div>' +
            '<div style="min-width:0;">' +
              '<h4 style="font-size:12.5px; font-weight:600; color:#1c1c1e; margin:0; line-height:1.3;">' + kpEscape(u.nama) + '</h4>' +
              '<p style="font-size:10.5px; font-weight:600; margin:1px 0 0; color:' + roleMeta.color + ';">' + kpEscape(roleMeta.label) + '</p>' +
              '<p style="font-size:10px; color:#8e8e93; font-weight:500; margin:1px 0 0;">' + kpEscape(u.email) + (u.units ? ' &bull; ' + kpEscape(u.units.nama_unit) : '') + '</p>' +
            '</div>' +
          '</div>' +
          statusBadge +
        '</div>' +
        '<div style="display:flex; gap:8px; margin-top:10px;">' +
          '<button class="kp-edit-btn" data-id="' + u.id + '" style="flex:1; height:30px; background:var(--blue); color:#fff; border:none; border-radius:7px; padding:0 10px; font-size:11px; font-weight:500; cursor:pointer; font-family:var(--font); display:inline-flex; align-items:center; justify-content:center;">Edit</button>' +
          '<button class="kp-delete-btn" data-id="' + u.id + '" data-nama="' + kpEscape(u.nama) + '" style="flex:1; height:30px; background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:7px; padding:0 10px; font-size:11px; font-weight:500; cursor:pointer; font-family:var(--font); display:inline-flex; align-items:center; justify-content:center;">Hapus</button>' +
        '</div>' +
      '</div>';
  }

  function kpBindCardEvents() {
    document.querySelectorAll('.kp-edit-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { kpOpenModal(btn.dataset.id); });
    });
    document.querySelectorAll('.kp-delete-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.getElementById('kp-confirmDesc').textContent = btn.dataset.nama + ' akan dihapus permanen dari sistem.';
        kpOpenConfirm(function () { kpDelete(btn.dataset.id); });
      });
    });
    document.querySelectorAll('.kp-sort-th').forEach(function (th) {
      th.addEventListener('click', function () {
        kpHandleSort(th.dataset.sort);
      });
    });
  }

  async function kpDelete(id) {
    try {
      var s = genioGetSession();
      await supaRest('users?id=eq.' + id, s.access_token, { method: 'DELETE', headers: { 'Prefer': 'return=minimal' } });
      genioToast('Akun berhasil dihapus', 'success');
      kpLoadAll();
    } catch (err) { genioToast('Gagal menghapus: ' + err.message, 'error'); }
  }

  /* ===== Modal Edit ===== */
  var kpModal = document.getElementById('kp-modal');
  function kpSetOpt(groupId, val) {
    document.querySelectorAll('#' + groupId + ' .kp-opt').forEach(function (o) {
      var active = o.dataset.val === val;
      o.style.background = active ? 'var(--blue-tint)' : '#fff';
      o.style.color = active ? 'var(--blue)' : 'var(--ink-soft)';
      o.style.borderColor = active ? 'var(--blue)' : 'var(--border)';
      o.querySelector('input').checked = active;
    });
  }

  async function kpOpenModal(id) {
    var u = kpState.userList.find(function (x) { return x.id === id; });
    if (!u) return;
    document.getElementById('kp-modalAlert').hidden = true;
    document.getElementById('kp-modalTitle').textContent = 'Edit Pengguna';
    document.getElementById('kp-editId').value = id;
    document.getElementById('kp-nama').value = u.nama || '';
    document.getElementById('kp-email').value = u.email || '';
    kpSetOpt('kp-roleOpts', u.role);
    kpSetOpt('kp-statusOpts', u.status);
    kpUpdateUnitFieldVisibility(u.role);

    if (!kpState.unitOptions.length) {
      try {
        var s = genioGetSession();
        kpState.unitOptions = await supaRest('units?select=id,nama_unit&order=nama_unit.asc', s.access_token);
      } catch (e) {}
    }
    var unitSelect = document.getElementById('kp-unitSelect');
    unitSelect.innerHTML = '<option value="">Pilih unit...</option>' + kpState.unitOptions.map(function (un) {
      return '<option value="' + un.id + '">' + kpEscape(un.nama_unit) + '</option>';
    }).join('');
    unitSelect.value = u.unit_id || '';

    kpModal.hidden = false;
    requestAnimationFrame(function () { kpModal.classList.add('show'); });
  }
  function kpCloseModal() {
    kpModal.classList.remove('show');
    setTimeout(function () { kpModal.hidden = true; }, 280);
  }

  async function kpSubmitEdit() {
    var alertEl = document.getElementById('kp-modalAlert');
    var id = document.getElementById('kp-editId').value;
    var nama = document.getElementById('kp-nama').value.trim();
    var email = document.getElementById('kp-email').value.trim();
    var roleEl = document.querySelector('input[name="kp-role"]:checked');
    var statusEl = document.querySelector('input[name="kp-status"]:checked');
    var role = roleEl ? roleEl.value : '';
    var unitId = document.getElementById('kp-unitSelect').value;

    if (!nama || !email) { alertEl.textContent = 'Nama dan email wajib diisi.'; alertEl.hidden = false; return; }
    if (!role) { alertEl.textContent = 'Role wajib dipilih.'; alertEl.hidden = false; return; }
    if (role === 'kepala_unit' && !unitId) { alertEl.textContent = 'Kepala Unit wajib pilih unit.'; alertEl.hidden = false; return; }
    alertEl.hidden = true;

    var btn = document.getElementById('kp-saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Menyimpan...';
    try {
      var s = genioGetSession();
      await supaRest('users?id=eq.' + id, s.access_token, {
        method: 'PATCH', headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({
          nama: nama, email: email, role: role,
          unit_id: role === 'kepala_unit' ? unitId : null,
          status: statusEl ? statusEl.value : 'aktif'
        })
      });
      genioToast('Data pengguna berhasil diperbarui', 'success');
      kpCloseModal();
      kpLoadAll();
    } catch (err) {
      alertEl.textContent = err.message || 'Gagal menyimpan data.'; alertEl.hidden = false;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Simpan';
    }
  }

  /* ===== Modal Konfirmasi ===== */
  var kpConfirmModal = document.getElementById('kp-confirmModal');
  var kpConfirmCallback = null;
  function kpOpenConfirm(callback) {
    kpConfirmCallback = callback;
    kpConfirmModal.hidden = false;
    requestAnimationFrame(function () { kpConfirmModal.classList.add('show'); });
  }
  function kpCloseConfirm() {
    kpConfirmModal.classList.remove('show');
    setTimeout(function () { kpConfirmModal.hidden = true; }, 280);
  }
</script>

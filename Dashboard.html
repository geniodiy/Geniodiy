  <script>
    var session = genioRequireSession();
    if (session) { initDashboard(session); }

    function initDashboard(session) {

    // ===== Role: menu & tab dock menyesuaikan role (lihat docs/PRD.md Section 6) =====
    var GENIO_ROLE = session.role;
    var IS_KU = GENIO_ROLE === 'kepala_unit';
    var IS_HRD = GENIO_ROLE === 'hrd';
    var IS_TUTOR = GENIO_ROLE === 'tutor';
    window.GENIO_ROLE = GENIO_ROLE;
    document.body.classList.add('role-' + GENIO_ROLE); // dipakai CSS untuk menyembunyikan tombol per role (lihat Config.html)
    if (typeof genioEnsureSessionProfile === 'function') genioEnsureSessionProfile();
    // Menu Lainnya yang boleh dilihat per role (role yang tidak tercantum melihat semua menu)
    var ROLE_MENU = {
      kepala_unit: ['ortu-siswa', 'kontrak', 'tagihan', 'data-tutor', 'operasional', 'genio-news'],
      hrd: ['ortu-siswa', 'kontrak', 'presensi', 'genio-news'],
      tutor: []
    };
    function genioRetab(btnId, newTab, label, icon) {
      var b = document.getElementById(btnId);
      if (!b) return;
      b.id = 'nav-' + newTab;
      b.dataset.tab = newTab;
      b.setAttribute('aria-label', label);
      b.querySelector('.dock-icon').innerHTML = '<i class="ph ph-' + icon + ' icon-outline" aria-hidden="true"></i><i class="ph-fill ph-' + icon + ' icon-filled hidden" aria-hidden="true"></i>';
      b.querySelector('.dock-label').textContent = label;
    }
    if (IS_HRD) {
      // HRD: dock Home, Tutor, Jadwal, Lainnya (Presensi hanya lihat, ada di Lainnya)
      genioRetab('nav-presensi', 'data-tutor', 'Tutor', 'chalkboard-teacher');
      genioRetab('nav-gaji', 'jadwal', 'Jadwal', 'calendar-blank');
    }
    if (IS_TUTOR) {
      // Tutor: dock Beranda, Presensi, Gaji, Profil (tanpa menu Lainnya)
      genioRetab('nav-home', 'home', 'Beranda', 'house');
      genioRetab('nav-lainnya', 'profil', 'Profil', 'user-circle');
      // Tombol + isi presensi: bulat di cekungan tengah bottom bar (HP) dan pill melayang di kanan bawah (desktop).
      // Sekali tekan membuka pemilih sesi. Selama form presensi terbuka tombol tetap tampil sebagai x dan menutup form bila ditekan.
      (function () {
        var dockEl = document.getElementById('interactiveDock'), wrapEl = document.querySelector('.dock-wrap'), gajiBtn = document.getElementById('nav-gaji');
        if (!dockEl || !wrapEl || !gajiBtn) return;
        var PLUS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
        var gap = document.createElement('div'); gap.className = 'dock-fab-gap'; gap.setAttribute('aria-hidden', 'true');
        dockEl.insertBefore(gap, gajiBtn);
        wrapEl.classList.add('has-fab');
        var fm = document.createElement('button'); fm.type = 'button'; fm.id = 'genioFabM'; fm.className = 'genio-fab-m genio-fab-btn';
        fm.setAttribute('aria-label', 'Isi presensi'); fm.innerHTML = PLUS; wrapEl.appendChild(fm);
        var fd = document.createElement('div'); fd.id = 'genioFabD'; fd.setAttribute('role', 'button'); fd.tabIndex = 0; fd.setAttribute('aria-label', 'Isi presensi');
        fd.innerHTML = '<span class="genio-fab-btn">' + PLUS + '</span><span class="genio-fab-lbl">Isi presensi</span>';
        document.body.appendChild(fd);
        var fdBtn = fd.querySelector('.genio-fab-btn'), fdLbl = fd.querySelector('.genio-fab-lbl');

        // Popup presensi tutor yang ikut tombol + (id popup: tombol tutupnya)
        var PT = { 'pt-formModal': 'pt-fClose', 'pt-lapModal': 'pt-lapClose' };
        function ptOpenEl() {
          for (var id in PT) { var el = document.getElementById(id); if (el && !el.hidden && el.classList.contains('show')) return el; }
          return null;
        }
        function otherOpen() {
          return Array.prototype.some.call(document.querySelectorAll('.modal-overlay.show'), function (el) { return !PT[el.id]; });
        }
        function closeAll() {
          if (window.genioPresensiTutor && window.genioPresensiTutor.close) { window.genioPresensiTutor.close(); return; }
          for (var id in PT) {
            var el = document.getElementById(id);
            if (el && !el.hidden) { var c = document.getElementById(PT[id]); if (c) c.click(); }
          }
        }
        function sync() {
          var on = !!ptOpenEl() && !otherOpen();
          document.body.classList.toggle('fab-over', on);
          fm.classList.toggle('is-open', on); fdBtn.classList.toggle('is-open', on);
          fm.setAttribute('aria-label', on ? 'Tutup' : 'Isi presensi'); fd.setAttribute('aria-label', on ? 'Tutup' : 'Isi presensi');
          fdLbl.textContent = on ? 'Tutup' : 'Isi presensi';
        }
        // Titik asal animasi: pusat tombol + relatif terhadap kotak form, supaya form tumbuh dari tombol dan mengecil kembali ke sana
        function setOrigin(el) {
          var sheet = el.querySelector('.modal-sheet'); if (!sheet) return;
          var b = (fm.offsetParent ? fm : fdBtn).getBoundingClientRect();
          if (!b.width) return;
          var ox = b.left + b.width / 2 - sheet.offsetLeft, oy = b.top + b.height / 2 - sheet.offsetTop;
          sheet.style.setProperty('--fab-ox', ox.toFixed(0) + 'px'); sheet.style.setProperty('--fab-oy', oy.toFixed(0) + 'px');
        }
        var mo = new MutationObserver(function (list) {
          list.forEach(function (m) {
            var el = m.target;
            if (m.attributeName === 'hidden' && PT[el.id] && !el.hidden) setOrigin(el);
          });
          sync();
        });
        function watch() {
          var all = document.querySelectorAll('.modal-overlay');
          Array.prototype.forEach.call(all, function (el) {
            if (el.__fabWatch) return; el.__fabWatch = true;
            mo.observe(el, { attributes: true, attributeFilter: ['class', 'hidden'] });
          });
        }
        watch();
        // Popup modul dimuat belakangan: daftarkan popup baru yang masuk ke body
        new MutationObserver(watch).observe(document.body, { childList: true });

        function press() {
          if (ptOpenEl()) { closeAll(); return; }
          if (window.genioPresensiTutor) window.genioPresensiTutor.open({ action: 'pick' });
        }
        fm.addEventListener('click', press);
        fd.addEventListener('click', press);
        fd.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press(); } });
        // Pindah tab saat form terbuka: tutup form dulu
        dockEl.addEventListener('click', function (e) { if (document.body.classList.contains('fab-over') && e.target.closest && e.target.closest('.dock-btn')) closeAll(); }, true);
      })();
    }

    // ===== Menu tambah cepat (kepala unit dan manajer): tombol + di bottom bar (HP) atau pill kanan bawah (desktop) =====
    (function () {
      var IS_MGR = !IS_TUTOR && !IS_HRD && !IS_KU;
      if (!IS_KU && !IS_HRD) return; // manajer dan super admin tidak memakai tombol + (hanya tutor, kepala unit, HRD)
      var dockEl = document.getElementById('interactiveDock'), wrapEl = document.querySelector('.dock-wrap');
      if (!dockEl || !wrapEl) return;
      // key, ikon (peta ikon tunggal), label, modul tujuan, tombol tambah di modul itu
      var ALL = {
        presensi: ['check-circle', 'Presensi', 'presensi', 'ps-openWakilBtn'],
        siswa: ['student', 'Siswa', 'ortu-siswa', 'os-addBtn'],
        operasional: ['receipt', 'Operasional', 'operasional', 'ops-addBtn'],
        kontrak: ['file-text', 'Kontrak', 'kontrak', 'ktr-addBtn'],
        jadwal: ['calendar-blank', 'Jadwal', 'jadwal', 'jdw-addBtn'],
        tutor: ['chalkboard-teacher', 'Tutor', 'data-tutor', 'dt-pendaftaranToggle'],
        paket: ['books', 'Paket', 'paket-belajar', 'pkt-addBtn']
      };
      // Kepala unit: menu 5 pilihan. HRD: menu 4 pilihan. Manajer dan super admin: langsung isi presensi (seperti tutor), tanpa menu.
      var DIRECT = false;
      var KEYS = IS_KU ? ['presensi', 'siswa', 'operasional', 'kontrak', 'jadwal'] : IS_HRD ? ['tutor', 'siswa', 'kontrak', 'jadwal'] : ['presensi'];
      var PLUS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
      var open = false;

      var btns = dockEl.querySelectorAll('.dock-btn');
      var gap = document.createElement('div'); gap.className = 'dock-fab-gap'; gap.setAttribute('aria-hidden', 'true');
      dockEl.insertBefore(gap, btns[2] || null);

    // ===== Drag / scrub geser bar (meniru fisik dock iOS asli) =====
    function initDockScrubbing() {
      var dock = document.getElementById('interactiveDock');
      var glider = document.getElementById('dockGlider');
      if (!dock || !glider) return;

      var startX = 0, startY = 0, isPointerDown = false, isDragging = false, hasDragged = false;
      var suppressClick = false, targetTab = 'home', pointerId = null;
      var cachedDockLeft = 0, cachedDockWidth = 0, cachedGliderWidth = 0, prevActiveIndex = -1;
      var rafId = null, lastClientX = 0;
      var DRAG_THRESHOLD = 8;

      dock.addEventListener('dragstart', function (e) { e.preventDefault(); });
      dock.addEventListener('click', function (e) {
        if (suppressClick) { e.stopPropagation(); e.preventDefault(); }
      }, true);

      function updateGliderScrub() {
        rafId = null;
        if (!isDragging || cachedDockWidth <= 0) return;
        var relX = lastClientX - cachedDockLeft;
        var centerOffset = relX - (cachedGliderWidth / 2);
        var minLeft = 4;
        var maxLeft = cachedDockWidth - cachedGliderWidth - 4;
        var clampedPx = Math.max(minLeft, Math.min(maxLeft, centerOffset));
        glider.style.transition = 'none';
        glider.style.left = clampedPx + 'px';

        // Tentukan tab terdekat berdasarkan posisi tombol SEBENARNYA (bukan asumsi 4 kolom
        // sama lebar) — penting karena tombol aktif melebar (flex:1.7), jadi lebarnya nggak rata.
        var closestIdx = 0, closestDist = Infinity;
        PRIMARY_TABS.forEach(function (t, idx) {
          var btn = document.getElementById('nav-' + t);
          if (!btn) return;
          var rect = btn.getBoundingClientRect();
          var btnCenter = rect.left + rect.width / 2;
          var dist = Math.abs(lastClientX - btnCenter);
          if (dist < closestDist) { closestDist = dist; closestIdx = idx; }
        });
        if (closestIdx !== prevActiveIndex) {
          prevActiveIndex = closestIdx;
          targetTab = PRIMARY_TABS[closestIdx];
          setDockTabVisual(targetTab, { scaleDuringDrag: true });
        }
      }

      dock.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        isPointerDown = true; isDragging = false; hasDragged = false; suppressClick = false;
        pointerId = e.pointerId; startX = e.clientX; startY = e.clientY; lastClientX = e.clientX;
        var rect = dock.getBoundingClientRect();
        cachedDockLeft = rect.left; cachedDockWidth = rect.width;
        cachedGliderWidth = glider.offsetWidth || (rect.width * 0.23);
        targetTab = currentBottomTab;
        prevActiveIndex = PRIMARY_TABS.indexOf(targetTab);
        triggerHeaderPress();
        triggerDockPress();
      });

      dock.addEventListener('pointermove', function (e) {
        if (!isPointerDown) return;
        lastClientX = e.clientX;
        var dx = e.clientX - startX, dy = e.clientY - startY;
        if (!hasDragged) {
          if (Math.abs(dx) > DRAG_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
            isDragging = true; hasDragged = true; suppressClick = true;
            try { dock.setPointerCapture(pointerId); } catch (_) {}
          }
        }
        if (isDragging) {
          if (e.cancelable) e.preventDefault();
          if (!rafId) rafId = requestAnimationFrame(updateGliderScrub);
        }
      });

      function endDockScrub() {
        if (!isPointerDown) return;
        isPointerDown = false;
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        dock.classList.remove('dock-pressed');
        releaseHeaderPress();
        triggerHeaderPop();
        releaseDockPress();
        triggerDockPop();
        glider.style.transition = '';
        if (pointerId !== null) { try { dock.releasePointerCapture(pointerId); } catch (_) {} pointerId = null; }
        PRIMARY_TABS.forEach(function (t) {
          var btn = document.getElementById('nav-' + t);
          if (btn) btn.style.transform = '';
        });
        if (hasDragged) {
          isDragging = false;
          showModule(targetTab);
          setTimeout(function () { suppressClick = false; }, 80);
        } else {
          suppressClick = false;
        }
      }

      dock.addEventListener('pointerup', endDockScrub);
      dock.addEventListener('pointercancel', endDockScrub);
    }
    initDockScrubbing();

    function genioInitNotifikasi() {
      var bellBtn = document.getElementById('genioHeaderBellBtn');
      var panel = document.getElementById('genioNotifPanel');
      var clearBtn = document.getElementById('genioNotifClearBtn');
      if (!bellBtn || !panel) { console.error('Elemen notifikasi tidak ditemukan.'); return; }

      var genioNotifItems = [];

      // Bersihkan seluruh sisa cache lama di localStorage & sessionStorage
      // agar pengguna TIDAK PERLU lagi menghapus history atau cache browser.
      try {
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var lk = localStorage.key(i);
          if (lk && (lk.indexOf('genio_read_notifs') !== -1 || lk.indexOf('genio_session_hidden') !== -1)) {
            localStorage.removeItem(lk);
          }
        }
        for (var j = sessionStorage.length - 1; j >= 0; j--) {
          var sk = sessionStorage.key(j);
          if (sk && (sk.indexOf('genio_session_hidden') !== -1 || sk.indexOf('genio_read_notifs') !== -1)) {
            sessionStorage.removeItem(sk);
          }
        }
      } catch (e) {}

      // State hidden notifikasi in-memory (hanya berlaku selama halaman ini aktif):
      // Saat refresh, buka tab baru, atau login lagi, semua notifikasi otomatis muncul kembali!
      var genioSessionHiddenIds = [];

      function genioGetReadIds() {
        return genioSessionHiddenIds;
      }
      function genioSaveReadIds(ids) {
        genioSessionHiddenIds = ids;
      }
      function genioMarkNotifRead(id) {
        if (genioSessionHiddenIds.indexOf(id) === -1) { genioSessionHiddenIds.push(id); }
        var item = genioNotifItems.find(function (n) { return n.id === id; });
        if (item) item.read = true;
      }

      async function genioLoadNotifications() {
        try {
          var s = genioGetSession();
          if (!s || !s.access_token) return;

          var range14 = new Date(); range14.setDate(range14.getDate() - 14);
          var startDate = range14.toISOString().slice(0, 10);

          var pendingPresensi = [];
          var latePresensi = [];
          var pendingTutor = [];

          if (IS_TUTOR) {
            // Tutor: cukup laporan yang ditolak dan perlu direvisi
            var revItems = [];
            try {
              var revRes = await supaRest('presensi?status=eq.ditolak&select=id,tanggal,kontrak_tutor(mapel,kontrak_siswa(siswa(nama)))&order=tanggal.desc&limit=30', s.access_token);
              (revRes || []).forEach(function (r) {
                var sw = (r.kontrak_tutor && r.kontrak_tutor.kontrak_siswa && r.kontrak_tutor.kontrak_siswa.siswa && r.kontrak_tutor.kontrak_siswa.siswa.nama) || 'siswa';
                revItems.push({
                  id: 'revisi-' + r.id, type: 'presensi-revisi',
                  title: 'Laporan ' + sw + ' ditolak, perlu revisi', tanggal: r.tanggal,
                  icon: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>', iconBg: 'rgba(212,7,15,.1)', iconColor: '#D4070F'
                });
              });
            } catch (errRev) { console.warn('Info notif revisi:', errRev.message); }
            var readIdsT = genioGetReadIds();
            genioNotifItems = revItems.map(function (it) { it.read = readIdsT.indexOf(it.id) !== -1; return it; });
            genioRenderNotifBadge();
            if (panel.style.display === 'block') genioRenderNotifList();
            return;
          }

          // 1. Ambil Presensi yang Menunggu Approval (status = pending)
          try {
            var presPendingRes = await supaRest('presensi?status=eq.pending&select=id,tanggal,status,terlambat,kontrak_tutor(users!kontrak_tutor_tutor_id_fkey(nama))&order=tanggal.desc&limit=40', s.access_token);
            if (Array.isArray(presPendingRes)) pendingPresensi = presPendingRes;
          } catch (errPres) {
            console.warn('Info notif presensi pending:', errPres.message);
          }

          // 2. Ambil Presensi Terlambat (14 hari terakhir)
          try {
            var presLateRes = await supaRest('presensi?terlambat=eq.true&tanggal=gte.' + startDate + '&select=id,tanggal,status,terlambat,kontrak_tutor(users!kontrak_tutor_tutor_id_fkey(nama))&order=tanggal.desc&limit=30', s.access_token);
            if (Array.isArray(presLateRes)) latePresensi = presLateRes;
          } catch (errLate) {
            console.warn('Info notif presensi terlambat:', errLate.message);
          }

          // 3. Ambil Pendaftaran Tutor Menunggu Approval
          if (!IS_KU) try {
            var tutorRes = await supaRest('users?role=eq.tutor&status=eq.pending_approval&select=id,nama,created_at&order=created_at.desc&limit=30', s.access_token);
            if (Array.isArray(tutorRes)) pendingTutor = tutorRes;
          } catch (errTutor) {
            console.warn('Info notif tutor approval:', errTutor.message);
          }

          var readIds = genioGetReadIds();
          var items = [];
          var seenPresensiIds = {};

          pendingPresensi.forEach(function (r) {
            seenPresensiIds[r.id] = true;
            var tutorNama = (r.kontrak_tutor && r.kontrak_tutor.users && r.kontrak_tutor.users.nama) || 'Tutor';
            items.push({
              id: 'approval-' + r.id, type: 'presensi-approval',
              title: tutorNama + ' melapor presensi, menunggu approval', tanggal: r.tanggal,
              icon: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>', iconBg: 'rgba(255,149,0,.14)', iconColor: '#ff9500'
            });
          });

          latePresensi.forEach(function (r) {
            if (seenPresensiIds[r.id]) return;
            var tutorNama = (r.kontrak_tutor && r.kontrak_tutor.users && r.kontrak_tutor.users.nama) || 'Tutor';
            items.push({
              id: 'telat-' + r.id, type: 'presensi-telat',
              title: 'Presensi ' + tutorNama + ' terlambat dilaporkan', tanggal: r.tanggal,
              icon: '<circle cx="12" cy="12" r="9"/><path d="M8 15s1.5-2 4-2 4 2 4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>', iconBg: 'rgba(255,59,48,.12)', iconColor: '#ff3b30'
            });
          });

          pendingTutor.forEach(function (u) {
            items.push({
              id: 'tutor-' + u.id, type: 'tutor-approval',
              title: u.nama + ' mendaftar sebagai tutor, menunggu approval', tanggal: (u.created_at || '').slice(0, 10),
              icon: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>', iconBg: 'rgba(20,22,43,.08)', iconColor: 'var(--ink)'
            });
          });

          genioNotifItems = items.map(function (it) {
            it.read = readIds.indexOf(it.id) !== -1;
            return it;
          }).sort(function (a, b) { return (b.tanggal || '').localeCompare(a.tanggal || ''); });

          genioRenderNotifBadge();
          if (panel.style.display === 'block') genioRenderNotifList();
        } catch (err) { console.error('Gagal memuat notifikasi:', err); }
      }

      function genioRenderNotifBadge() {
        var unreadCount = genioNotifItems.filter(function (n) { return !n.read; }).length;
        var badge = document.getElementById('homeBellBadge');
        if (!badge) return;
        if (unreadCount > 0) { badge.textContent = unreadCount > 99 ? '99+' : unreadCount; badge.hidden = false; }
        else badge.hidden = true;
      }

      function genioFormatNotifDate(tanggal) {
        if (!tanggal) return '';
        var d = new Date(tanggal + 'T00:00:00');
        return isNaN(d.getTime()) ? tanggal : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
      }

      function genioRenderNotifList() {
        var listEl = document.getElementById('genioNotifList');
        if (!listEl) return;
        var footerEl = document.getElementById('genioNotifFooter');
        var unread = genioNotifItems.filter(function (n) { return !n.read; });

        if (footerEl) {
          footerEl.style.display = unread.length ? 'flex' : 'none';
        }

        if (!unread.length) {
          listEl.innerHTML = '<div class="empty-state" style="padding:22px 10px; text-align:center; color:var(--ink-soft); font-size:12px;">Tidak ada notifikasi.</div>';
          return;
        }

        listEl.innerHTML = unread.map(function (n) {
          return '<div class="genio-notif-item" data-notif-id="' + n.id + '" data-notif-type="' + n.type + '" style="display:flex; align-items:flex-start; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border); cursor:pointer; touch-action:pan-y; transition:transform .25s ease, opacity .25s ease, max-height .25s ease, padding .25s ease; max-height:80px;">' +
            '<span style="width:30px; height:30px; border-radius:10px; background:' + n.iconBg + '; color:' + n.iconColor + '; display:flex; align-items:center; justify-content:center; flex:none;">' +
              '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">' + n.icon + '</svg>' +
            '</span>' +
            '<div style="min-width:0; flex:1;">' +
              '<div style="font-size:11.5px; font-weight:500; color:var(--ink); line-height:1.4;">' + genioEscapeHtml(n.title) + '</div>' +
              '<div style="font-size:10px; color:var(--ink-soft); margin-top:2px;">' + genioFormatNotifDate(n.tanggal) + '</div>' +
            '</div>' +
            '<span style="width:7px; height:7px; border-radius:50%; background:var(--ink); flex:none; margin-top:5px;"></span>' +
          '</div>';
        }).join('');

        listEl.querySelectorAll('.genio-notif-item').forEach(function (el) {
          var startX = 0, startY = 0, dx = 0, isDragging = false, hasDragged = false, pointerId = null;
          var DRAG_THRESHOLD = 8, DISMISS_THRESHOLD = 70;

          function dismiss() {
            el.style.transition = 'transform .15s ease, opacity .15s ease, max-height .15s ease, padding .15s ease, margin .15s ease';
            el.style.transform = 'translateX(' + (dx < 0 ? '-100%' : '100%') + ')';
            el.style.opacity = '0';
            el.style.maxHeight = '0px';
            el.style.paddingTop = '0px';
            el.style.paddingBottom = '0px';
            el.style.borderBottomWidth = '0px';
            genioMarkNotifRead(el.dataset.notifId);
            genioRenderNotifBadge();
            setTimeout(function () {
              el.remove();
              if (!document.querySelector('.genio-notif-item')) genioRenderNotifList();
            }, 160);
          }

          el.addEventListener('pointerdown', function (e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            isDragging = false; hasDragged = false; dx = 0;
            startX = e.clientX; startY = e.clientY; pointerId = e.pointerId;
          });
          el.addEventListener('pointermove', function (e) {
            if (pointerId === null) return;
            var moveX = e.clientX - startX, moveY = e.clientY - startY;
            if (!hasDragged && Math.abs(moveX) > DRAG_THRESHOLD && Math.abs(moveX) > Math.abs(moveY)) {
              isDragging = true; hasDragged = true;
              try { el.setPointerCapture(pointerId); } catch (_) {}
              el.style.transition = 'none';
            }
            if (isDragging) {
              if (e.cancelable) e.preventDefault();
              dx = moveX;
              el.style.transform = 'translateX(' + dx + 'px)';
              el.style.opacity = String(Math.max(0.3, 1 - Math.abs(dx) / 200));
            }
          });
          function endDrag() {
            if (pointerId !== null) { try { el.releasePointerCapture(pointerId); } catch (_) {} pointerId = null; }
            if (isDragging) {
              el.style.transition = 'transform .2s ease, opacity .2s ease';
              if (Math.abs(dx) > DISMISS_THRESHOLD) { dismiss(); }
              else { el.style.transform = 'translateX(0)'; el.style.opacity = '1'; }
            }
            isDragging = false;
          }
          el.addEventListener('pointerup', endDrag);
          el.addEventListener('pointercancel', endDrag);

          el.addEventListener('click', function (e) {
            if (hasDragged) { e.preventDefault(); e.stopPropagation(); hasDragged = false; return; }
            genioMarkNotifRead(el.dataset.notifId);
            genioCloseNotifPanel();
            var type = el.dataset.notifType;
            if (type === 'tutor-approval') { showModule('data-tutor'); }
            else if (type === 'presensi-revisi') {
              showModule('presensi');
              if (window.genioModuleHandlers && window.genioModuleHandlers['presensi-tutor-goto']) window.genioModuleHandlers['presensi-tutor-goto']('tindakan');
            }
            else {
              showModule('presensi');
              if (window.genioModuleHandlers && window.genioModuleHandlers['presensi-goto']) {
                window.genioModuleHandlers['presensi-goto'](type === 'presensi-approval' ? 'approval' : 'riwayat');
              }
            }
            genioLoadNotifications();
          });
        });
      }

      function genioOpenNotifPanel() {
        panel.style.display = 'block';
        genioRenderNotifList();
      }
      function genioCloseNotifPanel() {
        panel.style.display = 'none';
      }
      bellBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (panel.style.display === 'block') genioCloseNotifPanel();
        else genioOpenNotifPanel();
      });
      document.addEventListener('click', function (e) {
        if (panel.style.display === 'block' && !panel.contains(e.target) && e.target !== bellBtn && !bellBtn.contains(e.target)) {
          genioCloseNotifPanel();
        }
      });

      if (clearBtn) {
        clearBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          genioNotifItems.forEach(function (n) {
            n.read = true;
            if (genioSessionHiddenIds.indexOf(n.id) === -1) genioSessionHiddenIds.push(n.id);
          });
          genioRenderNotifBadge();
          genioRenderNotifList();
          genioToast('Notifikasi sesi ini disembunyikan', 'success');
        });
      }

      genioLoadNotifications();
      setInterval(genioLoadNotifications, 60000);
    } // tutup genioInitNotifikasi
    } // tutup initDashboard
  </script>
</body>
</html>

<div class="module-panel" data-module="gaji">
<style>
  /* Radius rule (sama dgn Login): interaktif = 10px, kartu = 16px, panel hero = 20px */
  .module-panel[data-module="gaji"] .card{border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:none;}
  .gj-periode-sec, .gj-hero-sec, .gj-dock-sec, .gj-search-sec{margin-bottom:14px;}
  #gj-sectionLabelWrap{margin-bottom:12px;}
  #gj-desktopAnchor{display:none !important;}

  /* ===== Highlight gaji: total + tutor teratas | cincin lunas + tombol ===== */
  .gj-hero-sec{
    position:relative; overflow:hidden; border-radius:18px; color:#fff; box-sizing:border-box;
    display:grid; grid-template-columns:minmax(0,1fr) auto;
    background:linear-gradient(135deg, #070833 0%, #101075 55%, var(--blue) 100%);
  }
  .gb-main{position:relative; isolation:isolate; padding:16px 20px; min-width:0; display:flex; flex-direction:column; justify-content:center;}
  .gb-main::before{content:''; position:absolute; z-index:-1; left:-70px; top:-150px; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(124,160,255,.24), rgba(124,160,255,0) 65%); pointer-events:none;}
  .gb-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .gj-hero-label{display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:500; color:rgba(255,255,255,.72);}
  .gj-hero-label i{width:6px; height:6px; border-radius:50%; background:#7CF0C3; box-shadow:0 0 0 4px rgba(124,240,195,.16);}
  .gj-hero-tutor-pill{font-size:10px; font-weight:500; white-space:nowrap; background:rgba(255,255,255,.12); color:#fff; padding:2px 8px; border-radius:999px;}
  .gb-row{display:flex; align-items:center; gap:32px; flex-wrap:wrap; margin-top:10px;}
  .gb-row > div:first-child{min-width:0;}
  .gj-hero-num{display:block; font-size:32px; font-weight:800; letter-spacing:-.035em; line-height:1.05; margin-top:4px; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .gb-sub{font-size:10.5px; color:rgba(255,255,255,.62); margin-top:4px;}
  .gb-tops{display:grid; gap:7px; flex:1; min-width:240px; max-width:440px;}
  .gb-tops:empty{display:none;}
  .gb-tp{display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:10px; font-size:10.5px; color:rgba(255,255,255,.8);}
  .gb-tp span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gb-tp b{font-weight:700; color:#fff; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .gb-tp .bar{grid-column:1/-1; height:4px; border-radius:99px; background:rgba(255,255,255,.08); margin-top:4px; overflow:hidden;}
  .gb-tp .bar i{display:block; height:100%; border-radius:99px; background:#7CF0C3; transform-origin:left center;}
  .gb-side{background:rgba(255,255,255,.06); border-left:1px solid rgba(255,255,255,.1); padding:16px 18px; display:flex; flex-direction:column; justify-content:center; gap:12px; min-width:250px;}
  .gb-ringwrap{display:flex; align-items:center; gap:14px;}
  .gb-ring{width:64px; height:64px; flex:none; overflow:visible;}
  .gb-ring-track{fill:none; stroke:rgba(255,255,255,.1); stroke-width:7;}
  .gb-ring-arc{fill:none; stroke-width:7; transform:rotate(-90deg); transform-origin:32px 32px; transition:stroke-dasharray .8s cubic-bezier(.16,1,.3,1);}
  .gb-ring-n{fill:#fff; font-family:var(--font); font-size:13px; font-weight:800;}
  .gb-ring-l{fill:rgba(255,255,255,.6); font-family:var(--font); font-size:7.5px;}
  .gb-ringlist{display:grid; gap:6px; flex:1; min-width:0;}
  .gb-rl{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; column-gap:7px; font-size:10.5px; color:rgba(255,255,255,.75);}
  .gb-rl em{width:7px; height:7px; border-radius:2px; display:inline-block;}
  .gb-rl b{color:#fff; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .gb-rl small{grid-column:2 / -1; font-size:9.5px; color:rgba(255,255,255,.5); line-height:1.2;}
  .gb-rl{row-gap:1px;}
  .gb-ringlist{gap:9px !important;}
  .gj-hero-actions{display:grid; gap:8px;}
  .gj-hero-cetak-btn, .gj-hero-hapus-btn{
    height:32px; padding:0 12px; border-radius:9px; width:100%;
    font-family:var(--font); font-size:11.5px; font-weight:600; white-space:nowrap; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .gj-hero-cetak-btn{background:#fff; color:var(--blue); border:1px solid #fff; height:34px;}
  .gj-hero-cetak-btn:hover{background:var(--blue-tint);}
  .gj-hero-hapus-btn{background:rgba(255,255,255,.06); color:rgba(255,255,255,.85); border:1px solid rgba(255,255,255,.22); font-weight:500;}
  .gj-hero-hapus-btn:hover{background:rgba(255,255,255,.14);}
  .gj-hero-cetak-btn:active, .gj-hero-hapus-btn:active{transform:scale(.97);}
  .gj-hero-cetak-btn:focus-visible, .gj-hero-hapus-btn:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  .gj-hero-cetak-btn i, .gj-hero-hapus-btn i{font-size:14px;}
  @media (max-width:899px){
    .gj-hero-sec{grid-template-columns:1fr;}
    .gb-side{border-left:none; border-top:1px solid rgba(255,255,255,.1); min-width:0;}
    .gj-hero-num{font-size:27px;}
    .gb-row{flex-direction:column; align-items:stretch; gap:14px;}
    .gb-tops{min-width:0; max-width:none;}
    .gj-hero-actions{grid-template-columns:1fr 1fr;}
  }

  /* ===== Tab Belum / Lunas ===== */
  .gj-dock{
    position:relative; display:flex; align-items:center;
    background:var(--surface); border:1px solid var(--border); padding:3px; border-radius:10px;
    height:38px; box-sizing:border-box;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .gj-dock-glider{
    position:absolute; top:3px; bottom:3px; z-index:1; pointer-events:none;
    border-radius:7px; background:#fff;
    box-shadow:0 1px 2px rgba(20,22,43,.08), 0 0 0 1px var(--border);
    transition:left .28s cubic-bezier(.16,1,.3,1), width .28s cubic-bezier(.16,1,.3,1);
  }
  .gj-dock-btn{
    position:relative; z-index:2; flex:1;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:none; border:none; cursor:pointer;
    height:30px; padding:0 12px; font-size:12px; font-family:var(--font);
    color:var(--ink-soft); font-weight:500; white-space:nowrap; transition:color .18s ease;
  }
  .gj-dock-btn.gj-dock-active{color:var(--ink); font-weight:500;}
  .gj-count{font-size:10px; font-weight:500; padding:0 6px; border-radius:999px; font-variant-numeric:tabular-nums;}
  .gj-count-belum{background:var(--blue); color:#fff;}
  .gj-count-lunas{background:var(--border); color:var(--ink-soft);}

  /* ===== Cari & tampilan ===== */
  .gj-search-sec{display:flex; gap:8px;}
  .gj-search-box{
    flex:1; display:flex; align-items:center; gap:8px;
    height:34px; padding:0 11px; border-radius:var(--radius-sm);
    background:#fff; border:1px solid var(--border);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .gj-search-box:focus-within{border-color:var(--blue); box-shadow:0 0 0 3px rgba(28,26,175,.12);}
  .gj-search-box i{font-size:15px; color:var(--ink-soft);}
  .gj-search-box input{border:none; outline:none; flex:1; min-width:0; font-size:12.5px; font-family:var(--font); background:none; color:var(--ink);}
  .gj-search-box input::placeholder{color:#6E7289;}
  #gj-viewToggleBtn{width:34px; height:34px; color:var(--ink);}

  .gj-meta-pill{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:26px; padding:0 10px; border-radius:999px; box-sizing:border-box; white-space:nowrap;
    background:#fff; border:1px solid var(--border);
    font-family:var(--font); font-size:11px; font-weight:500; color:var(--ink-soft);
  }
  button.gj-meta-pill{cursor:pointer; color:var(--ink);}
  button.gj-meta-pill:hover{background:var(--surface);}
  .gj-meta-pill i{font-size:12px; color:var(--blue);}
  .gj-section-title{font-size:13px; font-weight:500; color:var(--ink);}
  .gj-section-sub{font-size:11px; color:var(--ink-soft); margin-top:1px;}

  /* ===== Kartu tutor ===== */
  .gj-status-badge{
    display:inline-flex; align-items:center; gap:6px; flex:none;
    font-size:10.5px; font-weight:500; padding:0 9px; height:22px;
    border-radius:999px; box-sizing:border-box;
  }
  .gj-status-badge .gj-status-dot{width:6px; height:6px; border-radius:50%;}
  .gj-badge-lunas{background:var(--green-soft); color:var(--green);}
  .gj-badge-belum{background:#FFF4E0; color:#A15C00;}
  .gj-detail{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border);}
  .gj-detail-label{font-size:10.5px; font-weight:500; color:var(--ink-soft);}
  .gj-detail-val{font-size:12.5px; font-weight:500; color:var(--ink); margin-top:2px; font-variant-numeric:tabular-nums;}
  .gj-detail-val.gj-total{font-size:14px; font-weight:500;}
  .gj-card-actions{display:flex; gap:8px; margin-top:12px;}

  .gj-card .gj-slip-btn, .gj-card .gj-batal-lunas-btn, .gj-card .gj-transfer-btn{
    height:32px; padding:0 12px; border-radius:9px;
    font-family:var(--font); font-size:12px; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .gj-card .gj-slip-btn i, .gj-card .gj-batal-lunas-btn i, .gj-card .gj-transfer-btn i{font-size:14px; pointer-events:none;}
  .gj-card .gj-slip-btn{flex:1;}
  .gj-card .gj-slip-btn[data-action="print"]{background:var(--blue); color:#fff; border:1px solid var(--blue);}
  .gj-card .gj-slip-btn[data-action="print"]:hover{background:var(--blue-dark);}
  .gj-card .gj-slip-btn[data-action="view"]{background:var(--blue-tint); color:var(--blue); border:1px solid rgba(28,26,175,.18);}
  .gj-card .gj-slip-btn[data-action="view"]:hover{border-color:var(--blue);}
  .gj-card .gj-batal-lunas-btn{background:#fff; color:var(--ink-soft); border:1px solid var(--border);}
  .gj-card .gj-batal-lunas-btn:hover{background:var(--red-soft); border-color:rgba(212,7,15,.3); color:var(--red);}
  .gj-card .gj-transfer-btn{width:100%; background:var(--blue); color:#fff; border:1px solid var(--blue);}
  .gj-card .gj-transfer-btn:hover{background:var(--blue-dark);}
  .gj-card .gj-slip-btn:active, .gj-card .gj-batal-lunas-btn:active, .gj-card .gj-transfer-btn:active{transform:scale(.98);}


  /* ===== Kartu tutor (gaya Presensi) ===== */
  .gc-card{padding:14px 16px !important; margin-bottom:12px; transition:box-shadow .18s ease, border-color .18s ease, transform .18s ease;}
  .gc-card:hover{border-color:#D5D8E8 !important; box-shadow:0 4px 14px -6px rgba(20,22,43,.12) !important; transform:translateY(-1px);}
  .gc-head{display:flex; align-items:center; gap:10px; min-width:0;}
  .gc-who{min-width:0; flex:1;}
  .gc-who h4{font-size:12.5px; font-weight:600; color:var(--ink); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3;}
  .gc-who p{display:flex; align-items:center; gap:4px; font-size:10.5px; color:var(--ink-soft); margin:1px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gc-who p i{font-size:11.5px; flex:none;}
  .gc-who p.is-empty{color:#B86E00;}
  .gc-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .gc-chip{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink); background:var(--surface); border-radius:8px; padding:4px 8px; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis;}
  .gc-chip i{font-size:12px; color:var(--ink-soft);}
  .gc-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding-top:11px; border-top:1px dashed var(--border);}
  .gc-total span{display:block; font-size:10px; color:var(--ink-soft);}
  .gc-total b{display:block; font-size:14px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; margin-top:1px;}
  .gc-card .gj-card-actions{margin-top:10px;}
  .gc-card .gj-slip-btn, .gc-card .gj-batal-lunas-btn, .gc-card .gj-transfer-btn{height:34px !important; font-size:11px !important; font-weight:600 !important;}
  .gc-card .gj-batal-lunas-btn{font-weight:500 !important;}
  .gj-status-badge{font-size:10px !important; font-weight:600 !important; height:auto !important; padding:4px 9px !important;}
  .gj-badge-belum{background:#FFF4E0 !important; color:#C27400 !important;}
  .gj-badge-lunas{background:#E9F7EF !important; color:#1E8E5A !important;}

  /* ===== Tabel (gaya Presensi) ===== */
  .gj-table-card{border-radius:14px !important;}
  .gj-table th{background:#fff !important; font-size:10.5px !important; padding:11px 12px !important;}
  .gj-table td{font-size:11px !important; border-bottom:1px solid #EEF0F6 !important;}
  .gj-table tbody tr:hover{background:#F8F9FD !important;}
  .gt-tutor{display:inline-flex; align-items:center; gap:8px;}
  .gt-av{width:24px; height:24px; border-radius:50%; background:var(--blue-tint); color:var(--blue); display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; flex:none;}
  .gt-chip{display:inline-block; background:var(--surface); border-radius:6px; padding:2px 7px; font-size:10.5px; white-space:nowrap; margin:1px 0;}
  .gj-table-status-pill{font-size:10px !important; font-weight:600 !important;}

  /* ===== Animasi ===== */
  @keyframes gjIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes gjFadeIn{from{opacity:0;} to{opacity:1;}}
  @keyframes gjGrow{from{transform:scaleX(0);} to{transform:scaleX(1);}}
  #gj-list > .gj-card.gj-in{animation:gjIn .42s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--i) * 45ms);}
  #gj-list .gj-table tbody tr.gj-in td{animation:gjFadeIn .35s ease both; animation-delay:calc(var(--i) * 30ms);}
  .gj-grow{animation:gjGrow .8s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--i) * 70ms + 150ms);}
  @media (prefers-reduced-motion: reduce){
    #gj-list > .gj-card.gj-in, #gj-list .gj-table tbody tr.gj-in td, .gj-grow{animation:none !important;}
    .gb-ring-arc{transition:none;}
    .gc-card:hover{transform:none;}
  }

  /* ===== Tabel ===== */
  #gj-list.gj-view-table{display:block !important;}
  .gj-table-card{background:#fff; border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:16px;}
  .gj-table-wrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .gj-table{width:100%; border-collapse:collapse; text-align:left; font-family:var(--font); font-size:12px;}
  .gj-table th{
    padding:10px 12px; background:var(--surface); border-bottom:1px solid var(--border);
    font-size:11px; font-weight:500; color:var(--ink-soft); white-space:nowrap;
  }
  .gj-table td{padding:10px 12px; border-bottom:1px solid var(--border); color:var(--ink); vertical-align:middle; font-size:12px !important; line-height:1.35; font-variant-numeric:tabular-nums;}
  .gj-table tbody tr:last-child td{border-bottom:none;}
  .gj-table tbody tr{transition:background .12s ease;}
  .gj-table tbody tr:hover{background:#FAFAFD;}
  .gj-sort-th{cursor:pointer; user-select:none; -webkit-user-select:none; transition:color .12s ease;}
  .gj-sort-th:hover{color:var(--ink) !important;}
  .gj-sort-th:hover svg{opacity:.75 !important;}
  @keyframes gjPop{0%{transform:scale(1);} 40%{transform:scale(1.1);} 100%{transform:scale(1);}}
  @media (prefers-reduced-motion:no-preference){ .gj-btn-pop{animation:gjPop .3s cubic-bezier(.16,1,.3,1);} }

  .gj-table-status-pill{
    display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px;
    border-radius:999px; box-sizing:border-box; white-space:nowrap;
    font-family:var(--font); font-size:10.5px; font-weight:500;
  }
  .gj-table-status-pill .gj-status-dot{width:6px; height:6px; border-radius:50%; flex:none;}
  .gj-table-icon-btn{
    width:28px; height:28px; border-radius:8px; box-sizing:border-box;
    border:1px solid var(--border); background:#fff; color:var(--ink-soft);
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;
    transition:background .12s ease, border-color .12s ease, color .12s ease, transform .1s ease;
  }
  .gj-table-icon-btn i{pointer-events:none;}
  .gj-table-icon-btn:hover{background:var(--surface); border-color:#C9CCE0; color:var(--ink);}
  .gj-table-icon-btn:active{transform:scale(.95);}
  .gj-table-icon-btn.gj-batal-lunas-btn:hover{color:var(--red) !important; border-color:rgba(212,7,15,.3) !important; background:var(--red-soft) !important;}
  .gj-table .gj-transfer-btn{
    height:28px; padding:0 10px; border-radius:8px; box-sizing:border-box;
    background:var(--blue); color:#fff; border:1px solid var(--blue);
    font-family:var(--font); font-size:11.5px; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap;
    transition:background .12s ease, transform .1s ease;
  }
  .gj-table .gj-transfer-btn i{font-size:13px; pointer-events:none;}
  .gj-table .gj-transfer-btn:hover{background:var(--blue-dark);}
  .gj-table .gj-transfer-btn:active{transform:scale(.97);}

  /* ===== Modal preview & konfirmasi ===== */
  #gj-previewModal, #gj-confirmModal{
    align-items:center; justify-content:center; padding:16px; box-sizing:border-box;
    opacity:0; transition:opacity .22s ease;
  }
  #gj-previewModal.show, #gj-confirmModal.show{opacity:1;}
  #gj-previewModal .modal-sheet, #gj-confirmModal .modal-sheet{
    border-radius:20px; width:100%; max-width:380px; margin:0 auto;
    padding:22px !important; border:1px solid var(--border);
    box-shadow:0 24px 56px -16px rgba(20,22,43,.35);
    transform:translateY(8px); transition:transform .28s cubic-bezier(.16,1,.3,1);
  }
  #gj-previewModal .modal-sheet{max-width:500px !important; width:94% !important; padding:0 !important; overflow:hidden !important; border-radius:16px !important;}
  #gj-previewModal .pv-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px 10px 16px;}
  #gj-previewModal #gj-previewTitle{margin:0; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #gj-previewModal #gj-previewSub{font-size:10.5px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #gj-previewModal .pv-close{width:28px; height:28px; border-radius:8px; background:var(--surface); border:none; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; font-size:14px;}
  #gj-previewModal .pv-close:hover{background:#EBEDF5; color:var(--ink);}
  #gj-previewModal .pv-media{position:relative; width:100%; height:62vh; max-height:65vh; background:var(--surface); border-top:1px solid var(--border); border-bottom:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  #gj-previewModal .pv-spinner{display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--ink-soft); font-size:10.5px; font-weight:500; padding:30px 20px;}
  #gj-previewModal .pv-foot{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 14px 11px;}
  #gj-previewModal .pv-foot-link{display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 11px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--ink); font-family:var(--font); font-size:10.5px; font-weight:500; text-decoration:none; cursor:pointer;}
  #gj-previewModal .pv-foot-link:hover{background:var(--surface);}
  #gj-previewModal .pv-foot-link.is-danger{color:var(--red); border-color:rgba(212,7,15,.22);}
  #gj-previewModal .pv-foot-link.is-danger:hover{background:var(--red-soft);}
  #gj-previewModal.show .modal-sheet, #gj-confirmModal.show .modal-sheet{transform:none;}
  #gj-previewModal .btn, #gj-confirmModal .btn{
    font-size:12.5px !important; font-weight:500 !important; height:34px !important; padding:0 14px !important;

<script>
  window.genioModuleHandlers = window.genioModuleHandlers || {};
  window.genioModuleHandlers['gaji'] = function () { gjInit(); };

  var gjState = {
    tab: 'belum',
    periode: null,
    rows: [],
    jamMap: {},
    mapelMap: {},
    search: '',
    sortDesc: true,
    sortField: 'total_gaji',
    viewMode: localStorage.getItem('genio_gj_view_mode') || 'cards'
  };

  function gjInit() {
    if (!gjState.periode) {
      var now = new Date();
      gjState.periode = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    }
    gjUpdatePeriodeLabel();

    var savedView = localStorage.getItem('genio_gj_view_mode');
    if (savedView === 'table' || savedView === 'cards') {
      gjState.viewMode = savedView;
    }
    gjUpdateViewToggleUI();

    function gjOpenPeriodePicker() {
      if (typeof genioOpenMonthYearPicker === 'function') {
        genioOpenMonthYearPicker({
          currentValue: gjState.periode,
          title: 'Periode gaji',
          onSelect: function (val) {
            gjState.periode = val;
            document.getElementById('gj-periodeInput').value = val;
            gjUpdatePeriodeLabel();
            gjLoadAll();
          }
        });
      } else {
        var input = document.getElementById('gj-periodeInput');
        try { input.showPicker(); } catch (e) { input.click(); }
      }
    }
    document.getElementById('gj-pilihPeriodeBtn').onclick = gjOpenPeriodePicker;
    var gjLabelWrap = document.getElementById('gj-periodeLabelWrap') || document.getElementById('gj-periodeLabel');
    if (gjLabelWrap) gjLabelWrap.onclick = gjOpenPeriodePicker;
    document.getElementById('gj-periodeInput').onchange = function (e) {
      if (e.target.value) { gjState.periode = e.target.value; gjUpdatePeriodeLabel(); gjLoadAll(); }
    };
    document.getElementById('gj-refreshBtn').onclick = function () {
      genioSpinRefresh(this);
      gjLoadAll();
    };

    document.getElementById('gj-searchInput').oninput = function (e) {
      gjState.search = e.target.value.toLowerCase();
      gjRenderList();
    };
    document.getElementById('gj-sortBtn').onclick = function () {
      gjState.sortField = 'total_gaji';
      gjState.sortDesc = !gjState.sortDesc;
      document.getElementById('gj-sortLabel').textContent = gjState.sortDesc ? 'Gaji tertinggi' : 'Gaji terendah';
      gjRenderList(true);
    };

    var toggleBtn = document.getElementById('gj-viewToggleBtn');
    if (toggleBtn) {
      toggleBtn.onclick = function () {
        gjToggleViewMode();
      };
    }

    var cetakSemuaBtn = document.getElementById('gj-cetakSemuaBtn');
    if (cetakSemuaBtn) {
      cetakSemuaBtn.onclick = function () {
        gjProcessBatchSlip();
      };
    }

    var hapusSemuaBtn = document.getElementById('gj-hapusSemuaBtn');
    if (hapusSemuaBtn) {
      hapusSemuaBtn.onclick = function () {
        var visibleRows = gjGetVisibleRows();
        var targetRows = visibleRows.filter(function (r) { return !!r.pdf_url; });
        if (targetRows.length === 0) {
          if (visibleRows.length === 0) {
            genioToast('Tidak ada data pada tabel yang tampil saat ini.', 'info');
          } else {
            genioToast('Belum ada slip gaji yang dicetak pada data tabel yang tampil saat ini.', 'info');
          }
          return;
        }
        gjOpenConfirmModal(targetRows);
      };
    }

    var confirmCancelBtn = document.getElementById('gj-confirmCancelBtn');
    if (confirmCancelBtn) confirmCancelBtn.onclick = gjCloseConfirmModal;
    var confirmOkBtn = document.getElementById('gj-confirmOkBtn');
    if (confirmOkBtn) {
      confirmOkBtn.onclick = async function () {
        if (typeof gjConfirmCallback === 'function') {
          var cb = gjConfirmCallback;
          gjConfirmCallback = null;
          await cb();
        } else {
          await gjHandleDeleteAllSlips();
        }
      };
    }
    var confirmModal = document.getElementById('gj-confirmModal');
    if (confirmModal) {
      confirmModal.onclick = function (e) {
        if (e.target === this) gjCloseConfirmModal();
      };
    }

    var prevCloseBtn = document.getElementById('gj-previewCloseBtn');
    if (prevCloseBtn) prevCloseBtn.onclick = gjCloseSlipPreview;
    var prevCloseX = document.getElementById('gj-previewCloseX');
    if (prevCloseX) prevCloseX.onclick = gjCloseSlipPreview;
    var prevDeleteBtn = document.getElementById('gj-previewDeleteBtn');
    if (prevDeleteBtn) prevDeleteBtn.onclick = gjHandleDeleteSingleSlip;
    var prevModal = document.getElementById('gj-previewModal');
    if (prevModal) {
      prevModal.onclick = function (e) {
        if (e.target === this) gjCloseSlipPreview();
      };
    }

    initGjTabScrubbing();
    setTimeout(gjUpdateDockGlider, 50);
    window.addEventListener('resize', gjUpdateDockGlider);

    gjApplyResponsiveLayout();
    var gjLayoutResizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(gjLayoutResizeTimer);
      gjLayoutResizeTimer = setTimeout(gjApplyResponsiveLayout, 150);
    });

    gjLoadAll();
  }

  /* Layout desktop: Tab switcher + Search/Filter jadi satu baris toolbar.
     Di mobile semua balik ke urutan asli. */
  var GJ_MOBILE_ORDER = ['.gj-dock-sec', '.gj-search-sec'];

  function gjApplyResponsiveLayout() {
    var anchor = document.getElementById('gj-desktopAnchor');
    if (!anchor) return;
    var isDesktop = window.matchMedia('(min-width:900px)').matches;
    var toolbarRow = document.getElementById('gj-toolbarRow');

    if (isDesktop) {
      if (!toolbarRow) {
        toolbarRow = document.createElement('div');
        toolbarRow.id = 'gj-toolbarRow';
        anchor.parentNode.insertBefore(toolbarRow, anchor.nextSibling);
      }
      var dockEl = document.querySelector('.gj-dock-sec');
      if (dockEl) toolbarRow.appendChild(dockEl);
      var searchEl = document.querySelector('.gj-search-sec');
      if (searchEl) toolbarRow.appendChild(searchEl);
    } else if (toolbarRow) {
      var cursor = anchor;
      GJ_MOBILE_ORDER.forEach(function (sel) {
        var el = document.querySelector(sel);
        if (el) { cursor.parentNode.insertBefore(el, cursor.nextSibling); cursor = el; }
      });
      toolbarRow.remove();
    }
  }

  function gjUpdatePeriodeLabel() {
    var parts = gjState.periode.split('-');
    var namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][parseInt(parts[1], 10) - 1];
    document.getElementById('gj-periodeLabel').textContent = namaBulan + ' ' + parts[0];
  }

  var GJ_TABS = ['belum', 'lunas'];

  function gjSwitchTab(tab) {
    gjState.tab = tab;
    document.querySelectorAll('.gj-dock-btn').forEach(function (b) {
      b.classList.toggle('gj-dock-active', b.dataset.tab === tab);
    });
    gjUpdateDockGlider();
    gjRenderList(true);
  }

  function gjUpdateDockGlider() {
    var activeBtn = document.querySelector('.gj-dock-btn.gj-dock-active');
    var glider = document.getElementById('gj-dockGlider');
    if (!activeBtn || !glider) return;
    glider.style.left = activeBtn.offsetLeft + 'px';
    glider.style.width = activeBtn.offsetWidth + 'px';
  }

  /* Drag/geser + animasi zoom-tahan — sama mekanisme seperti Presensi & bottom bar */
  function initGjTabScrubbing() {
    var dock = document.getElementById('gj-dock');
    var glider = document.getElementById('gj-dockGlider');
    if (!dock || !glider || dock._gjScrubBound) return;
    dock._gjScrubBound = true;

    var isPointerDown = false, isDragging = false, hasDragged = false, suppressClick = false;
    var startX = 0, startY = 0, pointerId = null;
    var cachedLeft = 0, cachedWidth = 0, cachedGliderWidth = 0, targetTab = gjState.tab;
    var DRAG_THRESHOLD = 8;

    dock.addEventListener('dragstart', function (e) { e.preventDefault(); });
    dock.addEventListener('click', function (e) {
      if (suppressClick) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    dock.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      isPointerDown = true; isDragging = false; hasDragged = false; suppressClick = false;
      pointerId = e.pointerId; startX = e.clientX; startY = e.clientY;
      var rect = dock.getBoundingClientRect();
      cachedLeft = rect.left; cachedWidth = rect.width;
      cachedGliderWidth = glider.offsetWidth || (rect.width / GJ_TABS.length);
      targetTab = gjState.tab;
    });

    dock.addEventListener('pointermove', function (e) {
      if (!isPointerDown) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (!hasDragged) {
        if (Math.abs(dx) > DRAG_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
          isDragging = true; hasDragged = true; suppressClick = true;
          try { dock.setPointerCapture(pointerId); } catch (_) {}
        }
      }
      if (isDragging) {
        if (e.cancelable) e.preventDefault();
        var relX = e.clientX - cachedLeft;
        var clampedPx = Math.max(0, Math.min(cachedWidth - cachedGliderWidth, relX - cachedGliderWidth / 2));
        glider.style.transition = 'none';
        glider.style.left = clampedPx + 'px';
        var ratio = Math.max(0, Math.min(0.999, relX / cachedWidth));
        var newIdx = Math.min(GJ_TABS.length - 1, Math.max(0, Math.floor(ratio * GJ_TABS.length)));
        targetTab = GJ_TABS[newIdx];
        document.querySelectorAll('.gj-dock-btn').forEach(function (b) {
          b.classList.toggle('gj-dock-active', b.dataset.tab === targetTab);
        });
      }
    });

    function endScrub() {
      if (!isPointerDown) return;
      isPointerDown = false;
      glider.style.transition = '';
      if (pointerId !== null) { try { dock.releasePointerCapture(pointerId); } catch (_) {} pointerId = null; }
      if (hasDragged) {
        isDragging = false;
        gjSwitchTab(targetTab);
        setTimeout(function () { suppressClick = false; }, 80);
      } else {
        suppressClick = false;
      }
    }
    dock.addEventListener('pointerup', endScrub);
    dock.addEventListener('pointercancel', function () {
      endScrub();
    });

    document.querySelectorAll('.gj-tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!hasDragged) gjSwitchTab(btn.dataset.tab);
      });
    });
  }

  function gjPeriodeDateRange() {
    var parts = gjState.periode.split('-');
    var year = parseInt(parts[0], 10), month = parseInt(parts[1], 10);
    var start = gjState.periode + '-01';
    var lastDay = new Date(year, month, 0).getDate();
    var end = gjState.periode + '-' + String(lastDay).padStart(2, '0');
    return { start: start, end: end };
  }

  async function gjLoadAll() {
    var listEl = document.getElementById('gj-list');
    try {
      var s = genioGetSession();
      var range = gjPeriodeDateRange();

      var results = await Promise.all([
        supaRest('slip_gaji?periode=eq.' + gjState.periode + '&select=id,tutor_id,total_pertemuan,total_gaji,status,tanggal_dibayar,pdf_url,users!slip_gaji_tutor_id_fkey(nama,foto_profil_url,tutor_profile(nama_bank,no_rekening))&order=total_gaji.desc', s.access_token),
        supaRest('users?role=eq.tutor&status=eq.aktif&select=id', s.access_token),
        supaRest('presensi?tanggal=gte.' + range.start + '&tanggal=lte.' + range.end + '&status=in.(diterima,visit)&select=id,nominal_dibayar,kontrak_tutor_id,kontrak_tutor(tutor_id,mapel,jadwal(hari,jam_mulai,jam_selesai))', s.access_token)
      ]);

      gjState.rows = results[0];
      var totalTutorTerdaftar = results[1].length;
      var presensiRows = results[2];

      var GJ_HARI = ['minggu', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu'];
      var jamMap = {};
      var mapelMap = {};
      var tutorLiveStats = {};
      presensiRows.forEach(function (r) {
        var kt = r.kontrak_tutor;
        if (!kt || !kt.tutor_id) return;
        var tid = kt.tutor_id;

        // Akumulasi sesi & nominal aktual dari presensi diterima & visit
        if (!tutorLiveStats[tid]) {
          tutorLiveStats[tid] = { pertemuan: 0, totalGaji: 0 };
        }
        tutorLiveStats[tid].pertemuan += 1;
        tutorLiveStats[tid].totalGaji += parseFloat(r.nominal_dibayar || 0);

        var jw = kt.jadwal && kt.jadwal[0];
        var durasiJam = 1.5;
        if (jw) {
          var mulai = jw.jam_mulai.split(':'), selesai = jw.jam_selesai.split(':');
          var menit = (parseInt(selesai[0], 10) * 60 + parseInt(selesai[1], 10)) - (parseInt(mulai[0], 10) * 60 + parseInt(mulai[1], 10));
          durasiJam = menit / 60;
        }
        jamMap[tid] = (jamMap[tid] || 0) + durasiJam;
        if (kt.mapel) {
          mapelMap[tid] = mapelMap[tid] || {};
          mapelMap[tid][kt.mapel] = true;
        }
      });
      gjState.jamMap = jamMap;
      gjState.mapelMap = mapelMap;
      gjState.tutorLiveStats = tutorLiveStats;

      // SINKRONISASI OTOMATIS:
      // Untuk setiap baris gaji yang belum ditransfer ('belum_dibayar'),
      // selalu update total_pertemuan dan total_gaji sesuai akumulasi presensi riil terbaru
      gjState.rows.forEach(function (row) {
        if (row.status === 'belum_dibayar') {
          var live = tutorLiveStats[row.tutor_id];
          if (live) {
            var diff = (row.total_pertemuan !== live.pertemuan) || (Math.round(row.total_gaji) !== Math.round(live.totalGaji));
            if (diff) {
              row.total_pertemuan = live.pertemuan;
              row.total_gaji = live.totalGaji;
              // Sinkronkan ke Supabase di latar belakang
              supaRest('slip_gaji?id=eq.' + row.id, s.access_token, {
                method: 'PATCH',
                headers: { 'Prefer': 'return=minimal' },
                body: JSON.stringify({
                  total_pertemuan: live.pertemuan,
                  total_gaji: live.totalGaji
                })
              }).catch(function (err) {
                console.warn('Gagal sinkronisasi data gaji ke database:', err);
              });
            }
          }
        }
      });

      document.getElementById('gj-heroTutorBadge').textContent = totalTutorTerdaftar + ' tutor terdaftar';
      document.getElementById('gj-heroPeriodePill').textContent = document.getElementById('gj-periodeLabel').textContent;

      var totalAnggaran = gjState.rows.reduce(function (sum, r) { return sum + parseFloat(r.total_gaji || 0); }, 0);
      var lunasRows = gjState.rows.filter(function (r) { return r.status === 'sudah_dibayar'; });
      var belumRows = gjState.rows.filter(function (r) { return r.status === 'belum_dibayar'; });
      var totalLunas = lunasRows.reduce(function (sum, r) { return sum + parseFloat(r.total_gaji || 0); }, 0);
      var totalBelum = belumRows.reduce(function (sum, r) { return sum + parseFloat(r.total_gaji || 0); }, 0);

      gjCountUpRp(document.getElementById('gj-heroTotal'), totalAnggaran);
      document.getElementById('gj-heroLunas').textContent = gjFormatShort(totalLunas);
      document.getElementById('gj-heroLunasCount').textContent = lunasRows.length + ' tutor terbayar';
      document.getElementById('gj-heroBelum').textContent = gjFormatShort(totalBelum);
      document.getElementById('gj-heroBelumCount').textContent = belumRows.length + ' tutor menunggu';
      var totalSesi = gjState.rows.reduce(function (sum, r) { return sum + (parseInt(r.total_pertemuan, 10) || 0); }, 0);
      document.getElementById('gj-heroSub').textContent = gjState.rows.length + ' slip gaji · ' + totalSesi + ' sesi mengajar';
      gjRenderHeroTops(gjState.rows);
      gjRenderHeroRing(totalLunas, totalBelum);

      document.getElementById('gj-belumCount').textContent = belumRows.length;
      document.getElementById('gj-lunasCount').textContent = lunasRows.length;

      gjRenderList(true);
    } catch (err) {
      listEl.innerHTML = '<div class="gj-card gj-full-width" style="padding:24px; text-align:center; color:var(--red); font-size:13px;">Gagal memuat data: ' + genioEscapeHtml(err.message) + '</div>';
    }
  }

  var GJ_REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function gjFormatShort(n) {
    n = n || 0;
    var a = Math.abs(n);
    if (a >= 1e6) return 'Rp ' + (n / 1e6).toFixed(1).replace('.', ',').replace(',0', '') + ' Jt';
    if (a >= 1e3) return 'Rp ' + Math.round(n / 1e3) + ' rb';
    return 'Rp ' + Math.round(n);
  }
  function gjCountUpRp(el, to) {
    if (!el) return;
    if (GJ_REDUCED_MOTION || !to) { el.textContent = gjFormatRp(to); return; }
    var t0 = performance.now(), dur = 700;
    (function tick(t) {
      var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = gjFormatRp(Math.round(to * e));
      if (k < 1) requestAnimationFrame(tick);
    })(t0);
  }
  function gjRenderHeroTops(rows) {
    var el = document.getElementById('gj-heroTops');
    if (!el) return;
    var top = rows.slice().sort(function (a, b) { return (parseFloat(b.total_gaji) || 0) - (parseFloat(a.total_gaji) || 0); })
      .filter(function (r) { return (parseFloat(r.total_gaji) || 0) > 0; }).slice(0, 3);
    var max = top.length ? (parseFloat(top[0].total_gaji) || 1) : 1;
    el.innerHTML = top.map(function (r, i) {
      var v = parseFloat(r.total_gaji) || 0;
      return '<div class="gb-tp"><span>' + genioEscapeHtml((r.users && r.users.nama) || '-') + '</span><b>' + gjFormatShort(v) + '</b>' +
        '<div class="bar"><i class="' + (GJ_REDUCED_MOTION ? '' : 'gj-grow') + '" style="width:' + (v / max * 100).toFixed(1) + '%; opacity:' + (1 - i * 0.22) + '; --i:' + i + '"></i></div></div>';
    }).join('');
  }
  function gjRenderHeroRing(lunas, belum) {
    var g = document.getElementById('gj-heroRingArcs');
    var total = lunas + belum;
    document.getElementById('gj-heroRingPct').textContent = (total ? Math.round(lunas / total * 100) : 0) + '%';
    if (!g) return;
    var C = 2 * Math.PI * 26, off = 0, parts = [[lunas, '#7CF0C3'], [belum, '#FFC46B']];
    var gap = lunas && belum ? 1.5 : 0, html = '';
    parts.forEach(function (p) {
      if (!total || !p[0]) return;
      var len = p[0] / total * C;
      html += '<circle class="gb-ring-arc" r="26" cx="32" cy="32" stroke="' + p[1] + '" stroke-dasharray="0 ' + C.toFixed(2) + '" data-len="' + Math.max(len - gap, .5).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"></circle>';
      off += len;
    });
    g.innerHTML = html;
    var arcs = g.querySelectorAll('.gb-ring-arc');
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      arcs.forEach(function (a) { a.setAttribute('stroke-dasharray', a.dataset.len + ' ' + C.toFixed(2)); });
    }); });
  }

  function gjFormatRp(n) {

  function gjMatchesSearch(row) {
    if (!gjState.search) return true;
    var nama = (row.users && row.users.nama || '').toLowerCase();
    var profile = (row.users && row.users.tutor_profile && (row.users.tutor_profile[0] || row.users.tutor_profile)) || {};
    var rekening = (profile.no_rekening || '').toLowerCase();
    var bank = (profile.nama_bank || '').toLowerCase();
    var mapelSet = gjState.mapelMap[row.tutor_id] || {};
    var mapelStr = Object.keys(mapelSet).join(' ').toLowerCase();
    return nama.indexOf(gjState.search) !== -1 || rekening.indexOf(gjState.search) !== -1 || bank.indexOf(gjState.search) !== -1 || mapelStr.indexOf(gjState.search) !== -1;
  }

  function gjGetVisibleRows() {
    var wantStatus = gjState.tab === 'lunas' ? 'sudah_dibayar' : 'belum_dibayar';
    return (gjState.rows || []).filter(function (r) { return r.status === wantStatus; }).filter(gjMatchesSearch);
  }

  function gjRenderList(animate) {
    var listEl = document.getElementById('gj-list');
    var rows = gjGetVisibleRows();
    rows.sort(function (a, b) {
      var field = gjState.sortField || 'total_gaji';
      var res = 0;
      if (field === 'tutor') {
        var namaA = (a.users && a.users.nama || '').toLowerCase();
        var namaB = (b.users && b.users.nama || '').toLowerCase();
        res = namaA.localeCompare(namaB);
      } else if (field === 'bank') {
        var profA = (a.users && a.users.tutor_profile && (a.users.tutor_profile[0] || a.users.tutor_profile)) || {};
        var profB = (b.users && b.users.tutor_profile && (b.users.tutor_profile[0] || b.users.tutor_profile)) || {};
        var bankA = (profA.nama_bank || '').toLowerCase();
        var bankB = (profB.nama_bank || '').toLowerCase();
        res = bankA.localeCompare(bankB);
      } else if (field === 'mapel') {
        var mapelA = Object.keys(gjState.mapelMap[a.tutor_id] || {}).join(', ').toLowerCase();
        var mapelB = Object.keys(gjState.mapelMap[b.tutor_id] || {}).join(', ').toLowerCase();
        res = mapelA.localeCompare(mapelB);
      } else if (field === 'total_pertemuan') {
        res = (a.total_pertemuan || 0) - (b.total_pertemuan || 0);
      } else if (field === 'jam') {
        var jamA = gjState.jamMap[a.tutor_id] || 0;
        var jamB = gjState.jamMap[b.tutor_id] || 0;
        res = jamA - jamB;
      } else {
        res = (parseFloat(a.total_gaji || 0) - parseFloat(b.total_gaji || 0));
      }
      return gjState.sortDesc ? -res : res;

    document.getElementById('gj-resultCount').textContent = rows.length + ' Tutor';

    document.getElementById('gj-sectionLabel').innerHTML =

      actionBtn = '<div class="gj-card-actions"><button type="button" class="gj-transfer-btn" data-id="' + row.id + '"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i><span>Tandai sudah transfer</span></button></div>';
    }

    var mapelList = Object.keys(gjState.mapelMap[row.tutor_id] || {});
    var mapelChips = mapelList.slice(0, 2).map(function (m) { return '<span class="gc-chip"><i class="ph ph-book-open" aria-hidden="true"></i>' + genioEscapeHtml(m) + '</span>'; }).join('') +
      (mapelList.length > 2 ? '<span class="gc-chip">+' + (mapelList.length - 2) + '</span>' : '');
    return '' +
      '<div class="gj-card card gc-card">' +
        '<div class="gc-head">' +
          avatar +
          '<div class="gc-who">' +
            '<h4>' + genioEscapeHtml(user.nama || '-') + '</h4>' +
            '<p' + (bankStrCard ? '' : ' class="is-empty"') + '>' + (bankStrCard ? '<i class="ph ph-bank" aria-hidden="true"></i>' : '<i class="ph ph-warning-circle" aria-hidden="true"></i>') + rekeningText + '</p>' +
          '</div>' +
          badge +
        '</div>' +
        '<div class="gc-chips">' +
          '<span class="gc-chip"><i class="ph ph-calendar-check" aria-hidden="true"></i>' + row.total_pertemuan + ' sesi</span>' +
          (jam ? '<span class="gc-chip"><i class="ph ph-clock" aria-hidden="true"></i>' + jamText.toLowerCase() + '</span>' : '') +
          mapelChips +
        '</div>' +
        '<div class="gc-foot">' +
          '<div class="gc-total"><span>Total gaji</span><b>' + gjFormatRp(row.total_gaji) + '</b></div>' +
        '</div>' +
        actionBtn +
      '</div>';
  }

  function gjBindCardEvents() {
    document.querySelectorAll('.gj-slip-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.dataset.id;
        var action = btn.dataset.action;
        var row = gjState.rows.find(function (r) { return r.id === id; });
        if (!row) return;

        if (action === 'view' && row.pdf_url) {
          gjOpenSlipPreview(row);
        } else {
          gjProcessSingleSlip(row, btn);
        }
      });
    });
    document.querySelectorAll('.gj-transfer-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { gjMarkAsPaid(btn.dataset.id); });
    });
    document.querySelectorAll('.gj-batal-lunas-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.dataset.id;
        var row = gjState.rows.find(function (r) { return r.id === id; });
        if (!row) return;
        gjOpenBatalLunasModal(row);
      });
    });
    document.querySelectorAll('.gj-sort-th').forEach(function (th) {
      th.addEventListener('click', function () {
        gjSortTable(th.dataset.sort);
      });
    });
  }

  function gjBuildSlipPayload(row) {
    var user = row.users || {};
    var profile = (user.tutor_profile && user.tutor_profile[0]) || user.tutor_profile || {};
    var namaBank = (profile.nama_bank || '').trim();
    var noRek = (profile.no_rekening || '').trim();
    var bankText = (namaBank && noRek) ? (namaBank + ' - ' + noRek) : (namaBank || noRek || '-');
    var jam = gjState.jamMap[row.tutor_id] || 0;
    var jamText = jam ? (Math.round(jam * 10) / 10) + ' Jam' : '-';
    var mapelSet = gjState.mapelMap[row.tutor_id] || {};
    var mapelList = Object.keys(mapelSet);
    var mapelText = mapelList.length ? mapelList.join(', ') : '-';
    var parts = gjState.periode.split('-');
    var namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][parseInt(parts[1], 10) - 1];
    var periodeLabel = namaBulan + ' ' + parts[0];

    return {
      id: row.id,
      tutorId: row.tutor_id,
      tutorNama: user.nama || 'Tutor',
      bankText: bankText,
      mapel: mapelText,
      periode: gjState.periode,
      periodeLabel: periodeLabel,
      totalPertemuan: row.total_pertemuan || 0,
      totalJam: jamText,
      totalGaji: row.total_gaji || 0,
      status: row.status,
      tanggalDibayar: row.tanggal_dibayar ? new Date(row.tanggal_dibayar).toLocaleDateString('id-ID', { year:'numeric', month:'long', day:'numeric' }) : '-'
    };
  }

  async function gjGenerateAndSaveSlip(row) {
    var payload = gjBuildSlipPayload(row);
    var s = genioGetSession();

    var pdfUrl = await new Promise(function (resolve, reject) {
      if (window.google && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function (result) {
            if (result && result.success) resolve(result.url);
            else reject(new Error((result && result.error) || 'Gagal generate PDF ke Google Drive'));
          })
          .withFailureHandler(function (err) { reject(err); })
          .generateSlipGajiPdf(payload);
      } else {
        // Fallback jika dibuka langsung di browser luar Google Apps Script
        var mockUrl = 'https://drive.google.com/file/d/genio_slip_' + row.id + '/view';
        setTimeout(function () { resolve(mockUrl); }, 500);
      }
    });

    if (pdfUrl) {
      await supaRest('slip_gaji?id=eq.' + row.id, s.access_token, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ pdf_url: pdfUrl })
      });
      row.pdf_url = pdfUrl;
    }

    return pdfUrl;
  }

  async function gjProcessSingleSlip(row, btn) {
    if (!row || row.status !== 'sudah_dibayar') {
      genioToast('Gagal mencetak slip gaji: Status gaji belum ditransfer.', 'error');
      return;
    }
    if (btn && btn.dataset.busy === '1') return;

    var isIconBtn = btn && btn.classList.contains('gj-table-icon-btn');
    var originalTitle = btn ? (btn.getAttribute('title') || '') : '';
    if (btn) {
      btn.dataset.busy = '1';
      btn.disabled = true;
      btn.style.opacity = '.75';
      if (isIconBtn) {
        btn.setAttribute('title', 'Sedang mencetak...');
        btn.innerHTML = '<span class="spinner" style="width:12px; height:12px; border:2px solid rgba(20,22,43,.25); border-top-color:var(--ink); display:inline-block; vertical-align:middle; box-sizing:border-box; margin:0 auto;"></span>';
      } else {
        btn.innerHTML = '<span class="spinner" style="width:12px; height:12px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; margin-right:6px; display:inline-block; vertical-align:middle; box-sizing:border-box;"></span><span>Mencetak...</span>';
      }
    }

    try {
      genioToast('Membuat PDF slip gaji ke Google Drive...', 'loading');
      var pdfUrl = await gjGenerateAndSaveSlip(row);
      genioToast('Slip gaji ' + ((row.users && row.users.nama) || 'Tutor') + ' berhasil dicetak!', 'success');

      if (btn) {
        btn.dataset.busy = '0';
        btn.disabled = false;
        btn.style.opacity = '';
      }

      gjRenderList();
    } catch (err) {
      if (btn) {
        btn.dataset.busy = '0';
        btn.disabled = false;
        btn.style.opacity = '';
        if (isIconBtn) {
          btn.setAttribute('title', originalTitle || 'Cetak Slip Gaji');
          btn.innerHTML = '<i class="ph ph-printer" aria-hidden="true"></i>';
        } else {
          btn.innerHTML = '<i class="ph ph-printer" aria-hidden="true"></i><span>Cetak slip</span>';
        }
      }
      genioToast('Gagal membuat slip gaji: ' + err.message, 'error');
    }
  }

  function gjGetDriveId(url) {
    if (!url) return null;
    var isDrive = url.indexOf('drive.google.com') !== -1 || url.indexOf('docs.google.com') !== -1;
    if (!isDrive) return null;
    var m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) ||
            url.match(/\/d\/([a-zA-Z0-9_-]+)/) ||
            url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    return m ? m[1] : null;
  }

  var gjActivePreviewRow = null;

  function gjOpenSlipPreview(row) {
    var url = row.pdf_url;
    if (!url) return;

    gjActivePreviewRow = row;

    var modal = document.getElementById('gj-previewModal');
    if (!modal) {
      window.open(url, '_blank');
      return;
    }

    var user = row.users || {};
    var titleEl = document.getElementById('gj-previewTitle');
    var subEl = document.getElementById('gj-previewSub');
    var iframe = document.getElementById('gj-previewIframe');
    var spinner = document.getElementById('gj-previewSpinner');
    var link = document.getElementById('gj-previewDirectLink');

    if (titleEl) titleEl.textContent = 'Slip gaji ' + (user.nama || 'tutor');
    var parts = gjState.periode.split('-');
    var namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][parseInt(parts[1], 10) - 1];
    if (subEl) subEl.textContent = 'Periode ' + namaBulan + ' ' + parts[0] + ' • ' + gjFormatRp(row.total_gaji);

    if (link) {
      link.href = url;
    }

    if (iframe) {
      iframe.onload = null;
      iframe.style.display = 'none';
      iframe.src = 'about:blank';
    }
    if (spinner) {
      spinner.style.display = 'flex';
    }

    var driveId = gjGetDriveId(url);
    var previewSrc = '';
    if (driveId) {
      previewSrc = 'https://drive.google.com/file/d/' + driveId + '/preview';
    } else if (url.indexOf('/view') !== -1) {
      previewSrc = url.replace('/view', '/preview');
    } else {
      previewSrc = url;
    }

    if (iframe) {
      iframe.onload = function () {
        if (spinner) spinner.style.display = 'none';
        iframe.style.display = 'block';
      };
      iframe.src = previewSrc;
    }

    modal.hidden = false;
    modal.removeAttribute('hidden');
    modal.style.display = 'flex';
    requestAnimationFrame(function () {
      modal.classList.add('show');
    });
  }

  function gjCloseSlipPreview() {
    gjActivePreviewRow = null;
    var modal = document.getElementById('gj-previewModal');
    if (!modal) return;
    modal.classList.remove('show');
    setTimeout(function () {
      modal.hidden = true;
      modal.setAttribute('hidden', '');
      modal.style.display = 'none';
      var iframe = document.getElementById('gj-previewIframe');
      if (iframe) {
        iframe.onload = null;
        iframe.src = 'about:blank';
        iframe.style.display = 'none';
      }
      var spinner = document.getElementById('gj-previewSpinner');
      if (spinner) spinner.style.display = 'flex';
    }, 280);
  }

  async function gjHandleDeleteSingleSlip() {
    if (!gjActivePreviewRow || !gjActivePreviewRow.pdf_url) return;
    var row = gjActivePreviewRow;
    var userNama = (row.users && row.users.nama) || 'Tutor';
    if (!confirm('Hapus file slip gaji ' + userNama + ' dari Google Drive dan sistem?')) return;

    // Otomatis langsung keluar dari popup
    gjCloseSlipPreview();

    // Notifikasi loading
    genioToast('Menghapus slip gaji ' + userNama + ' dari Google Drive & sistem...', 'loading');

    try {
      var s = genioGetSession();
      var driveUrl = row.pdf_url;

      // Hapus file fisik di Google Drive lewat Apps Script (hanya file ini)
      if (window.google && google.script && google.script.run) {
        await new Promise(function (resolve) {
          google.script.run
            .withSuccessHandler(function (res) { resolve(res); })
            .withFailureHandler(function (err) {
              console.warn('Gagal menghapus file di Drive via Apps Script:', err);
              resolve(null);
            })
            .deleteDriveFiles([driveUrl]);
        });
      }

      // Reset pdf_url di Supabase hanya untuk baris ini
      await supaRest('slip_gaji?id=eq.' + row.id, s.access_token, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ pdf_url: null })
      });

      row.pdf_url = null;
      gjRenderList();
      // Notifikasi selesai
      genioToast('Slip gaji ' + userNama + ' berhasil dihapus dari Google Drive & sistem!', 'success');
    } catch (err) {
      genioToast('Gagal menghapus slip gaji: ' + err.message, 'error');
    }
  }

  async function gjProcessBatchSlip() {
    var btn = document.getElementById('gj-cetakSemuaBtn');
    if (btn && btn.dataset.busy === '1') return;

    // Validasi: tombol cetak semua hanya berlaku untuk gaji yang sudah ditransfer
    if (gjState.tab === 'belum') {
      genioToast('Gagal mencetak: Status gaji belum ditransfer. Silakan lakukan transfer terlebih dahulu.', 'error');
      return;
    }

    // Hanya ambil data yang tampil di tabel website sekarang
    var visibleRows = gjGetVisibleRows();

    // Validasi apakah ada data yang belum ditransfer
    var hasUnpaid = visibleRows.some(function (r) { return r.status !== 'sudah_dibayar'; });
    if (hasUnpaid) {
      genioToast('Gagal mencetak slip gaji: Status gaji belum ditransfer.', 'error');
      return;
    }

    var candidates = visibleRows.filter(function (r) {
      return !r.pdf_url;
    });

    if (!candidates.length) {
      if (visibleRows.length > 0) {
        genioToast('Semua slip gaji pada tabel yang tampil saat ini sudah selesai dicetak!', 'info');
      } else {
        genioToast('Tidak ada data pada tabel yang tampil saat ini.', 'info');
      }
      return;
    }

    var originalHtml = btn ? btn.innerHTML : '';
    if (btn) {
      btn.dataset.busy = '1';
      btn.disabled = true;
      btn.style.opacity = '.75';
    }

    var total = candidates.length;
    var successCount = 0;

    for (var i = 0; i < total; i++) {
      var r = candidates[i];
      if (btn) {
        btn.innerHTML = '<span class="spinner" style="width:12px; height:12px; margin-right:6px; border-width:2px; vertical-align:middle; display:inline-block;"></span>Mencetak (' + (i + 1) + '/' + total + ')...';
      }
      genioToast('Mencetak slip ' + (i + 1) + ' dari ' + total + ' (' + ((r.users && r.users.nama) || 'Tutor') + ')...', 'loading');
      try {
        await gjGenerateAndSaveSlip(r);
        successCount++;
      } catch (err) {
        console.error('Gagal mencetak slip gaji ' + r.id, err);
      }
    }

    if (btn) {
      btn.dataset.busy = '0';
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.innerHTML = originalHtml;
    }

    gjRenderList();
    genioToast('Selesai! ' + successCount + ' slip gaji pada tabel berhasil dicetak ke Google Drive.', 'success');
  }

  var gjPendingDeleteRows = [];
  var gjConfirmCallback = null;

  function gjOpenGenericConfirmModal(opts) {
    gjConfirmCallback = opts.onConfirm || null;
    var modal = document.getElementById('gj-confirmModal');
    if (!modal) return;

    var titleEl = document.getElementById('gj-confirmModalTitle');
    var descEl = document.getElementById('gj-confirmModalDesc');
    var okBtn = document.getElementById('gj-confirmOkBtn');

    if (titleEl) titleEl.textContent = opts.title || 'Konfirmasi';
    if (descEl) {
      if (opts.descHtml) descEl.innerHTML = opts.descHtml;
      else descEl.textContent = opts.desc || '';
    }
    if (okBtn) {
      okBtn.textContent = opts.okText || 'Ya, Lanjutkan';
      okBtn.style.background = opts.isDanger ? 'var(--red)' : 'var(--blue)';
      okBtn.style.color = '#fff';
    }

    modal.hidden = false;
    modal.removeAttribute('hidden');
    modal.style.display = 'flex';
    requestAnimationFrame(function () {
      modal.classList.add('show');
    });
  }

  function gjOpenConfirmModal(targetRows) {
    gjPendingDeleteRows = targetRows || [];
    gjOpenGenericConfirmModal({
      title: 'Hapus slip gaji tabel ini?',
      desc: 'Sebanyak ' + gjPendingDeleteRows.length + ' file PDF slip gaji yang sedang tampil di tabel saat ini akan dihapus permanen dari Google Drive dan database.',
      okText: 'Ya, hapus',
      isDanger: true,
      onConfirm: async function () {
        await gjHandleDeleteAllSlips();
      }
    });
  }

  function gjOpenBatalLunasModal(row) {
    var userNama = (row.users && row.users.nama) || 'Tutor';
    var hasPdf = !!row.pdf_url;
    var desc = 'Status gaji tutor <strong>' + genioEscapeHtml(userNama) + '</strong> akan dikembalikan menjadi <strong>Belum Ditransfer</strong>.';
    if (hasPdf) {
      desc += '<br><span style="color:#ff3b30; font-weight:500; font-size:10.5px;">File PDF slip gaji di Google Drive akan otomatis dihapus permanen.</span>';
    }
    desc += '<br><span style="color:var(--ink-soft); font-size:10px; margin-top:4px; display:inline-block;">Fitur ini berguna jika tutor baru saja menambah atau merevisi presensi sehingga nominal gaji perlu dihitung ulang.</span>';

    gjOpenGenericConfirmModal({
      title: 'Batalkan status lunas?',
      descHtml: desc,
      okText: 'Batalkan Lunas',
      isDanger: true,
      onConfirm: async function () {
        gjCloseConfirmModal();
        var s = genioGetSession();
        genioToast('Membatalkan status lunas ' + userNama + '...', 'loading');

        try {
          // 1. Hapus file fisik di Google Drive jika ada PDF
          if (hasPdf && row.pdf_url) {
            if (window.google && google.script && google.script.run) {
              await new Promise(function (resolve) {
                google.script.run
                  .withSuccessHandler(function (res) { resolve(res); })
                  .withFailureHandler(function (err) {
                    console.warn('Gagal menghapus file di Drive via Apps Script:', err);
                    resolve(null);
                  })
                  .deleteDriveFiles([row.pdf_url]);
              });
            }
          }

          var live = gjState.tutorLiveStats && gjState.tutorLiveStats[row.tutor_id];
          var freshPertemuan = live ? live.pertemuan : row.total_pertemuan;
          var freshTotalGaji = live ? live.totalGaji : row.total_gaji;

          // 2. Reset status di Supabase sekaligus perbarui total_pertemuan & total_gaji terbaru
          await supaRest('slip_gaji?id=eq.' + row.id, s.access_token, {
            method: 'PATCH',
            headers: { 'Prefer': 'return=minimal' },
            body: JSON.stringify({
              status: 'belum_dibayar',
              total_pertemuan: freshPertemuan,
              total_gaji: freshTotalGaji,
              tanggal_dibayar: null,
              dibayar_oleh: null,
              pdf_url: null
            })
          });

          // 3. Update memori lokal
          row.status = 'belum_dibayar';
          row.total_pertemuan = freshPertemuan;
          row.total_gaji = freshTotalGaji;
          row.tanggal_dibayar = null;
          row.dibayar_oleh = null;
          row.pdf_url = null;

          genioToast('Status gaji ' + userNama + ' berhasil dikembalikan ke Belum Ditransfer' + (hasPdf ? ' dan berkas Drive telah dihapus.' : '.'), 'success');
          gjLoadAll();
        } catch (err) {
          genioToast('Gagal membatalkan status lunas: ' + err.message, 'error');
        }
      }
    });
  }

  function gjCloseConfirmModal() {
    var modal = document.getElementById('gj-confirmModal');
    if (!modal) return;
    modal.classList.remove('show');
    setTimeout(function () {
      modal.hidden = true;
      modal.setAttribute('hidden', '');
      modal.style.display = 'none';
    }, 280);
  }

  async function gjHandleDeleteAllSlips() {
    var targetRows = gjPendingDeleteRows || [];
    if (!targetRows.length) {
      gjCloseConfirmModal();
      return;
    }

    // 1. Otomatis keluar/tutup popup langsung saat tombol ditekan
    gjCloseConfirmModal();

    // 2. Berikan notifikasi loading
    var count = targetRows.length;
    genioToast('Menghapus ' + count + ' file slip gaji dari Google Drive & database...', 'loading');

    try {
      var s = genioGetSession();

      // Kumpulkan URL Drive HANYA dari baris yang tampil di tabel ini
      var driveUrls = targetRows.map(function (r) { return r.pdf_url; }).filter(Boolean);
      var rowIds = targetRows.map(function (r) { return r.id; });

      // Hapus berkas fisik di Google Drive (hanya file-file dari baris ini)
      if (driveUrls.length && window.google && google.script && google.script.run) {
        await new Promise(function (resolve) {
          google.script.run
            .withSuccessHandler(function (res) { resolve(res); })
            .withFailureHandler(function (err) {
              console.warn('Gagal menghapus file di Drive via Apps Script:', err);
              resolve(null);
            })
            .deleteDriveFiles(driveUrls);
        });
      }

      // Reset pdf_url di Supabase HANYA untuk row id baris yang tampil ini
      if (rowIds.length) {
        await supaRest('slip_gaji?id=in.(' + rowIds.join(',') + ')', s.access_token, {
          method: 'PATCH',
          headers: { 'Prefer': 'return=minimal' },
          body: JSON.stringify({ pdf_url: null })
        });
      }

      // Reset pada memori state lokal baris tersebut
      targetRows.forEach(function (r) {
        r.pdf_url = null;
      });

      gjPendingDeleteRows = [];
      gjRenderList();

      // 3. Notifikasi lagi jika sudah selesai dihapus
      genioToast(count + ' file slip gaji pada tabel berhasil dihapus dari Google Drive & sistem!', 'success');
    } catch (err) {
      genioToast('Gagal menghapus slip gaji: ' + err.message, 'error');
    }
  }

  async function gjMarkAsPaid(id) {
    try {
      var s = genioGetSession();
      await supaRest('slip_gaji?id=eq.' + id, s.access_token, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ status: 'sudah_dibayar', tanggal_dibayar: new Date().toISOString(), dibayar_oleh: s.user_id })
      });
      genioToast('Gaji berhasil ditandai sudah dibayar', 'success');
      gjLoadAll();
    } catch (err) {
      genioToast('Gagal memproses: ' + err.message, 'error');
    }
  }
</script>
